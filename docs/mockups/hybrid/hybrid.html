<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하이브리드 시안</title>
<link rel="stylesheet" href="../../../desktop/fonts/pretendard.css">
<link rel="stylesheet" href="../refresh/mock.css">
<style>
/* 앱 창(1160×800)을 흉내 낸 틀. 레일·머리줄은 지금 앱 그대로이고, 이 시안이 바꾸는 곳은 단계 문장(메인·보조)과 입력창의 AI 알약(모델·노력·추론)이다 */
.win { display: flex; width: 1160px; height: 800px; border-radius: var(--r-xl); background: var(--page); box-shadow: var(--shadow); overflow: hidden; }
.solo { margin: 0; }
.solo .win { border-radius: 0; box-shadow: none; }
.col { display: flex; flex: 1; flex-direction: column; min-width: 0; }
.tb { display: flex; flex: none; align-items: center; height: 38px; box-shadow: 0 1px 0 var(--hair); }
.wc { display: flex; margin-left: auto; }
.wc i { display: grid; place-items: center; width: 36px; height: 38px; color: var(--muted); }
.wc svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; }
.content { display: flex; flex: 1; flex-direction: column; min-height: 0; padding: 18px 32px 16px; overflow: hidden; }
.body { display: flex; flex: 1; flex-direction: column; gap: 10px; min-height: 0; overflow: hidden; }

.rail { display: flex; flex: none; flex-direction: column; gap: 2px; width: 224px; padding: 12px; background: var(--rail-bg); box-shadow: 1px 0 0 var(--hair); }
.rail-brand { display: flex; align-items: center; gap: 9px; height: 32px; margin-bottom: 14px; padding: 0 8px; font-size: var(--text-lg); font-weight: 700; letter-spacing: -0.02em; }
.rail-brand img { width: 22px; height: 22px; }
.rail-section { margin: 0 0 6px; padding: 0 10px; color: var(--muted); font-size: var(--text-xs); font-weight: 600; }
.proj { display: grid; grid-template-columns: 24px minmax(0, 1fr); align-items: center; gap: 0 10px; padding: 8px 10px 8px 8px; border-radius: var(--r-md); }
.proj[data-active] { background: var(--bg); box-shadow: var(--shadow-1); }
.proj-mark { display: grid; grid-row: span 2; place-items: center; width: 24px; height: 24px; border-radius: 8px; background: var(--chip); color: var(--muted); font-size: var(--text-xs); font-weight: 700; }
.proj[data-active] .proj-mark { background: var(--accent-wash); color: var(--accent-ink); }
.proj-name { font-size: var(--text-md); font-weight: 600; }
.proj-note { color: var(--muted); font-size: var(--text-xs); }
.rail-add { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: var(--r-md); color: var(--muted); font-size: var(--text-md); font-weight: 600; }
.rail-add .icon { width: 14px; height: 14px; }
.rail-add-group { display: grid; gap: 2px; margin-top: 18px; }

/* 머리줄과 작업 모드 */
.ph { display: flex; flex: none; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 6px; }
.ph h1 { font-size: var(--title-md); font-weight: 700; letter-spacing: -0.015em; }
.path { margin-top: 2px; color: var(--faint); font: var(--text-xs) / 1.5 var(--mono); }
.mode { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; border-radius: 999px; background: var(--chip); isolation: isolate; }
.mode span { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 30px; padding: 0 16px; color: var(--muted); font-size: var(--text-sm); font-weight: 600; }
.mode span[data-on] { color: var(--bg); }
.mode .icon { width: 13px; height: 13px; }
.mode i { position: absolute; inset: 3px auto 3px 3px; z-index: -1; width: calc((100% - 6px) / 2); border-radius: 999px; background: var(--ink); box-shadow: 0 1px 2px rgb(23 32 51 / 0.22), 0 6px 14px -6px rgb(23 32 51 / 0.5); }
.mode[data-mode="build"] i { translate: 100% 0; }

/* 단계 막대 */
.bars { display: flex; flex: none; gap: 5px; margin: 0; padding: 11px 14px 9px; border-radius: var(--r-lg); background: var(--bg); box-shadow: var(--shadow-1); list-style: none; }
.bar { display: grid; flex: 1 1 0; gap: 6px; min-width: 0; color: var(--faint); font-size: var(--text-xs); font-weight: 600; }
.bar[data-state="active"], .bar[data-state="next"] { flex-grow: 2.6; }
.bar i { display: block; height: 4px; border-radius: 4px; background: var(--hair); }
.bar[data-state="done"] i { background: var(--add); }
.bar[data-state="active"] i { background: linear-gradient(90deg, var(--accent) 0 38%, var(--accent-line) 38%); }
.bar[data-state="done"] { color: var(--ink); }
.bar[data-state="active"] { color: var(--accent-ink); }
.bar span { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.bar small { color: inherit; font-size: inherit; font-weight: 500; }

/* AI 표식: 제공자 로고. Claude는 브랜드 색, OpenAI는 글자색 */
.logo { flex: none; width: 15px; height: 15px; }
.logo[data-p="claude"] { color: #d97757; }
.logo[data-p="codex"] { color: var(--ink); }
.sprite { position: absolute; width: 0; height: 0; }

/* 단계 문장: 단계마다 문장 하나(또는 둘). 문장은 말 조각과 알약을 같은 간격(8px)으로 늘어놓고, 조사는 앞 알약에 붙인다. 줄이 넘치면 알약째로 줄을 바꾼다 */
.rules { display: grid; flex: none; padding: 4px 18px; border-radius: var(--r-lg); background: var(--bg); box-shadow: var(--shadow-1); }
.rule { display: grid; grid-template-columns: 4.8em minmax(0, 1fr); column-gap: 16px; padding: 13px 0; }
.rule + .rule { box-shadow: 0 -1px 0 var(--hair); }
.rule-name { padding-top: 7px; color: var(--muted); font-size: var(--text-xs); font-weight: 700; }
.sentence { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 8px; min-height: 34px; color: var(--ink-2); font-size: var(--text-sm); line-height: 1.5; }
.sentence + .sentence { margin-top: 8px; }
.sentence .j { margin-left: -4px; }
.sel { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 11px 0 13px; border: 0; border-radius: 999px; background: var(--accent-wash); box-shadow: inset 0 0 0 1px var(--accent-line); color: var(--accent-ink); font-size: var(--text-sm); font-weight: 600; white-space: nowrap; }
.sel .icon { width: 10px; height: 10px; opacity: 0.8; }
.sel[data-ai="main"] { background: var(--bg); box-shadow: inset 0 0 0 1px var(--hair-strong), var(--shadow-1); color: var(--ink); }
.sel[data-open] { box-shadow: inset 0 0 0 1px var(--accent); }
/* 횟수 지정: 알약 안에서 줄이고 늘린다(0~5, 0이면 되돌리지 않음). 글자를 눌러 직접 입력할 필요가 없어 목록에서 비슷한 항목을 찾는 일이 없다 */
.count { display: inline-flex; align-items: center; height: 32px; padding: 0 4px; border-radius: 999px; background: var(--accent-wash); box-shadow: inset 0 0 0 1px var(--accent-line); color: var(--accent-ink); font-size: var(--text-sm); font-weight: 650; }
.count button { display: grid; place-items: center; width: 24px; height: 24px; border: 0; border-radius: 50%; background: none; color: inherit; font-size: 17px; font-weight: 500; line-height: 1; }
.count button:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.count button[disabled] { opacity: 0.35; }
.count b { min-width: 24px; text-align: center; font-variant-numeric: tabular-nums; }
.tip { margin-top: 8px; padding: 0 4px; color: var(--muted); font-size: var(--text-xs); }
.tip b { color: var(--ink); font-weight: 650; }
.hint-down { display: inline-flex; align-items: center; gap: 7px; }
.hint-down .icon { width: 12px; height: 12px; }

.greet-title { margin-top: 6px; font-size: var(--title-md); font-weight: 700; letter-spacing: -0.015em; line-height: 1.3; }
.greet-lead { margin-top: 2px; color: var(--ink-2); font-size: var(--text-md); }

/* 입력창. 모델·노력(추론)은 단계 선택과 무관하게 AI마다 알약 하나로 늘 보인다 */
.composer { position: relative; display: grid; flex: none; margin-top: auto; border-radius: var(--r-xl); background: var(--bg); box-shadow: var(--shadow-2); }
.c-text { min-height: 56px; padding: 16px 18px 6px; color: var(--ink); font-size: var(--text-md); line-height: 1.6; }
.c-text[data-empty] { color: var(--faint); }
.c-bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px 12px; box-shadow: 0 -1px 0 var(--hair); }
.c-pills { display: flex; flex: 1; align-items: center; gap: 8px; min-width: 0; }
.wrap { position: relative; }
.ai { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 11px 0 12px; border: 0; border-radius: 999px; background: color-mix(in srgb, var(--tone) 11%, var(--bg)); color: var(--ink); font-size: var(--text-sm); font-weight: 600; white-space: nowrap; transition: box-shadow 0.4s var(--ease-out); }
.ai[data-p="claude"] { --tone: #d97757; }
.ai[data-p="codex"] { --tone: #5b6472; }
.ai .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--faint); }
.ai .icon { width: 10px; height: 10px; color: var(--muted); }
.ai[data-open] { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tone) 45%, transparent); }
.ai[data-main] { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tone) 40%, transparent); }
.ai .tagline { display: inline-flex; align-items: center; gap: 5px; margin-left: 2px; padding-left: 9px; box-shadow: inset 1px 0 0 var(--hair-strong); color: var(--accent-ink); font-size: var(--text-xs); font-weight: 650; }
.ai .tagline::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.ai[data-live] .tagline::before { width: 9px; height: 9px; background: none; border: 1.5px solid var(--accent); border-top-color: transparent; animation: spin 1s linear infinite; }
.ai .assist { margin-left: 2px; padding-left: 9px; box-shadow: inset 1px 0 0 var(--hair-strong); color: var(--muted); font-size: var(--text-xs); font-weight: 600; }
/* 최고 단계(Max)에서는 알약의 테두리와 단계 이름이 붉어진다 */
.ai[data-max] { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--del) 45%, transparent); }
.ai[data-max] .ai-level { color: var(--del); }
@keyframes spin { to { rotate: 360deg; } }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 999px; background: var(--chip); color: var(--ink); font-size: var(--text-sm); font-weight: 600; white-space: nowrap; }
.chip small { color: var(--muted); font-size: var(--text-xs); font-weight: 500; }
.chip .icon { width: 13px; height: 13px; color: var(--muted); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn-fill); }
.chip .time-sub { color: var(--muted); font-weight: 500; }
.start { display: inline-flex; flex: none; align-items: center; gap: 8px; height: 38px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--accent); box-shadow: var(--glow); color: #fff; font-size: var(--text-md); font-weight: 650; }
.start[data-tone="stop"] { background: var(--bg); box-shadow: inset 0 0 0 1px var(--hair-strong); color: var(--ink-2); }
.composer[data-run] .c-text { min-height: 0; padding: 12px 18px; color: var(--muted); font-size: var(--text-sm); }

/* 파형: 알약과 슬라이드가 같은 모양을 쓴다. 높을수록 마루가 커진다 */
.wave { flex: none; width: 18px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; overflow: hidden; }
.wave[data-level="3"] { color: #d9822b; }
.wave[data-level="4"] { color: var(--del); }

/* 팝오버(알약 위로 열린다) */
.pop { position: absolute; bottom: calc(100% + 10px); left: 0; z-index: 5; width: 360px; padding: 8px; border-radius: var(--r-lg); background: var(--bg); box-shadow: var(--shadow); }
.pop.pop-sel { top: calc(100% + 8px); bottom: auto; width: 300px; padding: 4px; border-radius: 12px; }
.pop-head { display: flex; align-items: center; gap: 10px; padding: 8px 10px 10px; box-shadow: 0 1px 0 var(--hair); }
.pop-head .logo { width: 20px; height: 20px; }
.pop-head b { display: block; font-size: var(--text-sm); font-weight: 700; line-height: 1.3; }
.pop-head small { display: block; color: var(--muted); font-size: var(--text-xs); }
.pop-sec { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 6px; color: var(--muted); font-size: var(--text-xs); font-weight: 700; }
.pop-sec small { color: var(--faint); font-weight: 500; }
.rows { display: grid; gap: 1px; max-height: 168px; padding: 0 2px; overflow-y: auto; scrollbar-width: thin; }
.row { display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 5px 10px; border-radius: 10px; color: var(--ink-2); }
.row[data-on] { background: var(--chip); color: var(--ink); }
.row b { display: block; font-size: var(--text-sm); font-weight: 600; line-height: 1.35; }
.row small { display: block; color: var(--muted); font-size: var(--text-xs); line-height: 1.4; }
.row .grow { flex: 1; min-width: 0; }
.row .icon { width: 15px; height: 15px; }
.row .ok { color: var(--accent-ink); opacity: 0; }
.row[data-on] .ok { opacity: 1; }
.row.sub { min-height: 30px; padding-left: 38px; }
.row.sub b { font-weight: 500; }
.row .fam { width: 18px; height: 18px; color: var(--muted); }
.pop-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 2px 0; padding: 10px 10px 4px; box-shadow: 0 -1px 0 var(--hair); color: var(--muted); font-size: var(--text-xs); }
.pop-foot b { color: var(--ink); font-weight: 650; }
.mains { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.mains span { padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--ink-2); font-weight: 600; }
.switch { position: relative; flex: none; width: 34px; height: 20px; border-radius: 999px; background: var(--hair-strong); }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); box-shadow: 0 1px 2px rgb(0 0 0 / 0.25); }
.switch[data-on] { background: var(--accent); }
.switch[data-on]::after { left: 16px; }
.opt { display: grid; grid-template-columns: 18px minmax(0, 1fr) 16px; align-items: center; column-gap: 10px; padding: 7px 10px; border-radius: 8px; }
.opt[data-on] { background: var(--chip); }
.opt b { display: block; font-size: var(--text-sm); font-weight: 600; line-height: 1.35; }
.opt small { display: block; color: var(--muted); font-size: var(--text-xs); line-height: 1.45; }
.opt .icon { width: 14px; height: 14px; color: var(--accent-ink); opacity: 0; }
.opt[data-on] .icon { opacity: 1; }
.follow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 2px 8px; padding: 9px 12px; border-radius: 12px; background: var(--surface); }
.follow b { display: block; font-size: var(--text-sm); font-weight: 650; }
.follow small { display: block; color: var(--muted); font-size: var(--text-xs); line-height: 1.4; }

/* 노력·추론 슬라이드. 단계가 오를수록 선과 글자가 ink → 주황 → 붉은색으로 물든다. Max에서는 손잡이에 은은한 빛이 돌고, 도착하는 순간 고리가 한 번만 퍼진다 */
.slider { --lv: 2; --c: var(--ink); position: relative; margin: 0 2px; padding: 12px 14px 14px; border-radius: 14px; background: var(--surface); }
.slider[data-level="3"] { --c: #c9731f; }
.slider[data-level="4"] { --c: var(--del); }
.slider[data-off] { opacity: 0.45; pointer-events: none; }
.s-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.s-name { display: inline-flex; align-items: center; gap: 8px; font-size: var(--text-lg); font-weight: 750; letter-spacing: -0.01em; color: var(--c); transition: color 0.3s var(--ease-out); }
.s-name .wave { width: 22px; height: 18px; }
.s-tag { padding: 2px 10px; border-radius: 999px; background: var(--chip); color: var(--muted); font-size: var(--text-xs); font-weight: 650; }
.slider[data-level="3"] .s-tag { background: color-mix(in srgb, #c9731f 14%, var(--bg)); color: #a85d12; }
.slider[data-level="4"] .s-tag { background: color-mix(in srgb, var(--del) 14%, var(--bg)); color: var(--del); }
.area { position: relative; height: 44px; margin: 6px 14px 0; }
.track { position: absolute; inset: 19px 0 auto; height: 6px; border-radius: 6px; background: var(--hair-strong); overflow: hidden; }
.fill { position: absolute; inset: 0 auto 0 0; width: calc(var(--lv) * 25%); border-radius: 6px; background: var(--c); transition: width 0.4s var(--ease-out), background-color 0.3s var(--ease-out); }
.stops i { position: absolute; top: 21px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--bg); opacity: 0.9; }
.stops i:nth-child(1) { left: 0; } .stops i:nth-child(2) { left: 25%; } .stops i:nth-child(3) { left: 50%; } .stops i:nth-child(4) { left: 75%; } .stops i:nth-child(5) { left: 100%; }
.thumb { position: absolute; top: 8px; left: calc(var(--lv) * 25%); display: grid; place-items: center; width: 30px; height: 30px; margin-left: -15px; border-radius: 50%; background: var(--bg); box-shadow: var(--shadow-1), 0 0 0 1.5px var(--hair-strong); color: var(--c); transition: left 0.45s cubic-bezier(0.34, 1.4, 0.5, 1), box-shadow 0.3s var(--ease-out); }
.thumb .wave { width: 18px; height: 16px; }
.slider[data-level="3"] .thumb { box-shadow: var(--shadow-1), 0 0 0 1.5px var(--c); }
.slider[data-level="4"] .thumb { box-shadow: var(--shadow-1), 0 0 0 1.5px var(--c), 0 0 12px 1px color-mix(in srgb, var(--del) 35%, transparent); }
.slider.burst .thumb::after { content: ""; position: absolute; inset: -1px; border-radius: 50%; box-shadow: 0 0 0 2px color-mix(in srgb, var(--del) 55%, transparent); animation: ring 0.7s ease-out forwards; }
@keyframes ring { from { scale: 1; opacity: 1; } to { scale: 1.9; opacity: 0; } }
.slider input { position: absolute; inset: 0 -14px; width: calc(100% + 28px); height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.ticks { position: relative; height: 18px; margin: 0 14px; }
.ticks span { position: absolute; translate: -50% 0; color: var(--faint); font-size: var(--text-xs); font-weight: 600; white-space: nowrap; transition: color 0.3s; }
.ticks span:nth-child(1) { left: 0; } .ticks span:nth-child(2) { left: 25%; } .ticks span:nth-child(3) { left: 50%; } .ticks span:nth-child(4) { left: 75%; } .ticks span:nth-child(5) { left: 100%; }
.ticks span[data-on] { color: var(--c); }
.s-desc { margin-top: 8px; color: var(--ink-2); font-size: var(--text-sm); line-height: 1.55; }

/* 실행 중 */
.runcard { display: grid; flex: none; gap: 10px; padding: 16px 18px; border-radius: var(--r-lg); background: var(--bg); box-shadow: var(--shadow-1); }
.runcard h2 { font-size: var(--text-lg); font-weight: 650; }
.pair { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.pair .side { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-md); background: var(--surface); }
.pair .side[data-role="main"] { background: var(--accent-wash); box-shadow: inset 0 0 0 1px var(--accent-line); }
.pair b { display: block; font-size: var(--text-sm); font-weight: 650; }
.pair small { display: block; color: var(--muted); font-size: var(--text-xs); }
.pair .link { color: var(--faint); font-size: var(--text-xs); font-weight: 600; text-align: center; }
.tag { display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px; border-radius: 999px; background: var(--accent-wash); color: var(--accent-ink); font-size: var(--text-xs); font-weight: 600; }

.m-scene { display: grid; justify-items: start; gap: 14px; overflow-x: auto; }
.m-main { max-width: 1240px; }
.solo .m-main { display: block; max-width: none; padding: 0; }
@media (prefers-reduced-motion: reduce) {
    :root:not([data-motion="on"]) :is(.ai[data-live] .tagline::before, .slider.burst .thumb::after) { animation: none !important; }
}
</style>
</head>
<body>
<header class="m-top" id="m-top">
    <h1>하이브리드 시안</h1>
    <nav class="m-nav" aria-label="시안 바로가기">
        <a href="#ready">신규 개발 시작 전</a><a href="#claude">Claude 알약</a><a href="#max">노력 최고 단계</a><a href="#codex">Codex 알약</a><a href="#assist">보조 고르기</a><a href="#maintain">유지 보수</a><a href="#run">실행 중</a>
    </nav>

const query = new URLSearchParams(location.search);
const only = query.get("scene");

const logo = (provider) => `<svg class="logo" data-p="${provider}" aria-hidden="true"><use href="#logo-${provider === "codex" ? "openai" : "claude"}"/></svg>`;
const wavePath = (level) => `M-7 8q2-${(1 + level * 1.7).toFixed(1)} 4 0${"t4 0".repeat(8)}`;
const wave = (level) => `<svg class="wave" viewBox="0 0 18 16" data-level="${level}" aria-hidden="true"><path d="${wavePath(level)}"/></svg>`;
const NAMES = { claude: "Claude", codex: "Codex" };
const other = (provider) => (provider === "claude" ? "codex" : "claude");

// 단계(0~4)마다 이름·한 줄 이름표·설명. Claude는 노력, Codex는 추론이라 이름표만 조금 다르다.
const LEVELS = [
    { name: "Low", tags: ["가장 빠르게", "가장 빠르게"], desc: "생각을 거의 줄이고 바로 해요. 이름 바꾸기처럼 간단한 수정에 알맞아요." },
    { name: "Medium", tags: ["가볍게", "가볍게"], desc: "빠르게 하면서 기본 확인은 해요. 작은 기능이나 문서를 고칠 때 알맞아요." },
    { name: "High", tags: ["기본값", "깊게"], desc: "대부분의 작업에 알맞은 균형이에요. 고치기 전에 충분히 읽고 생각해요." },
    { name: "Extra High", tags: ["더 깊게", "더 깊게"], desc: "한참 더 생각해요. 어려운 버그를 찾거나 구조를 바꿀 때 써요." },
    { name: "Max", tags: ["가장 깊게", "가장 깊게"], desc: "가능한 만큼 깊이 생각해요. 가장 오래 걸리고 사용량도 가장 많이 써요." }
];
const TERMS = { claude: "노력", codex: "추론" };

const titlebar = `<div class="tb"><div class="wc"><i><svg viewBox="0 0 12 12"><path d="M2.5 6h7"/></svg></i><i><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1.5"/></svg></i><i><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></i></div></div>`;
const rail = (note) => `<aside class="rail">

    <h2 class="rail-section">프로젝트</h2>

</aside>`;

const head = (mode) => `<header class="ph"><div><h1>hanbit-booking</h1><div class="path">E:/Workspaces/Demo/hanbit-booking</div></div>
    <div class="mode" data-mode="${mode}"><i></i><span ${mode === "maintain" ? "data-on" : ""}>${icon("infinity")}유지 보수</span><span ${mode === "build" ? "data-on" : ""}>${icon("spark")}신규 개발</span></div></header>`;

const BARS = [["기획", "만들 것을 정리해요"], ["디자인", "화면을 그려요"], ["개발", "코드를 짜고 커밋해요"], ["테스트/QA", "확인하고 고쳐요"], ["보안검토", "약점을 찾아 고쳐요"]];
const bars = (states) => `<ol class="bars">${BARS.map(([label, detail], index) => `<li class="bar" data-state="${states[index]}"><i></i><span><b>${label}</b>${["done", "active", "next"].includes(states[index]) ? `<small>${states[index] === "done" ? "마쳤어요" : detail}</small>` : ""}</span></li>`).join("")}</ol>`;

// 문장 속 알약. 메인은 제공자 로고와 함께, 보조는 같은 모양에 상대 AI의 로고를 단다.
const sel = (inner, { ai = "", open = false } = {}) => `<span class="sel" ${ai ? `data-ai="${ai}"` : ""} ${open ? "data-open" : ""}>${inner}${icon("chevron")}</span>`;
const mainSel = (provider, open = false) => sel(`${logo(provider)}${NAMES[provider]}가 메인`, { ai: "main", open });
const ASSIST_TEXT = { none: () => "보조 없이", compare: (provider) => `${NAMES[provider]}가 따로 안을 내서`, debate: (provider) => `${NAMES[provider]}와 협의해서` };
const assistSel = (main, mode, open = false) => sel(`${mode === "none" ? "" : logo(other(main))}${ASSIST_TEXT[mode](other(main))}`, { open });
const AFTER = { compare: "끝나면 멈추고 두 안 중에서 고를게요.", debate: "끝나면 멈추고 못 맞춘 쟁점만 고를게요." };
const gateSel = sel("멈추고 확인 받을게요");

// 문장은 말 조각과 알약을 같은 간격으로 늘어놓는다. "~"로 시작하는 조각은 조사라서 앞 알약에 바짝 붙인다.
const S = (...parts) => `<div class="sentence">${parts.map((part) => (part.startsWith("<") ? part : part.startsWith("~") ? `<span class="j">${part.slice(1)}</span>` : `<span>${part}</span>`)).join("")}</div>`;
const count = (value, max = 5) => `<span class="count" role="spinbutton" aria-valuenow="${value}" aria-valuemin="0" aria-valuemax="${max}"><button type="button" aria-label="줄이기" ${value <= 0 ? "disabled" : ""}>−</button><b>${value}</b><button type="button" aria-label="늘리기" ${value >= max ? "disabled" : ""}>+</button></span>`;
const rule = (name, html) => `<div class="rule"><b class="rule-name">${name}</b><div>${html}</div></div>`;

const RULES = () => `<div class="rules">
    ${rule("기획", S("기획은", mainSel("codex"), "~이고,", assistSel("codex", "debate"), "진행하고,", AFTER.debate))}
    ${rule("디자인", `${S("디자인은", sel("HTML 와이어프레임"), "형식으로 만들어요.")}${S(mainSel("claude"), "~이고,", assistSel("claude", "none"), "진행하고, 끝나면", gateSel, "~.")}`)}
    ${rule("개발", S("개발은", mainSel("claude"), "~으로 코드를 짜고 커밋해요."))}
    ${rule("테스트/QA", S("테스트/QA는", mainSel("claude"), "~이고, 실패하면 개발로", count(3), "~번까지 되돌려 다시 고쳐요."))}
    ${rule("보안검토", S("보안검토는", mainSel("codex"), "~이고, 심각한 문제가 남으면 개발로", count(3), "~번까지 되돌려 고쳐요."))}
</div>`;

// 입력창의 AI 알약. 모델과 노력(추론) 단계를 알약 하나로 묶고, 단계 선택이 바뀌어도 모양이 바뀌지 않는다.
// 메인 표시는 유지 보수에서만 붙고, 실행 중에는 일하는 쪽에 도는 고리가 붙는다. 노력이 Max면 알약 테두리와 단계 이름이 붉어진다.
const AI = { claude: { model: "Opus 4.8", level: 2 }, codex: { model: "GPT-6.1-Sol", level: 1 } };
const aiPill = (provider, { open = false, main = false, live = "", assist = "", level = AI[provider].level } = {}) => {
    const { model } = AI[provider];

    return `<button type="button" class="ai" data-p="${provider}" ${open ? "data-open" : ""} ${main ? "data-main" : ""} ${live ? "data-live" : ""} ${level === 4 ? "data-max" : ""}>${logo(provider)}<b>${model}</b><i class="dot"></i><span class="ai-wave">${wave(level)}</span><span class="ai-level">${LEVELS[level].name}</span>${icon("chevron")}${main || live ? `<span class="tagline">${live || "메인"}</span>` : ""}${assist ? `<span class="assist">${assist}</span>` : ""}</button>`;
};

// 슬라이드. provider로 이름(노력/추론)과 이름표를 고르고, off면 Codex 설정을 따르는 중이라 흐리게 잠근다.
const slider = (provider, level, { off = false } = {}) => {
    const info = LEVELS[level];
    const nth = provider === "codex" ? 1 : 0;

    return `<div class="slider" data-p="${provider}" data-level="${level}" style="--lv:${level}" ${off ? "data-off" : ""}>
        <div class="s-top"><span class="s-name"><span class="s-wave">${wave(level)}</span><b class="lv-name">${info.name}</b></span><span class="s-tag">${info.tags[nth]}</span></div>
        <div class="area"><div class="track"><i class="fill"></i></div><div class="stops"><i></i><i></i><i></i><i></i><i></i></div>
            <div class="thumb">${wave(level)}</div>
            <input type="range" min="0" max="4" step="1" value="${level}" aria-label="${TERMS[provider]}">
        </div>
        <div class="ticks">${LEVELS.map((item, index) => `<span ${index === level ? "data-on" : ""}>${item.name}</span>`).join("")}</div>
        <p class="s-desc">${info.desc}</p>
    </div>`;
};

const row = (inner, { on = false, sub = false } = {}) => `<div class="row ${sub ? "sub" : ""}" ${on ? "data-on" : ""}>${inner}<span class="grow"></span>${icon("check", "icon ok")}</div>`;
const fam = (symbol) => `<svg class="icon fam" aria-hidden="true"><use href="#icon-${symbol}"/></svg>`;
const famRow = (symbol, name, desc, on) => row(`${fam(symbol)}<span class="grow"><b>${name}</b><small>${desc}</small></span>`, { on });

const mainsFoot = (phases) => `<div class="pop-foot"><span>메인으로 맡은 단계</span><span class="mains">${phases.map((phase) => `<span>${phase}</span>`).join("")}</span></div>`;

const claudePop = (foot, level = 2) => `<div class="pop">

        ${famRow("waves", "Sonnet", "균형 · 최신 버전", false)}

    </div>
    <div class="pop-sec">노력<small>얼마나 애써서 생각할지 정해요</small></div>

    ${foot}
</div>`;

const codexPop = (foot, level = 1) => `<div class="pop">
    <div class="pop-head">${logo("codex")}<span><b>Codex</b><small>모델과 추론</small></span></div>
    <div class="pop-sec">모델</div>
    <div class="rows">
        ${row(`<span class="grow"><b>기본 모델</b><small>Codex 설정 · GPT-6.1-Sol</small></span>`)}

    ${slider("codex", level)}
    ${foot}

const composer = ({ text, empty = false, start, pills, run = false }) => `<form class="composer" ${run ? "data-run" : ""}>
    <div class="c-text" ${empty ? "data-empty" : ""}>${text}</div>

const startBtn = (label) => `<button type="button" class="start">${icon("play")}${label}</button>`;
const allowChip = `<span class="chip">${icon("shield")}허용<small>2개</small><i class="dot"></i></span>`;
const endChip = `<span class="chip">${icon("clock")}<b>내일 07:00</b><small class="time-sub">21시간 뒤</small></span>`;

const SCENES = {
    ready: {
        name: "신규 개발 · 시작 전",

            <p class="tip">보조는 기획·디자인에서만 붙여요. 개발·테스트/QA·보안검토는 메인만 고르고, 다른 AI가 검토하게 하려면 그 단계의 메인을 반대쪽으로 두면 돼요.</p>
            ${composer({ text: TASK, start: startBtn("기획 시작"), pills: `${aiPill("claude")}${aiPill("codex")}${allowChip}${endChip}` })}</div>`

    maintain: {
        name: "유지 보수 · 시작 전",
        desc: "단계가 없는 유지 보수에서는 AI 하나가 작업을 해요. 그 AI의 알약에 `● 메인`이 붙고, 팝오버 아래 스위치로 작업할 AI를 바꿔요. 하나를 켜면 다른 쪽은 꺼져요. 알약 크기와 위치는 신규 개발과 같아요.",

const sceneHtml = (key) => {
    const scene = SCENES[key];

    return `<div class="win">${rail(scene.rail)}<div class="col">${titlebar}<div class="content">${scene.body()}</div></div></div>`;
};

// 슬라이드를 움직이면 이름·설명·눈금·파형과 같은 장면 알약의 단계가 함께 바뀐다. Max에 닿는 순간 고리가 한 번 퍼진다.
const bindSliders = (root) => {
    root.querySelectorAll(".slider").forEach((box) => {
        const input = box.querySelector("input");
        const provider = box.dataset.p;
        const nth = provider === "codex" ? 1 : 0;

        input.addEventListener("input", () => {
            const level = Number(input.value);
            const info = LEVELS[level];
            const before = Number(box.dataset.level);

            box.dataset.level = level;
            box.style.setProperty("--lv", level);
            box.querySelector(".lv-name").textContent = info.name;
            box.querySelector(".s-tag").textContent = info.tags[nth];
            box.querySelector(".s-desc").textContent = info.desc;
            box.querySelectorAll(".ticks span").forEach((tick, index) => tick.toggleAttribute("data-on", index === level));
            box.querySelectorAll(".wave").forEach((svg) => {
                svg.dataset.level = level;
                svg.querySelector("path").setAttribute("d", wavePath(level));
            });

            const pill = root.querySelector(`.ai[data-p="${provider}"]`);

            if (pill) {
                pill.toggleAttribute("data-max", level === 4);
                pill.querySelector(".ai-level").textContent = info.name;
                pill.querySelector(".ai-wave").innerHTML = wave(level);
            }

            if (level === 4 && before !== 4) {
                box.classList.remove("burst");
                void box.offsetWidth;
                box.classList.add("burst");
                setTimeout(() => box.classList.remove("burst"), 750);
            }
        });
    });
};

if (only && SCENES[only]) {
    document.body.classList.add("solo");
    document.getElementById("m-top").remove();
    document.getElementById("m-main").innerHTML = sceneHtml(only);
} else {
    document.getElementById("m-main").innerHTML = Object.entries(SCENES)
        .map(([key, scene]) => `<section class="m-sec" id="${key}"><div class="m-head"><h2>${scene.name}</h2><p class="m-desc">${scene.desc}</p><div class="m-meas">${scene.meas.map((text) => `<span>${text}</span>`).join("")}</div></div><div class="m-scene">${sceneHtml(key)}</div></section>`)
        .join("");
}

bindSliders(document.body);

if (query.get("motion") === "on") {
    document.documentElement.dataset.motion = "on";
}

if (query.get("theme")) {
    document.documentElement.setAttribute("data-theme", query.get("theme"));
}
</script>
