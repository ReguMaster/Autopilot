<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개발 건 화면 시안</title>
<link rel="stylesheet" href="../../../desktop/fonts/pretendard.css">
<link rel="stylesheet" href="../refresh/mock.css">
<style>
/* 앱 창(1160×800)을 흉내 낸 틀 */
.win { display: flex; width: 1160px; height: 800px; border-radius: var(--r-xl); background: var(--page); box-shadow: var(--shadow); overflow: hidden; }
.solo { margin: 0; }
.solo .win { border-radius: 0; box-shadow: none; }
.col { display: flex; flex: 1; flex-direction: column; min-width: 0; }
.tb { display: flex; flex: none; align-items: center; height: 38px; box-shadow: 0 1px 0 var(--hair); }
.wc { display: flex; margin-left: auto; }
.wc i { display: grid; place-items: center; width: 36px; height: 38px; color: var(--muted); }
.wc svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; }
.content { display: flex; flex: 1; flex-direction: column; gap: 16px; min-height: 0; padding: 18px 32px 22px; overflow: hidden; }

/* 레일: shell.css 값 그대로. 열린 프로젝트 안에 개발 건 줄이 붙는다 */
.rail { display: flex; flex: none; flex-direction: column; gap: 2px; width: 224px; padding: 12px; background: var(--rail-bg); box-shadow: 1px 0 0 var(--hair); }
.rail-brand { display: flex; align-items: center; gap: 9px; height: 32px; margin-bottom: 14px; padding: 0 8px; font-size: var(--text-lg); font-weight: 700; letter-spacing: -0.02em; }
.rail-brand img { width: 22px; height: 22px; }
.rail-section { margin: 0 0 6px; padding: 0 10px; color: var(--muted); font-size: var(--text-xs); font-weight: 600; }
.projects { display: grid; gap: 2px; }
.proj { border-radius: var(--r-md); }
.proj[data-active] { background: var(--bg); box-shadow: var(--shadow-1); }
.proj-main { display: grid; grid-template-columns: 24px minmax(0, 1fr); align-items: center; gap: 0 10px; width: 100%; padding: 8px 10px 8px 8px; border: 0; background: none; color: inherit; font: inherit; text-align: left; }
.proj-mark { display: grid; grid-row: span 2; place-items: center; width: 24px; height: 24px; border-radius: 8px; background: var(--chip); color: var(--muted); font-size: var(--text-xs); font-weight: 700; }
.proj[data-active] .proj-mark { background: var(--accent-wash); color: var(--accent-ink); }
.proj[data-tone="warn"] .proj-mark { background: var(--warn-wash); color: var(--warn); }
.proj[data-tone="run"] .proj-mark { background: none; }
.proj-name, .proj-note { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-name { font-size: var(--text-md); font-weight: 600; }
.proj[data-active] .proj-name { font-weight: 650; }
.proj-note { color: var(--muted); font-size: var(--text-xs); }
.proj[data-tone="warn"] .proj-note { color: var(--warn); }
.proj[data-tone="run"] .proj-note { color: var(--accent-ink); }
.sub { display: grid; gap: 1px; margin: -2px 8px 8px 41px; padding-left: 8px; box-shadow: inset 1px 0 0 var(--hair-strong); }
.sub-row { display: flex; align-items: center; gap: 8px; min-width: 0; height: 28px; padding: 0 8px; border-radius: 8px; color: var(--muted); font-size: var(--text-xs); font-weight: 600; }
.sub-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub-row[data-current] { background: var(--chip); color: var(--ink); }
.sub-row[data-tone="warn"] { color: var(--warn); }
.sub-row[data-tone="run"] { color: var(--accent-ink); }
.sub-row[data-tone="bad"] { color: var(--del); }
.sub-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--hair-strong); }
[data-tone="warn"] > .sub-dot { background: var(--warn-fill); }
[data-tone="bad"] > .sub-dot { background: var(--del); }
.sub .ring { width: 9px; height: 9px; border-width: 1.5px; }
.rail-add-group { display: grid; gap: 2px; margin-top: 18px; }
.rail-add { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: var(--r-md); color: var(--muted); font-size: var(--text-md); font-weight: 600; }
.rail-add .icon { width: 14px; height: 14px; }

/* 머리줄 */
.ph h1 { font-size: var(--title-lg); font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; }
.path { margin-top: 2px; color: var(--faint); font: var(--text-xs) / 1.5 var(--mono); }
.bh-wrap { display: grid; flex: none; gap: 2px; }
.bh { display: flex; align-items: center; flex-wrap: wrap; justify-content: space-between; gap: 10px 16px; }
.crumb { display: inline-flex; align-items: center; gap: 4px; justify-self: start; margin-left: -4px; padding: 2px 8px 2px 2px; border-radius: 8px; color: var(--muted); font-size: var(--text-sm); font-weight: 600; }
.crumb .icon { width: 12px; height: 12px; }
.bh-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
.bh-title h1 { font-size: var(--title-md); font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; white-space: nowrap; }
.tag { display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px; border-radius: 999px; background: var(--chip); color: var(--muted); font-size: var(--text-xs); font-weight: 600; white-space: nowrap; }
.tag[data-tone="run"] { background: var(--accent-wash); color: var(--accent-ink); }
.tag[data-tone="warn"] { background: var(--warn-wash); color: var(--warn); }
.tag .ring { width: 10px; height: 10px; border-width: 1.5px; }
.bh-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--bg); box-shadow: var(--shadow-1); color: var(--ink-2); font-size: var(--text-sm); font-weight: 600; white-space: nowrap; }
.pill b { color: var(--ink); font-weight: 650; }
.pill .icon { width: 11px; height: 11px; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 15px; border: 0; border-radius: 999px; background: var(--bg); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--hair-strong); color: var(--ink-2); font-size: var(--text-sm); font-weight: 600; white-space: nowrap; }
.btn .icon { width: 12px; height: 12px; }
.btn.primary { height: 38px; padding: 0 22px; background: var(--accent); box-shadow: var(--glow); color: #fff; font-size: var(--text-md); }
.btn.primary[disabled] { background: var(--chip); box-shadow: none; color: var(--faint); cursor: not-allowed; }
.btn.block { width: 100%; }
.btn[disabled]:not(.primary) { box-shadow: inset 0 0 0 1px var(--hair); color: var(--faint); cursor: not-allowed; }

/* 연결형 스테퍼: 고른 칸이 아래 작업 영역과 이어진 하나의 면이다 */
.board { container-type: inline-size; display: flex; flex: 1; flex-direction: column; min-height: 0; border-radius: var(--r-xl); background: var(--bg); box-shadow: var(--shadow-1); overflow: hidden; }
.steps { display: grid; flex: none; grid-template-columns: repeat(5, minmax(0, 1fr)); margin: 0; padding: 0; background: var(--surface); box-shadow: inset 0 -1px 0 var(--hair); list-style: none; }
.step { position: relative; display: grid; gap: 1px; min-width: 0; padding: 13px 14px 14px; color: var(--muted); }
.step + .step { box-shadow: inset 1px 0 0 var(--hair); }
.step[data-on] { z-index: 1; background: var(--bg); box-shadow: inset 1px 0 0 var(--hair), inset -1px 0 0 var(--hair), 0 1px 0 var(--bg); }
.step[data-on]:first-child { box-shadow: inset -1px 0 0 var(--hair), 0 1px 0 var(--bg); }
.step[data-on]::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--accent); }
.step[data-on][data-state="hold"]::before { background: var(--warn-fill); }
.step-top { display: flex; align-items: center; gap: 8px; font-size: var(--text-md); font-weight: 600; }
.step-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step-node { display: grid; flex: none; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 1px var(--hair-strong); color: var(--faint); font-size: 11px; font-weight: 700; }
.step-node .icon { width: 12px; height: 12px; stroke-width: 2; }
.step-detail { padding-left: 28px; overflow: hidden; color: var(--faint); font-size: var(--text-xs); text-overflow: ellipsis; white-space: nowrap; }
.step-detail[data-link] { color: var(--muted); text-decoration: underline; text-decoration-color: var(--hair-strong); text-underline-offset: 3px; cursor: pointer; }
.gate-mark { flex: none; width: 6px; height: 6px; rotate: 45deg; border-radius: 1.5px; background: var(--hair-strong); }
.step[data-state="done"] { color: var(--ink); }
.step[data-state="done"] .step-node { background: var(--ok-wash); box-shadow: none; color: var(--add); }
.step[data-state="done"] .gate-mark { background: var(--add); }
.step[data-state="done"] .step-detail { color: var(--muted); }
.step[data-state="active"] { color: var(--accent-ink); }
.step[data-state="active"] .step-node { background: var(--accent); box-shadow: none; color: #fff; }
.step[data-state="active"] .step-detail { color: var(--accent-ink); }
.step[data-state="next"] { color: var(--ink); }
.step[data-state="next"] .step-node { box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent-ink); }
.step[data-state="next"] .step-detail { color: var(--accent-ink); }
.step[data-state="next"] .gate-mark, .step[data-state="active"] .gate-mark { background: var(--accent-line); }
.step[data-state="hold"] { color: var(--warn); }
.step[data-state="hold"] .step-node { background: var(--warn-fill); box-shadow: none; color: #fff; }
.step[data-state="hold"] .step-detail { color: var(--warn); }
.step[data-state="hold"] .gate-mark { background: var(--warn-fill); }

/* 작업 영역 */
.panel { display: flex; flex: 1; flex-direction: column; gap: 16px; min-height: 0; padding: 22px 26px 18px; overflow-y: auto; scrollbar-width: thin; }
.p-title { font-size: var(--title-md); font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; }
.p-lead { margin-top: 4px; color: var(--muted); font-size: var(--text-md); }
.p-foot { display: flex; align-items: center; flex-wrap: wrap; justify-content: space-between; gap: 10px 16px; margin-top: auto; padding-top: 16px; box-shadow: inset 0 1px 0 var(--hair); }
.p-foot p { color: var(--muted); font-size: var(--text-sm); }
.p-foot .acts { display: flex; align-items: center; gap: 8px; margin-left: auto; }
code { padding: 1px 6px; border-radius: 6px; background: var(--chip); color: var(--ink-2); font: var(--text-xs) / 1.5 var(--mono); }

/* 시작 전 */
.brief { display: grid; gap: 0; border-radius: var(--r-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--hair-strong); }
.brief-text { padding: 13px 15px 10px; color: var(--ink); font-size: var(--text-lg); line-height: 1.65; }
.brief-foot { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 8px 10px 10px 12px; }
.brief-foot .btn { margin-left: auto; height: 30px; }
.tag-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px 0 11px; border-radius: 999px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--hair-strong); color: var(--ink-2); font-size: var(--text-xs); font-weight: 600; }
.tag-chip .icon { width: 10px; height: 10px; color: var(--faint); }
.tag-chip.add { padding: 0 11px 0 8px; border: 1px dashed var(--hair-strong); box-shadow: none; color: var(--muted); }
.note-line { display: flex; align-items: flex-start; gap: 9px; padding: 10px 13px; border-radius: var(--r-md); background: var(--surface); color: var(--ink-2); font-size: var(--text-sm); }
.note-line .icon { margin-top: 3px; color: var(--muted); }
.rules { display: grid; }
.rule { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 12px; min-height: 46px; padding: 8px 0; box-shadow: inset 0 1px 0 var(--hair); }
.rule-name { font-size: var(--text-sm); font-weight: 650; }
.rule-ctrls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; min-width: 0; }
.chk { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: var(--text-sm); }
.chk input { flex: none; width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
.chk[data-locked] { color: var(--muted); }
.sel { display: inline-flex; align-items: center; justify-content: space-between; gap: 10px; height: 32px; padding: 0 10px; border-radius: 8px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hair-strong); color: var(--ink); font-size: var(--text-sm); white-space: nowrap; }
.sel .icon { width: 11px; height: 11px; color: var(--muted); }
.opt { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--chip); color: var(--muted); font-size: var(--text-xs); font-weight: 600; }
.opt .icon { width: 11px; height: 11px; stroke-width: 2; }
.opt[aria-pressed="false"] .icon { display: none; }
.opt[aria-pressed="true"] { background: var(--bg); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--hair-strong); color: var(--ink); }

/* 실행 중: 문장이 아래에서 쓰이고 지난 문장은 위로 올라가며 흐려진다 */
.run-grid { display: grid; flex: 1; grid-template-columns: minmax(0, 1fr) 252px; gap: 30px; min-height: 0; }
.run-main { display: flex; flex-direction: column; justify-content: flex-end; min-height: 0; padding-bottom: 6px; }
.run-meta { display: flex; align-items: center; gap: 10px; margin-bottom: auto; color: var(--accent-ink); font-size: var(--text-sm); font-weight: 650; }
.run-meta .num { color: var(--muted); font-weight: 600; }
.run-meta .ring { width: 12px; height: 12px; }
.past { display: grid; gap: 12px; }
.past p { color: var(--ink-2); font-size: var(--text-lg); line-height: 1.55; }
.past p:nth-child(1) { opacity: 0.14; }
.past p:nth-child(2) { opacity: 0.24; }
.past p:nth-child(3) { opacity: 0.36; }
.past p:nth-child(4) { opacity: 0.52; }
.past p:nth-child(5) { opacity: 0.72; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.tool { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 7px; background: var(--chip); color: var(--muted); font: var(--text-xs) / 1 var(--mono); }
.tool b { color: var(--ink-2); font-weight: 600; }
.now { margin-top: 20px; font-size: 26px; font-weight: 650; line-height: 1.45; letter-spacing: -0.02em; }
.caret { display: inline-block; width: 2px; height: 1em; margin-left: 4px; vertical-align: -0.12em; background: var(--accent); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.gain { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; margin-top: 16px; padding: 6px 12px; border-radius: 999px; background: var(--ok-wash); color: var(--add); font-size: var(--text-sm); font-weight: 650; }
.side { display: grid; align-content: start; gap: 18px; padding-left: 24px; box-shadow: inset 1px 0 0 var(--hair); }
.side h3 { margin-bottom: 8px; font-size: var(--text-sm); font-weight: 650; }
.side h3 span { margin-left: 4px; color: var(--faint); font-weight: 600; }
.file { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 2px 8px; padding: 7px 0; }
.file .icon { grid-row: span 2; margin-top: 3px; color: var(--muted); }
.file b { overflow: hidden; font-size: var(--text-sm); font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.file small { color: var(--faint); font-size: var(--text-xs); }
.commit { display: grid; gap: 1px; padding: 7px 0; }
.commit b { font-size: var(--text-sm); font-weight: 600; line-height: 1.4; }
.commit small { display: flex; gap: 8px; color: var(--faint); font: var(--text-xs) / 1.5 var(--mono); }
.add { color: var(--add); }
.del { color: var(--del); }
.link { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: var(--text-sm); font-weight: 600; }
.link .icon { width: 12px; height: 12px; }

/* 확인 대기: 왼쪽은 화면 높이를 다 쓰는 문서, 오른쪽은 결정 */
.pane { display: grid; flex: 1; grid-template-columns: minmax(0, 1fr) 320px; min-height: 0; }
.doc-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.doc-bar { display: flex; flex: none; align-items: center; justify-content: space-between; gap: 12px; min-height: 46px; padding: 8px 24px; box-shadow: inset 0 -1px 0 var(--hair); }
.doc-path { min-width: 0; overflow: hidden; color: var(--faint); font: var(--text-xs) / 1.5 var(--mono); text-overflow: ellipsis; white-space: nowrap; }
.doc-acts { display: flex; flex: none; align-items: center; gap: 14px; }
.doc-acts span { color: var(--muted); font-size: var(--text-xs); font-weight: 600; }
.doc-tabs { display: flex; gap: 2px; }
.doc-tab { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--muted); font-size: var(--text-sm); font-weight: 600; }
.doc-tab[aria-selected="true"] { background: var(--chip); color: var(--ink); }
.doc-tab small { color: var(--faint); font-size: var(--text-xs); font-weight: 600; }
.doc-scroll { flex: 1; min-height: 0; padding: 20px 28px 32px; overflow-y: auto; color: var(--ink-2); font-size: var(--text-md); line-height: 1.75; scrollbar-width: thin; user-select: text; }
.doc-scroll h3 { margin-bottom: 8px; color: var(--ink); font-size: var(--title-sm); font-weight: 700; letter-spacing: -0.015em; line-height: 1.4; }
.doc-section + .doc-section { margin-top: 6px; }
.doc-section h4 { margin: 14px 0 0; }
.doc-section-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 0; border: 0; background: none; color: var(--ink); font: inherit; font-size: var(--text-lg); font-weight: 700; text-align: left; }
.doc-section-head .icon { width: 12px; height: 12px; color: var(--muted); }
.doc-scroll p { margin: 4px 0 0; }
.doc-scroll ul, .doc-scroll ol { margin: 6px 0 0; padding-left: 20px; }
.doc-scroll li { padding: 1px 0; }
.doc-scroll li::marker { color: var(--faint); }
.doc-scroll strong { color: var(--ink); font-weight: 650; }
.doc-table { margin: 8px 0 2px; overflow-x: auto; }
.doc-table table { border-collapse: collapse; font-size: var(--text-sm); }
.doc-table th, .doc-table td { padding: 6px 16px 6px 12px; box-shadow: inset 0 -1px 0 var(--hair); text-align: left; white-space: nowrap; }
.doc-table th { background: var(--surface); color: var(--muted); font-weight: 650; }
.wire { display: grid; gap: 8px; width: min(340px, 100%); margin: 10px 0 4px; padding: 12px; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hair-strong); }
.w-bar { width: 46%; height: 9px; border-radius: 4px; background: var(--hair-strong); }
.w-row { display: flex; align-items: center; gap: 8px; }
.w-row i { flex: none; width: 11px; height: 11px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--hair-strong); }
.w-row i.on { background: var(--accent-line); box-shadow: inset 0 0 0 1.5px var(--accent); }
.w-row span { height: 7px; border-radius: 4px; background: var(--hair); }
.w-box { display: grid; gap: 5px; padding: 9px 10px; border-radius: 8px; background: var(--accent-wash); }
.w-box span { height: 6px; border-radius: 3px; background: var(--accent-line); }
.w-btns { display: flex; justify-content: flex-end; gap: 6px; }
.w-btns i { width: 46px; height: 16px; border-radius: 6px; background: var(--chip); }
.w-btns i.p { background: var(--accent-line); }
.decide { display: flex; flex-direction: column; gap: 12px; min-height: 0; padding: 22px 24px 20px; overflow-y: auto; box-shadow: inset 1px 0 0 var(--hair); scrollbar-width: thin; }
.decide .p-title { font-size: var(--title-sm); }
.decide .p-lead { font-size: var(--text-sm); line-height: 1.6; }
.fb { display: grid; gap: 6px; margin-top: 6px; }
.fb > span:first-child { color: var(--ink-2); font-size: var(--text-sm); font-weight: 650; }
.ta { min-height: 104px; padding: 10px 12px; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hair-strong); color: var(--faint); font-size: var(--text-sm); line-height: 1.6; }
.meta { display: grid; gap: 2px; margin-top: auto; padding-top: 8px; color: var(--faint); font-size: var(--text-xs); line-height: 1.6; }
.picks h3 { margin-bottom: 2px; font-size: var(--text-md); font-weight: 650; }
.picks h3 span { margin-left: 6px; color: var(--warn); font-size: var(--text-sm); }
.dispute { display: grid; gap: 6px; margin-top: 8px; }
.d-title { font-size: var(--text-sm); font-weight: 650; line-height: 1.45; }
.d-opt { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 1px 9px; padding: 9px 11px; border: 0; border-radius: var(--r-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--hair); color: var(--ink-2); font: inherit; text-align: left; }
.d-opt::before { content: ""; grid-row: span 2; align-self: center; width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--hair-strong); }
.d-opt[data-picked] { background: var(--accent-wash); box-shadow: inset 0 0 0 1.5px var(--accent-line); color: var(--ink); }
.d-opt[data-picked]::before { background: radial-gradient(var(--accent) 0 38%, transparent 42%); box-shadow: inset 0 0 0 1.5px var(--accent); }
.d-who { color: var(--muted); font-size: var(--text-xs); font-weight: 650; }
.d-opt[data-picked] .d-who { color: var(--accent-ink); }
.d-say { font-size: var(--text-sm); line-height: 1.45; }
.fold { display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 12px; border-radius: var(--r-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--hair); color: var(--muted); font-size: var(--text-sm); font-weight: 600; }
.fold .icon { width: 12px; height: 12px; }
.btns { display: grid; gap: 8px; margin-top: auto; }

/* 프로젝트 홈 */
.entries { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.entry { display: grid; grid-template-columns: 40px minmax(0, 1fr) 14px; align-items: center; gap: 2px 14px; padding: 18px; border: 0; border-radius: var(--r-lg); background: var(--bg); box-shadow: var(--shadow-1); color: inherit; font: inherit; text-align: left; }
.entry-tile { display: grid; grid-row: span 3; place-items: center; align-self: start; width: 40px; height: 40px; border-radius: 12px; background: var(--chip); color: var(--muted); }
.entry-tile .icon { width: 18px; height: 18px; stroke-width: 1.4; }
.entry[data-kind="build"] .entry-tile { background: var(--accent-wash); color: var(--accent-ink); }
.entry b { font-size: var(--text-xl); font-weight: 700; letter-spacing: -0.015em; }
.entry p { grid-column: 2; color: var(--ink-2); font-size: var(--text-sm); line-height: 1.5; }
.entry small { grid-column: 2; margin-top: 6px; color: var(--faint); font-size: var(--text-xs); font-weight: 600; }
.entry > .icon { grid-column: 3; grid-row: 1; width: 13px; height: 13px; rotate: -90deg; color: var(--faint); }
.group { display: grid; gap: 4px; }
.group-head { display: flex; align-items: baseline; gap: 8px; padding: 0 2px; font-size: var(--text-md); font-weight: 700; }
.group-head span { color: var(--faint); font-size: var(--text-sm); font-weight: 600; }
.effort { display: grid; grid-template-columns: minmax(0, 1fr) 120px 190px 14px; align-items: center; gap: 16px; min-height: 58px; padding: 0 14px; border-radius: var(--r-md); }
.effort[data-hl] { background: var(--bg); box-shadow: var(--shadow-1); }
.effort-name b { display: block; overflow: hidden; font-size: var(--text-md); font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
.effort-name small { color: var(--faint); font-size: var(--text-xs); }
.ticks { display: flex; gap: 3px; }
.ticks i { flex: 1; height: 4px; border-radius: 4px; background: var(--hair-strong); }
.ticks i[data-s="done"] { background: var(--add); }
.ticks i[data-s="hold"] { background: var(--warn-fill); }
.ticks i[data-s="bad"] { background: var(--del); }
.effort-state { font-size: var(--text-sm); font-weight: 600; }
.effort-state[data-tone="warn"] { color: var(--warn); }
.effort-state[data-tone="bad"] { color: var(--del); }
.effort-state[data-tone="ok"] { color: var(--muted); }
.effort > .icon { width: 13px; height: 13px; rotate: -90deg; color: var(--faint); }
.past-run { display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 14px; color: var(--muted); font-size: var(--text-sm); }
.past-run b { color: var(--ink-2); font-weight: 600; }

/* 좁은 창: 본문 폭이 700px 이하면 단계 설명을 지금 칸만 남긴다. 문서와 결정은 위아래로 나누고 각자 스크롤한다(겹친 스크롤을 만들지 않는다) */
@container (max-width: 700px) {
    .step { padding: 12px 10px 13px; }
    .step:not([data-on]) .step-detail { display: none; }
    .step-top { gap: 6px; font-size: var(--text-sm); }
    .pane { display: flex; flex-direction: column; }
    .doc-col { flex: 1; min-height: 220px; }
    .decide { flex: none; max-height: 40%; padding-block: 16px; box-shadow: inset 0 1px 0 var(--hair); }
    .decide > * { flex: none; }
    .decide :is(.p-lead, .meta) { display: none; }
    .run-grid { grid-template-columns: minmax(0, 1fr); overflow-y: auto; }
    .side { padding: 16px 0 0; box-shadow: inset 0 1px 0 var(--hair); }
    .rule { grid-template-columns: minmax(0, 1fr); gap: 6px; }
    .panel { padding-inline: 18px; }
}

/* 시안 페이지 */
.m-scene { display: grid; justify-items: start; gap: 14px; overflow-x: auto; }
.m-main { max-width: 1240px; }
.solo .m-main { display: block; max-width: none; padding: 0; }

@media (prefers-reduced-motion: reduce) {
    .caret { animation: none; }
}
