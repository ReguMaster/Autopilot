<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoPilot 하늘 배경 시안</title>
  <style>
    @font-face { font-family: "Pretendard"; src: url("../../../desktop/fonts/PretendardVariable.woff2") format("woff2"); font-weight: 45 920; }
    :root { --ink: #2a1d33; --muted: #65566d; --line: rgb(42 29 51 / .14); --tint: rgb(42 29 51 / .07); font-family: "Pretendard", "Malgun Gothic", sans-serif; color: var(--ink); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; align-items: flex-start; padding: 32px 24px; background: #eceaee; font-size: 14px; }
    button, input, select { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .panel { width: 300px; display: grid; gap: 22px; }
    h1 { margin: 0; font-size: 18px; }
    .lead { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    h2 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
    .variants { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .variants button, .row button, select { padding: 7px 10px; border: 1px solid transparent; border-radius: 8px; background: none; text-align: left; cursor: pointer; }
    .variants button:hover, .row button:hover { background: var(--tint); }
    .variants button[aria-pressed="true"] { background: var(--ink); color: #fff; }
    .variants span { color: inherit; opacity: .55; margin-right: 6px; font-variant-numeric: tabular-nums; }
    .clock { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .clock small { margin-left: 8px; font-size: 13px; font-weight: 500; color: var(--muted); }
    input[type="range"] { width: 100%; accent-color: var(--ink); }
    .row { display: flex; flex-wrap: wrap; gap: 4px; }
    .row button { border-color: var(--line); }
    .row button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
    select { width: 100%; border-color: var(--line); }
    .viewer { display: grid; justify-items: center; gap: 10px; }
    iframe { width: 600px; height: 800px; border: 0; border-radius: 10px; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 18px 50px rgb(42 29 51 / .18); }
    .caption { color: var(--muted); font-size: 12.5px; }
  </style>
</head>
<body>
  <aside class="panel">
    <div>
      <h1>하늘 배경 시안</h1>
      <p class="lead">시간에 따라 낮에는 해와 하늘·구름, 밤에는 달과 별·별자리·운석이 보여요. 오른쪽은 실제 앱 화면(600×800)이에요.</p>
    </div>

    <section>
      <h2>시안</h2>
      <div class="variants" id="variants"></div>
    </section>

    <section>
      <h2>시간</h2>
      <p class="clock"><span id="clockText">--:--</span><small id="clockMode">지금</small></p>
      <input type="range" id="time" min="0" max="1435" step="5" aria-label="시각">
      <div class="row" id="presets">
        <button type="button" data-time="now" aria-pressed="true">지금</button>
        <button type="button" data-time="330">새벽</button>
        <button type="button" data-time="600">아침</button>
        <button type="button" data-time="780">한낮</button>
        <button type="button" data-time="1110">노을</button>
        <button type="button" data-time="1350">밤</button>
        <button type="button" data-time="90">새벽 1시</button>
      </div>
    </section>

    <section>
      <h2>미리보기</h2>
      <div class="row">
        <button type="button" id="timelapse" aria-pressed="false">타임랩스 (1초 = 20분)</button>
        <button type="button" id="meteor">운석 떨어뜨리기</button>
      </div>
    </section>

    <section>
      <h2>달 모양</h2>
      <select id="phase" aria-label="달 모양">
        <option value="">오늘 날짜 기준</option>
        <option value="0.12">초승달</option>
        <option value="0.25">상현달</option>
        <option value="0.5">보름달</option>
        <option value="0.75">하현달</option>
      </select>
    </section>
  </aside>

  <main class="viewer">
    <iframe id="frame" src="frame.html#v=1" title="시안 미리보기"></iframe>
    <p class="caption" id="caption"></p>
  </main>

  <script>
    const NAMES = ["하늘 창", "비행기 창", "온 하늘", "선 그림", "해시계 호", "종이 하늘", "픽셀", "점 하늘", "언덕 풍경", "머리 위 하늘", "수채", "별자리 지도"];
    const NOTES = [
      "로고 뒤로 둥근 하늘 띠가 있고, 아래는 흰 화면 그대로예요.",
      "비행기 창처럼 작은 창 너머로 구름이 빠르게 지나가요.",
      "창 전체가 하늘이에요. 밤에는 글자와 로고가 밝게 바뀌어요.",
      "흰 화면에 잉크 선으로만 해·구름·달·별을 그려요.",
      "로고 위 반원을 해와 달이 따라 돌고, 밤에는 반원이 밤하늘이 돼요.",
      "종이를 오려 겹친 하늘이에요. 아래 가장자리는 흰 종이 구름이에요.",
      "도트 그림 하늘이에요. 구름도 칸 단위로 움직여요.",
      "위쪽 하늘을 점으로 찍고 아래로 갈수록 흰 화면에 스며요.",
      "화면 아래 언덕 너머로 해가 뜨고 지고, 밤에는 언덕 위로 별이 떠요.",
      "헤더 뒤에만 하늘이 비치고 아래로 흰 화면에 녹아들어요.",
      "번진 물감 같은 하늘과 흐린 구름이에요.",
      "북극성 둘레로 좌표 원이 돌고 별자리 이름이 붙어요. 낮에는 지도만 옅게 남아요."
    ];
    const frame = document.getElementById("frame");
    const time = document.getElementById("time");
    const send = (message) => frame.contentWindow.postMessage(message, "*");
    const pad = (value) => String(value).padStart(2, "0");
    const nowMinutes = () => new Date().getHours() * 60 + new Date().getMinutes();
    let following = true;
    let variant = 1;

    const showClock = (minutes, label) => {
      document.getElementById("clockText").textContent = `${pad(Math.floor(minutes / 60))}:${pad(minutes % 60)}`;
      document.getElementById("clockMode").textContent = label;
      time.value = minutes;
    };

    const markPreset = (value) => {
      document.querySelectorAll("#presets button").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.time === value)));
    };

    const setTimelapse = (enabled) => {
      document.getElementById("timelapse").setAttribute("aria-pressed", String(enabled));
      send({ type: "timelapse", enabled: enabled });
    };

    const setVariant = (number) => {
      variant = number;
      send({ type: "variant", variant: number });
      document.querySelectorAll("#variants button").forEach((button) => button.setAttribute("aria-pressed", String(Number(button.dataset.v) === number)));
      document.getElementById("caption").textContent = `${number}. ${NAMES[number - 1]}: ${NOTES[number - 1]}`;
    };

    document.getElementById("variants").innerHTML = NAMES.map((name, index) => `<button type="button" data-v="${index + 1}"><span>${index + 1}</span>${name}</button>`).join("");
    document.getElementById("variants").addEventListener("click", (event) => {
      const button = event.target.closest("button");

      if (button) {
        setVariant(Number(button.dataset.v));
      }
    });
    document.getElementById("presets").addEventListener("click", (event) => {
      const button = event.target.closest("button");

      if (!button) {
        return;
      }

      setTimelapse(false);
      markPreset(button.dataset.time);

      if (button.dataset.time === "now") {
        following = true;
        send({ type: "now" });
        showClock(nowMinutes(), "지금");
      } else {
        following = false;
        send({ type: "time", minutes: Number(button.dataset.time) });
        showClock(Number(button.dataset.time), "미리보기");
      }
    });
    time.addEventListener("input", () => {
      following = false;
      setTimelapse(false);
      markPreset("");
      send({ type: "time", minutes: Number(time.value) });
      showClock(Number(time.value), "미리보기");
    });
    document.getElementById("timelapse").addEventListener("click", (event) => {
      const enabled = event.currentTarget.getAttribute("aria-pressed") !== "true";

      following = false;
      markPreset("");
      setTimelapse(enabled);
    });
    document.getElementById("meteor").addEventListener("click", () => send({ type: "meteor" }));
    document.getElementById("phase").addEventListener("change", (event) => send({ type: "phase", phase: event.target.value === "" ? null : Number(event.target.value) }));
    window.addEventListener("message", (event) => {
      if (event.data?.type === "time") {
        showClock(event.data.minutes, "타임랩스");
      }
    });
    frame.addEventListener("load", () => setVariant(variant));
    document.addEventListener("keydown", (event) => {
      if (event.target.matches("input, select")) {
        return;
      }

      if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
        setVariant(((variant - 1 + (event.key === "ArrowRight" ? 1 : -1) + NAMES.length) % NAMES.length) + 1);
      }
    });
    setInterval(() => {
      if (following) {
        showClock(nowMinutes(), "지금");
      }
    }, 30000);
    showClock(nowMinutes(), "지금");
  </script>
</body>
</html>
