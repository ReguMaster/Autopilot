<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>AutoPilot 연속 실행 시안</title>
        <style>
            @font-face {
                font-family: "Pretendard";
                src: url("../../../desktop/fonts/PretendardVariable.woff2") format("woff2");
                font-weight: 45 920;
                font-display: block;
            }

            :root {
                color-scheme: light;
                --bg: #fff;
                --ink: #1a1f36;
                --ink-2: rgb(26 31 54 / 0.74);
                --muted: #69708a;
                --faint: #a2a7ba;
                --hair: #e7e9f0;
                --hair-strong: #cfd3df;
                --surface: #f6f7fa;
                --chip: #f1f2f7;
                --dot: #c3c7d6;
                --accent: #3656d6;
                --add: #1b7f4b;
                --del: #c2372f;
                --board: #e9ebf2;
                --shadow: 0 0 0 1px var(--hair), 0 28px 56px -22px rgb(26 31 54 / 0.32);
                --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
                --text-xs: 12px;
                --text-sm: 13px;
                --text-md: 14px;
                --text-lg: 16px;
                --text-xl: 18px;
                --title-sm: 20px;
                --title-md: 24px;
                --title-lg: 28px;
                --title-xl: 34px;
                --display: 56px;
                --sans: "Pretendard", "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", sans-serif;
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                background: var(--board);
            }

            body {
                color: var(--ink);
                font-family: var(--sans);
                font-size: var(--text-md);
                line-height: 1.5;
                font-variant-numeric: tabular-nums;
                word-break: keep-all;
                overflow-wrap: break-word;
                -webkit-font-smoothing: antialiased;
            }

            h1,
            h2,
            h3,
            p,
            dl,
            dd,
            ol,
            ul,
            figure {
                margin: 0;
                padding: 0;
            }

            ol,
            ul {
                list-style: none;
            }

            button {
                font: inherit;
                color: inherit;
                cursor: default;
            }

            ins,
            del {
                text-decoration: none;
            }

            ins {
                color: var(--add);
            }

            del {
                color: var(--del);
            }

            .symbols {
                position: absolute;
                width: 0;
                height: 0;
            }

            .ico {
                flex: none;
                width: 13px;
                height: 13px;
                fill: none;
                stroke: currentColor;
                stroke-width: 1.5;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            /* 시안 보드 */
            .board {
                max-width: 1320px;
                margin: 0 auto;
                padding-block: 48px 96px;
                padding-inline: 24px;
            }

            .board-head h1 {
                font-size: var(--title-lg);
                font-weight: 650;
                letter-spacing: -0.02em;
            }

            .board-head p {
                max-width: 44em;
                margin-top: 10px;
                color: var(--muted);
                font-size: var(--text-md);
                line-height: 1.65;
            }

            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(min(100%, 600px), 1fr));
                gap: 56px 32px;
                margin-top: 40px;
                justify-items: center;
            }

            .item {
                width: 100%;
                max-width: 600px;
            }

            .item figcaption {
                display: grid;
                grid-template-columns: auto minmax(0, 1fr);
                gap: 2px 12px;
                align-items: baseline;
                margin-bottom: 14px;
            }

            .item .no {
                font-size: var(--title-md);
                font-weight: 300;
                letter-spacing: -0.02em;
            }

            .item .nm {
                font-size: var(--text-lg);
                font-weight: 650;
            }

            .item figcaption p {
                grid-column: 2;
                color: var(--muted);
                font-size: var(--text-sm);
                line-height: 1.55;
            }

            /* 앱 창 600x800 */
            .win {
                position: relative;
                display: flex;
                flex-direction: column;
                width: 600px;
                height: 800px;
                overflow: hidden;
                border-radius: 12px;
                background: var(--bg);
                box-shadow:
                    0 0 0 1px #d6d9e4,
                    0 24px 48px -24px rgb(26 31 54 / 0.35);
            }

            .titlebar {
                flex: none;
                display: flex;
                align-items: center;
                gap: 14px;
                height: 48px;
                padding: 0 6px 0 12px;
            }

            .titlebar.dim {
                background: rgb(26 31 54 / 0.14);
            }

            .brand {
                flex: none;
                height: 22px;
                mix-blend-mode: multiply;
            }

            .window-controls {
                display: flex;
                align-items: center;
                gap: 2px;
                margin-left: auto;
            }

            .window-separator {
                width: 1px;
                height: 18px;
                margin: 0 8px;
                background: var(--hair);
            }

            .window-control {
                display: grid;
                place-items: center;
                width: 42px;
                height: 34px;
                padding: 0;
                border: 0;
                border-radius: 8px;
                background: none;
                color: var(--muted);
            }

            .window-control svg {
                width: 15px;
                height: 15px;
                fill: none;
                stroke: currentColor;
                stroke-width: 1.2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            .window-control.on {
                background: var(--chip);
                color: var(--ink);
                box-shadow: inset 0 0 0 1px var(--hair);
            }

            .streak-chip {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                height: 26px;
                margin-right: 6px;
                padding: 0 10px 0 8px;
                border: 0;
                border-radius: 999px;
                background: var(--chip);
                color: var(--ink);
                font-size: var(--text-xs);
                font-weight: 600;
            }

            .streak-chip svg {
                width: 12px;
                height: 12px;
                fill: none;
                stroke: currentColor;
                stroke-width: 1.4;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            .streak-chip.on {
                box-shadow: inset 0 0 0 1px var(--hair-strong);
            }

            .content {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
            }

            .stage {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
            }

            .stage > section {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                padding: 0 32px;
            }

            /* 시작 전 */
            .greet {
                padding-top: 68px !important;
            }

            .greet h1,
            .finish h1 {
                max-width: 14em;
                font-size: var(--title-xl);
                font-weight: 600;
                line-height: 1.32;
                letter-spacing: -0.025em;
                text-wrap: balance;
            }

            .greet h1.soft {
                color: var(--muted);
            }

            .greet h1.soft b {
                color: var(--ink);
                font-weight: 800;
            }

            .lead {
                max-width: 30em;
                margin-top: 14px;
                color: var(--ink-2);
                font-size: var(--text-lg);
                line-height: 1.65;
                text-wrap: pretty;
            }

            .lead b {
                color: var(--ink);
                font-weight: 650;
            }

            .recent {
                margin-top: 28px;
            }

            .recent-head {
                display: flex;
                align-items: center;
                margin-bottom: 4px;
                color: var(--muted);
            }

            .recent-head h2 {
                font-size: var(--text-sm);
                font-weight: 600;
            }

            .link {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                height: 28px;
                margin: 0 -8px 0 auto;
                padding: 0 8px;
                border: 0;
                border-radius: 7px;
                background: none;
                color: var(--muted);
                font-size: var(--text-sm);
            }

            .link .ico {
                width: 12px;
                height: 12px;
            }

            .run-item {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                align-items: baseline;
                gap: 2px 12px;
                padding: 9px 10px;
            }

            .run-when {
                display: flex;
                align-items: baseline;
                gap: 8px;
                font-size: var(--text-md);
            }

            .run-when b {
                font-weight: 600;
            }

            .run-when span {
                color: var(--muted);
                font-size: var(--text-sm);
            }

            .run-meta {
                grid-column: 1 / -1;
                color: var(--muted);
                font-size: var(--text-sm);
            }

            .tag {
                padding: 1px 8px;
                border-radius: 999px;
                background: var(--chip);
                color: var(--muted);
                font-size: var(--text-xs);
                font-weight: 600;
                white-space: nowrap;
            }

            .tag.ok {
                background: #eaf6ef;
                color: var(--add);
            }

            .button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                height: 30px;
                padding: 0 11px;
                border: 0;
                border-radius: 8px;
                background: var(--bg);
                box-shadow: inset 0 0 0 1px var(--hair);
                font-size: var(--text-sm);
                font-weight: 500;
                white-space: nowrap;
            }

            .button .ico {
                width: 12px;
                height: 12px;
            }

            /* 컴포저 */
            .composer {
                flex: none;
                margin: 0 16px 16px;
                border-radius: 16px;
                background: var(--bg);
                box-shadow: inset 0 0 0 1px var(--hair);
            }

            .composer .tasks {
                height: 116px;
                padding: 14px 16px 0;
                border-bottom: 1px solid var(--hair);
                font-size: var(--text-md);
                line-height: 1.55;
            }

            .composer .tasks.short {
                height: 84px;
            }

            .composer-bar {
                display: flex;
                align-items: center;
                gap: 5px;
                padding: 10px 10px 10px 12px;
            }

            .chip {
                display: inline-flex;
                flex: none;
                align-items: center;
                gap: 6px;
                height: 32px;
                padding: 0 9px;
                border: 0;
                border-radius: 999px;
                background: var(--bg);
                box-shadow: inset 0 0 0 1px var(--hair);
                font-size: var(--text-sm);
                font-weight: 600;
                white-space: nowrap;
            }

            .chip.model {
                background: #fdeee2;
                box-shadow: none;
            }

            .chip .until {
                color: var(--muted);
                font-size: var(--text-xs);
                font-weight: 400;
            }

            .chip .ico.chev {
                width: 11px;
                height: 11px;
                color: var(--muted);
            }

            .chip .mark {
                width: 18px;
                height: 18px;
            }

            .main-action {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                height: 38px;
                margin-left: auto;
                padding: 0 18px 0 14px;
                border: 0;
                border-radius: 999px;
                background: var(--accent);
                color: #fff;
                font-size: var(--text-md);
                font-weight: 650;
            }

            .main-action svg {
                width: 11px;
                height: 11px;
                fill: currentColor;
            }

            /* 패널과 시트 */
            .scrim {
                position: absolute;
                inset: 48px 0 0;
                z-index: 5;
                background: rgb(26 31 54 / 0.14);
            }

            .panel {
                position: absolute;
                z-index: 10;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                border-radius: 18px;
                background: var(--bg);
                box-shadow: var(--shadow);
            }

            .panel-scroll {
                flex: 1;
                min-height: 0;
                overflow: hidden;
                padding: 18px 22px 14px;
            }

            .sheet {
                position: absolute;
                z-index: 10;
                inset: 64px 10px 0;
                display: flex;
                flex-direction: column;
                padding: 26px 24px 0;
                border-radius: 20px 20px 0 0;
                background: var(--bg);
                box-shadow: var(--shadow);
            }

            .sheet::before {
                content: "";
                position: absolute;
                top: 8px;
                left: 50%;
                width: 36px;
                height: 4px;
                margin-left: -18px;
                border-radius: 2px;
                background: var(--hair-strong);
            }

            .sheet-head {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .sheet-head h2 {
                margin-right: auto;
                font-size: var(--text-lg);
                font-weight: 650;
            }

            .panel-title {
                font-size: var(--title-sm);
                font-weight: 650;
                letter-spacing: -0.02em;
            }

            .group {
                margin-top: 18px;
            }

            .group-title {
                margin: 0 0 8px 4px;
                color: var(--ink-2);
                font-size: var(--text-sm);
                font-weight: 650;
            }

            .group-card {
                padding: 0 16px;
                border-radius: 14px;
                background: var(--surface);
                box-shadow: inset 0 0 0 1px var(--hair);
            }

            .group-card > * + * {
                border-top: 1px solid var(--hair);
            }

            .row {
                display: flex;
                align-items: center;
                gap: 12px;
                min-height: 44px;
                padding: 12px 0;
            }

            .row.nav {
                padding: 0;
            }

            .row-body {
                flex: 1;
                min-width: 0;
            }

            .row b {
                display: block;
                font-size: var(--text-md);
                font-weight: 600;
                line-height: 1.4;
            }

            .row small {
                display: block;
                margin-top: 2px;
                color: var(--muted);
                font-size: var(--text-sm);
                line-height: 1.45;
            }

            .row .val {
                color: var(--muted);
                font-size: var(--text-md);
            }

            .row.danger {
                color: var(--del);
                font-size: var(--text-md);
            }

            .switch {
                position: relative;
                flex: none;
                width: 42px;
                height: 24px;
                border-radius: 999px;
                background: var(--hair-strong);
            }

            .switch::after {
                content: "";
                position: absolute;
                top: 3px;
                left: 3px;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                background: #fff;
                box-shadow: 0 1px 2px rgb(26 31 54 / 0.2);
            }

            .switch.on {
                background: var(--ink);
            }

            .switch.on::after {
                left: 21px;
            }

            .pop {
                position: absolute;
                z-index: 10;
                top: 52px;
                right: 150px;
                width: 296px;
                padding: 16px 18px 14px;
                border-radius: 16px;
                background: var(--bg);
                box-shadow: var(--shadow);
            }

            .big-num {
                display: flex;
                align-items: baseline;
                gap: 4px;
                line-height: 1.1;
            }

            .big-num b {
                font-size: var(--display);
                font-weight: 300;
                letter-spacing: -0.04em;
            }

            .big-num span {
                font-size: var(--title-sm);
                font-weight: 500;
            }

            .pop .big-num b {
                font-size: var(--title-xl);
                font-weight: 600;
            }

            .pop .big-num span {
                font-size: var(--text-lg);
            }

            .pop-sub {
                margin-top: 4px;
                color: var(--muted);
                font-size: var(--text-sm);
            }

            .kv {
                margin-top: 12px;
                border-top: 1px solid var(--hair);
            }

            .kv div {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                padding: 9px 0 0;
                font-size: var(--text-sm);
            }

            .kv dt {
                color: var(--muted);
            }

            .kv dd {
                font-weight: 600;
            }

            /* 03 최근 7일 */
            .week {
                display: grid;
                grid-template-columns: repeat(7, minmax(0, 1fr));
                gap: 6px;
                margin-top: 40px;
            }

            .day {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-end;
                gap: 6px;
                text-align: center;
            }

            .day .val {
                color: var(--muted);
                font-size: var(--text-xs);
            }

            .day .bar {
                width: 30px;
                height: calc(var(--n) * 7px);
                border-radius: 7px 7px 4px 4px;
                background: var(--dot);
            }

            .day.last .bar {
                background: var(--ink);
            }

            .day.last .val {
                color: var(--ink);
                font-weight: 600;
            }

            .day.today .bar {
                height: 44px;
                border: 1.5px dashed var(--hair-strong);
                background: none;
            }

            .day .name {
                display: block;
                margin-top: 4px;
                padding-top: 10px;
                width: 100%;
                border-top: 1px solid var(--hair);
                font-size: var(--text-sm);
            }

            .day.today .name {
                font-weight: 700;
            }

            .day .date {
                display: block;
                color: var(--faint);
                font-size: var(--text-xs);
            }

            .recap {
                margin-top: 28px;
                padding-top: 16px;
                border-top: 1px solid var(--hair);
                color: var(--ink-2);
                font-size: var(--text-md);
                line-height: 1.65;
            }

            .recap b {
                color: var(--ink);
                font-weight: 650;
            }

            /* 04 달력 */
            .cal-hero {
                display: flex;
                align-items: flex-end;
                justify-content: space-between;
                margin-top: 20px;
            }

            .cal-hero .best {
                padding-bottom: 6px;
                color: var(--muted);
                font-size: var(--text-md);
                text-align: right;
            }

            .cal-hero .best b {
                color: var(--ink);
                font-weight: 650;
            }

            .month {
                display: flex;
                align-items: center;
                gap: 4px;
                margin-top: 26px;
            }

            .month h3 {
                font-size: var(--text-lg);
                font-weight: 650;
            }

            .month .nudge {
                display: grid;
                place-items: center;
                width: 28px;
                height: 28px;
                padding: 0;
                border: 0;
                border-radius: 7px;
                background: none;
                color: var(--muted);
            }

            .month .tally {
                margin-left: auto;
                color: var(--muted);
                font-size: var(--text-sm);
            }

            .month .tally b {
                color: var(--ink);
                font-weight: 650;
            }

            .cal-week,
            .cal {
                display: grid;
                grid-template-columns: repeat(7, minmax(0, 1fr));
                gap: 6px;
            }

            .cal-week {
                margin-top: 14px;
                color: var(--muted);
                font-size: var(--text-xs);
                text-align: center;
            }

            .cal {
                margin-top: 6px;
            }

            .cal i {
                display: block;
                height: 56px;
                padding: 6px 8px;
                border-radius: 8px;
                color: var(--faint);
                font-size: var(--text-xs);
                font-style: normal;
            }

            .cal i.l1 {
                background: #e3e6ef;
                color: var(--ink-2);
            }

            .cal i.l2 {
                background: var(--dot);
                color: var(--ink);
            }

            .cal i.l3 {
                background: #6a7189;
                color: #fff;
            }

            .cal i.l4 {
                background: var(--ink);
                color: #fff;
            }

            .cal i.pick {
                box-shadow:
                    0 0 0 2px var(--bg),
                    0 0 0 3.5px var(--ink);
            }

            .cal i.today {
                border: 1.5px dashed var(--hair-strong);
                color: var(--ink);
                font-weight: 700;
            }

            .legend {
                display: flex;
                align-items: center;
                gap: 6px;
                margin-top: 14px;
                color: var(--muted);
                font-size: var(--text-xs);
            }

            .legend i {
                width: 14px;
                height: 14px;
                border-radius: 4px;
            }

            .picked {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                align-items: center;
                gap: 2px 12px;
                margin-top: 20px;
                padding: 14px 0;
                border-top: 1px solid var(--hair);
            }

            .picked b {
                font-size: var(--text-md);
                font-weight: 600;
            }

            .picked p {
                color: var(--muted);
                font-size: var(--text-sm);
            }

            .picked .button {
                grid-row: 1 / 3;
                grid-column: 2;
            }

            /* 05 종료 후 */
            .course {
                flex: none;
                padding: 8px 32px 0;
            }

            .course-top {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 12px;
                font-size: var(--text-sm);
            }

            .status-line {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .status-dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--faint);
            }

            .status-dot.ok {
                background: var(--add);
            }

            .status-line b {
                font-weight: 600;
            }

            .status-line span,
            .clock {
                color: var(--muted);
            }

            .clock b {
                margin-right: 3px;
                color: var(--ink);
                font-weight: 600;
            }

            .track-row {
                display: grid;
                grid-template-columns: auto minmax(0, 1fr) auto;
                align-items: center;
                column-gap: 10px;
                min-height: 24px;
                padding-bottom: 8px;
                color: var(--faint);
                font-size: var(--text-xs);
            }

            .track {
                position: relative;
                height: 3px;
                border-radius: 2px;
                background: var(--chip);
            }

            .track .seg {
                position: absolute;
                top: 0;
                bottom: 0;
                left: calc(var(--from) * 1% + 1.5px);
                width: calc((var(--to) - var(--from)) * 1% - 3px);
                border-radius: 2px;
                background: var(--dot);
            }

            .track .commit {
                position: absolute;
                top: 50%;
                left: calc(var(--at) * 1%);
                width: 7px;
                height: 7px;

                    const cell = document.createElement("i");
                    cell.textContent = date;
                    if (commits[date]) {
                        cell.className = `l${getLevel(commits[date])}`;
                    }
                    if (date === 13) {
                        cell.classList.add("pick");
                    }
                    if (date === 14) {
                        cell.classList.add("today");
                    }
                    cal.append(cell);
                }

                const ticks = document.getElementById("ticks");
                for (let index = 1; index <= 12; index += 1) {
                    const tick = document.createElement("i");
                    if (index === 12) {
                        tick.className = "new";
                    }
                    ticks.append(tick);
                }

                const days = document.getElementById("days");
                for (let index = 0; index < 31; index += 1) {
                    const day = document.createElement("i");
                    if (index <= 16) {
                        day.className = "old";
                    } else if (index === 17) {
                        day.className = "miss";
                    } else if (index === 30) {
                        day.className = "today";
                    }
                    days.append(day);
                }

                const fit = () => {
                    document.querySelectorAll(".win").forEach((win) => {
                        const room = win.parentElement.clientWidth;
                        win.style.zoom = room < 600 ? room / 600 : 1;
                    });
                };
                window.addEventListener("resize", fit);
                fit();
            })();
        </script>
    </body>
</html>
