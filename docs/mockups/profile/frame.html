<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoPilot 프로필 패널 시안</title>
  <link rel="stylesheet" href="../../../desktop/styles.css">
  <link rel="stylesheet" href="profile.css">
  <script src="../../../desktop/sky.js" defer></script>
  <script src="profile.js" defer></script>
</head>
<body data-status="idle" class="usage-open">
  <svg width="0" height="0" class="defs" aria-hidden="true"></svg>

  <div id="sky" class="sky" aria-hidden="true">
    <div class="sky-fill"></div>
    <div class="sky-glow"></div>
    <svg id="sky-stars" class="stars"></svg>
    <div class="sun"><svg viewBox="-50 -50 100 100"><circle r="30" /></svg></div>
    <div class="moon"><i class="moon-lit"></i></div>
    <div id="sky-clouds" class="clouds"></div>
    <div id="sky-meteors" class="meteors"></div>
  </div>

  <header id="titlebar" class="titlebar">
    <div class="window-controls">
      <button type="button" id="usage-toggle" class="window-control usage-toggle" aria-label="프로필" title="프로필" aria-expanded="true">
        <svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="4.2" r="2.1" /><path d="M2 10.4c.5-2.1 2.1-3.1 4-3.1s3.5 1 4 3.1" /></svg>
      </button>
      <button type="button" class="window-control settings-toggle" aria-label="설정" title="설정">
        <svg viewBox="0 0 12 12" aria-hidden="true">
          <path d="M10.93 5.18L10.93 6.82L9.78 6.94L9.34 8.01L10.07 8.91L8.91 10.07L8.01 9.34L6.94 9.78L6.82 10.93L5.18 10.93L5.06 9.78L3.99 9.34L3.09 10.07L1.93 8.91L2.66 8.01L2.22 6.94L1.07 6.82L1.07 5.18L2.22 5.06L2.66 3.99L1.93 3.09L3.09 1.93L3.99 2.66L5.06 2.22L5.18 1.07L6.82 1.07L6.94 2.22L8.01 2.66L8.91 1.93L10.07 3.09L9.34 3.99L9.78 5.06Z" />
          <circle cx="6" cy="6" r="1.6" />
        </svg>
      </button>
      <button type="button" class="window-control" aria-label="최소화"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6h7" /></svg></button>
      <button type="button" class="window-control" aria-label="최대화"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" rx="1.5" /></svg></button>
      <button type="button" class="window-control close" aria-label="닫기"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" /></svg></button>
    </div>
  </header>

  <div class="content">
    <main class="stage">
      <div class="hero">
        <h1 class="brand"><img src="../../../docs/logo.png" alt="AutoPilot" /></h1>
        <div class="status"><p class="status-line"><b class="state" data-tone="muted">대기 중</b></p></div>
        <div class="run-form"><button type="button" class="main-action">시작</button></div>
      </div>
    </main>
  </div>

  <aside id="usage" class="settings" aria-labelledby="usage-title">
    <div class="settings-head"><h2 id="usage-title">프로필</h2></div>
    <div id="panel-body" class="panel-body"></div>
  </aside>
</body>
</html>
