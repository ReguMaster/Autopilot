<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단계 진행 표시 시안</title>
<link rel="stylesheet" href="../../../desktop/fonts/pretendard.css">
<link rel="stylesheet" href="mock.css">
<style>
.pair { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 20px; }

/* 앱의 본문 열을 흉내 낸 틀. 폭이 700px 이하로 내려가면(창 960px 이하) 좁은 배치가 켜진다 */
.frame { container-type: inline-size; display: grid; align-content: start; gap: 16px; padding: 20px; border-radius: var(--r-xl); background: var(--page); box-shadow: inset 0 0 0 1px var(--hair-strong); }
.frame.wide { width: 912px; max-width: 100%; }
.frame.narrow { width: 600px; max-width: 100%; }
.scene { display: grid; gap: 6px; }
.scene-body { display: grid; align-content: start; }

/* 확인받기로 둔 단계 표시 */
.gate-mark { display: inline-block; flex: none; width: 6px; height: 6px; rotate: 45deg; border-radius: 1.5px; background: var(--hair-strong); }
[data-state="done"] > .gate-mark, [data-state="done"] .gate-mark { background: var(--add); }
[data-state="hold"] > .gate-mark, [data-state="hold"] .gate-mark { background: var(--warn-fill); }
[data-state="active"] .gate-mark, [data-state="next"] .gate-mark { background: var(--accent-line); }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; color: var(--muted); font-size: var(--text-xs); font-weight: 600; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }

/* 시안 B·C의 설정 칩 */
.set-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.set-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border: 0; border-radius: 999px; background: var(--chip); color: var(--muted); font-size: var(--text-xs); font-weight: 600; }
.set-chip .icon { width: 11px; height: 11px; stroke-width: 2; opacity: 0; width: 0; margin-right: -6px; transition: opacity 0.2s var(--ease-out), width 0.2s var(--ease-out), margin 0.2s var(--ease-out); }
.set-chip[aria-pressed="true"] { background: var(--bg); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--hair-strong); color: var(--ink); }
.set-chip[aria-pressed="true"] .icon { width: 11px; margin-right: 0; opacity: 1; }
.set-chip.sel { cursor: default; background: var(--bg); box-shadow: inset 0 0 0 1px var(--hair-strong); color: var(--ink-2); }
.set-chip.sel b { color: var(--ink); font-weight: 600; }
.set-chip.sel .icon { opacity: 1; width: 11px; margin: 0; color: var(--muted); }
.set-chip:focus-visible, .c-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ───── 현재: StepCard.css 그대로. 폭 조건만 컨테이너 쿼리로 바꿨다 ───── */
.step-card { position: relative; display: grid; flex: none; grid-template-columns: repeat(5, minmax(0, 1fr)); margin: 0; padding: 0; overflow: hidden; border-radius: var(--r-lg); background: var(--bg); box-shadow: var(--shadow-1); list-style: none; }
.step-card::before { content: ""; position: absolute; inset: 0 0 auto; z-index: 1; height: 2px; background: linear-gradient(to right, var(--add) var(--step-progress, 0%), var(--hair) 0); }
.step { position: relative; display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 13px 14px 14px; box-shadow: inset 1px 0 0 var(--hair); }
.step:first-child { box-shadow: none; }
.step-top { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: var(--text-md); font-weight: 600; }
.step-node { display: grid; flex: none; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--chip); font-size: 11px; font-weight: 700; }
.step-node .icon { width: 12px; height: 12px; stroke-width: 2; }
.step-detail { padding-left: 28px; overflow: hidden; color: var(--faint); font-size: var(--text-xs); text-overflow: ellipsis; white-space: nowrap; }
.step[data-state="done"] .step-top { color: var(--ink); }
.step[data-state="done"] .step-node { background: var(--ok-wash); color: var(--add); }
.step[data-state="active"] { background: var(--accent-wash); }
.step[data-state="active"] :is(.step-top, .step-detail) { color: var(--accent-ink); }
.step[data-state="active"] .step-node { background: var(--accent); color: #fff; }
.step:is([data-state="active"], [data-state="hold"])::after { content: ""; position: absolute; inset: auto 0 0; height: 3px; background: var(--accent); }
.step[data-state="hold"] { background: var(--warn-wash); }
.step[data-state="hold"]::after { background: var(--warn-fill); }
.step[data-state="hold"] :is(.step-top, .step-detail) { color: var(--warn); }
.step[data-state="hold"] .step-node { background: var(--warn-fill); color: #fff; }
.step[data-state="waiting"] .step-node { background: transparent; box-shadow: inset 0 0 0 1px var(--hair-strong); color: var(--faint); }
.step[data-state="next"] .step-top { color: var(--ink); }
.step[data-state="next"] .step-node { background: transparent; box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent-ink); }
.step[data-state="next"] .step-detail { color: var(--accent-ink); }
.step-set { display: grid; justify-items: start; gap: 8px; margin-top: 12px; }
.step-check { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: var(--text-sm); cursor: pointer; }
.step-check input { flex: none; width: 16px; height: 16px; margin: 0; accent-color: var(--accent); cursor: inherit; }
.step-none { color: var(--faint); font-size: var(--text-xs); line-height: 1.5; }
.fake-select { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; max-width: 220px; height: 32px; padding: 0 10px; border-radius: 8px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hair-strong); color: var(--ink); font-size: var(--text-sm); }
.fake-select .icon { width: 11px; height: 11px; color: var(--muted); }
@container (max-width: 700px) {
    .step-card.expanded { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .step-card.expanded .step { grid-column: span 2; }
    .step-card.expanded .step:nth-child(n + 4) { grid-column: span 3; }
    .step-card.expanded .step:nth-child(4) { box-shadow: inset 0 1px 0 var(--hair); }
    .step-card.expanded .step:nth-child(5) { box-shadow: inset 1px 0 0 var(--hair), inset 0 1px 0 var(--hair); }
}

/* ───── A. 한 줄 스테퍼 ───── */
.a-card { display: flex; align-items: center; height: 40px; margin: 0; padding: 0 8px 0 10px; border-radius: var(--r-lg); background: var(--bg); box-shadow: var(--shadow-1); list-style: none; overflow: hidden; }
.a-step { display: flex; align-items: center; flex: none; gap: 7px; height: 26px; padding: 0 6px; border-radius: 999px; color: var(--faint); font-size: var(--text-sm); font-weight: 600; white-space: nowrap; }
.a-node { display: grid; place-items: center; flex: none; width: 18px; height: 18px; border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 1px var(--hair-strong); color: var(--faint); font-size: 11px; font-weight: 700; }
.a-node .icon { width: 11px; height: 11px; stroke-width: 2; }
.a-sub { color: var(--faint); font-size: var(--text-xs); font-weight: 500; }
.a-link { flex: 1 1 10px; min-width: 8px; height: 2px; margin: 0 4px; border-radius: 2px; background: var(--hair); }
.a-link[data-from="done"] { background: var(--add); }
.a-link[data-from="active"] { background: linear-gradient(to right, var(--accent) 35%, var(--hair) 0); }
.a-link[data-from="hold"] { background: linear-gradient(to right, var(--warn-fill) 35%, var(--hair) 0); }
.a-step[data-state="done"] { color: var(--ink); }
.a-step[data-state="done"] .a-node { background: var(--ok-wash); box-shadow: none; color: var(--add); }
.a-step[data-state="done"] .a-sub { color: var(--muted); }
.a-step[data-state="active"] { padding-right: 12px; background: var(--accent-wash); color: var(--accent-ink); }
.a-step[data-state="active"] .a-node { background: var(--accent); box-shadow: none; color: #fff; }
.a-step[data-state="active"] .a-sub { color: var(--accent-ink); }
.a-step[data-state="hold"] { padding-right: 12px; background: var(--warn-wash); color: var(--warn); }
.a-step[data-state="hold"] .a-node { background: var(--warn-fill); box-shadow: none; color: #fff; }
.a-step[data-state="hold"] .a-sub { color: var(--warn); }
.a-step[data-state="next"] { color: var(--ink); }
.a-step[data-state="next"] .a-node { box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent-ink); }
.a-step[data-state="next"] .a-sub { color: var(--accent-ink); }
@container (max-width: 700px) {
    .a-step { gap: 6px; padding: 0 3px; }
    .a-step:is([data-state="waiting"], [data-state="done"]) :is(.a-label, .a-sub, .gate-mark) { display: none; }
    .a-step[data-state="next"] .a-gate-extra { display: none; }
    .a-step[data-state="active"], .a-step[data-state="hold"] { padding: 0 10px 0 3px; }
}

/* ───── B. 얇은 세그먼트 바 + 현재 단계 라벨 ───── */
.b-card { display: flex; gap: 5px; margin: 0; padding: 11px 14px 9px; border-radius: var(--r-lg); background: var(--bg); box-shadow: var(--shadow-1); list-style: none; }
.b-step { display: grid; flex: 1 1 0; gap: 6px; min-width: 0; transition: flex-grow 0.5s var(--ease-out); }
.b-step:is([data-state="active"], [data-state="hold"], [data-state="next"]) { flex-grow: 2.6; }
.b-seg { position: relative; height: 4px; border-radius: 4px; background: var(--hair); overflow: hidden; }
.b-step[data-state="done"] .b-seg { background: var(--add); }
.b-step[data-state="active"] .b-seg { background: var(--accent-line); }
.b-step[data-state="active"] .b-seg::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 38%; border-radius: 4px; background: var(--accent); animation: b-sweep 1.8s var(--ease-in-out) infinite; }
.b-step[data-state="hold"] .b-seg { background: var(--warn-fill); animation: breathe 2.2s ease-in-out infinite; }
.b-step[data-state="next"] .b-seg { background: repeating-linear-gradient(90deg, var(--accent) 0 5px, transparent 5px 9px); opacity: 0.55; }
@keyframes b-sweep { from { translate: -100% 0; } to { translate: 263% 0; } }
.b-label { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--faint); font-size: var(--text-xs); font-weight: 600; white-space: nowrap; }
.b-name { overflow: hidden; text-overflow: ellipsis; }
.b-sub { overflow: hidden; color: var(--faint); font-weight: 500; text-overflow: ellipsis; }
.b-step[data-state="done"] .b-label { color: var(--ink); }
.b-step[data-state="done"] .b-sub { color: var(--muted); }
.b-step[data-state="active"] .b-label, .b-step[data-state="active"] .b-sub, .b-step[data-state="next"] .b-sub { color: var(--accent-ink); }
.b-step[data-state="next"] .b-label { color: var(--ink); }
.b-step[data-state="hold"] .b-label, .b-step[data-state="hold"] .b-sub { color: var(--warn); }
@container (max-width: 700px) {
    .b-card { padding: 11px 12px 9px; gap: 4px; }
    .b-step[data-state="waiting"] .b-gate, .b-step[data-state="done"] .b-sub { display: none; }
}

/* ───── C. 요약 한 줄 + 펼치기 ───── */
.c-card { display: flex; align-items: center; gap: 14px; height: 36px; padding: 0 6px 0 14px; border-radius: var(--r-lg); background: var(--bg); box-shadow: var(--shadow-1); }
.c-dots { display: flex; align-items: center; flex: none; gap: 4px; padding: 0; list-style: none; }
.c-dots li { position: relative; width: 6px; height: 6px; border-radius: 6px; background: var(--hair-strong); overflow: hidden; transition: width 0.4s var(--ease-out); }
.c-dots li[data-state="done"] { width: 14px; background: var(--add); }
.c-dots li[data-state="active"] { width: 28px; background: var(--accent-line); }
.c-dots li[data-state="active"]::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 6px; background: var(--accent); animation: c-sweep 1.8s var(--ease-in-out) infinite; }
.c-dots li[data-state="hold"] { width: 28px; background: var(--warn-fill); animation: breathe 2.2s ease-in-out infinite; }
.c-dots li[data-state="next"] { width: 10px; background: transparent; box-shadow: inset 0 0 0 1.5px var(--accent); }
@keyframes c-sweep { from { translate: -100% 0; } to { translate: 250% 0; } }
.c-now { display: flex; align-items: baseline; flex: 1; gap: 8px; min-width: 0; white-space: nowrap; }
.c-now b { font-size: var(--text-md); font-weight: 650; }
.c-now span { overflow: hidden; color: var(--accent-ink); font-size: var(--text-sm); font-weight: 600; text-overflow: ellipsis; }
.c-now em { color: var(--faint); font-size: var(--text-xs); font-style: normal; }
.c-card[data-tone="hold"] .c-now span { color: var(--warn); }
.c-toggle { display: inline-flex; align-items: center; flex: none; gap: 5px; height: 26px; padding: 0 9px 0 11px; border: 0; border-radius: 999px; background: var(--chip); color: var(--ink-2); font-size: var(--text-xs); font-weight: 600; }
.c-toggle:hover { color: var(--ink); }
.c-toggle .icon { width: 11px; height: 11px; transition: rotate 0.3s var(--ease-out); }
.c-toggle[aria-expanded="true"] .icon { rotate: 180deg; }
.c-drawer { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.38s var(--ease-out); }
.c-drawer[data-open] { grid-template-rows: 1fr; }
.c-drawer > div { min-height: 0; margin: 0 -12px; overflow: hidden; }
.c-drawer .step-card { margin: 8px 12px 16px; }
.c-drawer:not([data-open]) { visibility: hidden; transition: grid-template-rows 0.38s var(--ease-out), visibility 0s 0.38s; }
@container (max-width: 700px) {
    .c-now em, .c-toggle .c-toggle-text { display: none; }
    .c-toggle { padding: 0 9px; }
}

@media (prefers-reduced-motion: reduce) {
    .b-step[data-state="active"] .b-seg::after, .c-dots li[data-state="active"]::after { animation: breathe 2.2s ease-in-out infinite; translate: 0 0; width: 100%; }
    .b-step, .c-dots li, .c-drawer, .c-toggle .icon { transition: none; }
}
</style>
</head>
<body>
<header class="m-top">
    <h1>단계 진행 표시 시안</h1>
    <nav class="m-nav" aria-label="시안 바로가기">
        <a href="#cur">현재</a><a href="#a">A 한 줄 스테퍼</a><a href="#b">B 세그먼트 바</a><a href="#c">C 요약 한 줄</a>
    </nav>
    <div class="m-tools"><button type="button" id="m-theme" class="m-btn">화면 테마: 시스템</button></div>
</header>

<main class="m-main">
    <p class="m-intro">
        기획·디자인·개발·테스트/QA·보안검토 다섯 칸이 본문 맨 위를 70~150px나 차지해서, 아래 안들은 높이를 줄이고 지금 단계만 크게 보이게 했어요.
        같은 장면을 현재 카드와 세 안에 모두 넣었고, 높이는 이 화면에서 직접 잰 값이에요. 설정(확인받기·디자인 산출물·되돌리는 횟수)은 시작 전 화면에서만 보여요.
    </p>
    <div class="legend" aria-label="표시 안내">
        <span><i class="gate-mark" style="background: var(--add)"></i>확인받기로 둔 단계(확인함)</span>
        <span><i class="gate-mark" style="background: var(--warn-fill)"></i>확인을 기다리는 중</span>
        <span><i class="gate-mark"></i>아직 확인 전</span>
    </div>

    <section class="m-sec" id="cur" data-variant="cur"></section>
    <section class="m-sec" id="a" data-variant="a"></section>
    <section class="m-sec" id="b" data-variant="b"></section>
    <section class="m-sec" id="c" data-variant="c"></section>
</main>

<script src="mock.js"></script>
<script>
const PHASES = [["plan", "기획"], ["design", "디자인"], ["build", "개발"], ["qa", "테스트/QA"], ["security", "보안검토"]];
const DETAILS = { plan: "만들 것을 정리해요", design: "화면을 그려요", build: "코드를 짜고 커밋해요", qa: "실패하면 개발로 3번", security: "심각하면 개발로 3번" };
const GATES = ["plan", "design"];

const make = (states, details = {}) => PHASES.map(([phase, label], index) => ({ phase: phase, label: label, state: states[index], detail: details[phase] ?? DETAILS[phase] }));

// 앱의 getReadySteps·getRunSteps가 만드는 칸과 같은 모양이다.
const SCENES = [
    { id: "ready", title: "시작 전: 처음부터", isReady: true, cells: make(["waiting", "waiting", "waiting", "waiting", "waiting"]) },
    { id: "resume", title: "시작 전: 디자인부터 이어서", isReady: true, cells: make(["done", "next", "waiting", "waiting", "waiting"], { plan: "마쳤어요", design: "여기부터 이어서 해요" }) },
    { id: "run", title: "실행 중: 개발 2회차", cells: make(["done", "done", "active", "waiting", "waiting"], { plan: "확인함", design: "확인함", build: "2회차" }) },
    { id: "retry", title: "실행 중: 테스트/QA에서 돌아온 개발", cells: make(["done", "done", "active", "waiting", "waiting"], { plan: "확인함", design: "확인함", build: "다시 개발 QA 1/3" }) },
    { id: "hold", title: "확인 대기: 기획", cells: make(["hold", "waiting", "waiting", "waiting", "waiting"], { plan: "확인을 기다려요" }) }
];
const NARROW_IDS = ["ready", "retry", "hold"];

// 압축 안들: 아직 지금 단계가 없으면 첫 칸을 "여기서 시작해요"로 둔다.
const normalize = (cells) => {
    const hasNow = cells.some((cell) => ["active", "hold", "next"].includes(cell.state));

    return cells.map((cell, index) => (!hasNow && index === 0 ? { ...cell, state: "next", detail: "여기서 시작해요" } : cell));
};

const gateMark = (cell, extra = "") => (GATES.includes(cell.phase) ? `<i class="gate-mark ${extra}" title="확인받기로 둔 단계"></i>` : "");
const nodeIcon = (cell, index) => (cell.state === "done" ? icon("check") : cell.state === "hold" ? icon("pause") : index + 1);

const fakeSelect = (text) => `<span class="fake-select">${text}${icon("chevron")}</span>`;
const stepSettings = (phase) => {
    const check = `<label class="step-check"><input type="checkbox" checked>확인받기</label>`;

    return { plan: check, design: check + fakeSelect("HTML 와이어프레임"), build: `<p class="step-none">따로 정할 것이 없어요</p>`, qa: fakeSelect("실패하면 개발로 3번"), security: fakeSelect("심각하면 개발로 3번") }[phase];
};

// 현재 카드(StepCard.jsx와 같은 마크업)
const renderCurrent = (scene) => {
    const doneCount = scene.cells.filter((cell) => cell.state === "done").length;
    const items = scene.cells
        .map(
            (cell, index) => `<li class="step" data-state="${cell.state}">
                <div class="step-top"><span class="step-node">${cell.state === "done" ? icon("check") : cell.state === "hold" ? icon("pause") : index + 1}</span><span class="step-label">${cell.label}</span></div>
                <p class="step-detail" title="${cell.detail}">${cell.detail}</p>
                ${scene.isReady ? `<div class="step-set">${stepSettings(cell.phase)}</div>` : ""}
            </li>`
        )
        .join("");

    return `<ol class="step-card ${scene.isReady ? "expanded" : ""}" style="--step-progress:${(doneCount / scene.cells.length) * 100}%">${items}</ol>`;
};

const settingStrip = () => `<div class="set-strip" role="group" aria-label="단계 설정">
    <button type="button" class="set-chip" aria-pressed="true">${icon("check")}기획 확인받기</button>
    <button type="button" class="set-chip" aria-pressed="true">${icon("check")}디자인 확인받기</button>
    <span class="set-chip sel">디자인 산출물 <b>HTML</b>${icon("chevron")}</span>
    <span class="set-chip sel">QA 실패하면 <b>개발로 3번</b>${icon("chevron")}</span>
    <span class="set-chip sel">보안 심각하면 <b>개발로 3번</b>${icon("chevron")}</span>
</div>`;

const renderA = (scene) => {
    const cells = normalize(scene.cells);
    const html = cells
        .map((cell, index) => {
            const sub = cell.state === "waiting" ? "" : `<span class="a-sub">${cell.detail}</span>`;
            const step = `<li class="a-step" data-state="${cell.state}" title="${cell.label}: ${cell.detail}" ${["active", "hold"].includes(cell.state) ? 'aria-current="step"' : ""}><span class="a-node">${nodeIcon(cell, index)}</span><span class="a-label">${cell.label}</span>${gateMark(cell)}${sub}</li>`;
            const link = index < cells.length - 1 ? `<li class="a-link" data-from="${cell.state}" aria-hidden="true"></li>` : "";

            return step + link;
        })
        .join("");

    return `<ol class="a-card" aria-label="신규 개발 단계">${html}</ol>${scene.isReady ? settingStrip() : ""}`;
};

const renderB = (scene) => {
    const cells = normalize(scene.cells);
    const html = cells
        .map((cell) => {
            const sub = cell.state === "waiting" ? "" : `<span class="b-sub">${cell.detail}</span>`;

            return `<li class="b-step" data-state="${cell.state}" title="${cell.label}: ${cell.detail}" ${["active", "hold"].includes(cell.state) ? 'aria-current="step"' : ""}><span class="b-seg"></span><span class="b-label"><span class="b-name">${cell.label}</span>${gateMark(cell, "b-gate")}${sub}</span></li>`;
        })
        .join("");

    return `<ol class="b-card" aria-label="신규 개발 단계">${html}</ol>${scene.isReady ? settingStrip() : ""}`;
};

const renderC = (scene, isOpen = false) => {
    const cells = normalize(scene.cells);
    const now = cells.find((cell) => ["active", "hold"].includes(cell.state)) ?? cells.find((cell) => cell.state === "next");
    const dots = cells.map((cell) => `<li data-state="${cell.state}" title="${cell.label}: ${cell.detail}"></li>`).join("");
    const label = scene.isReady ? "단계 설정" : "단계 보기";

    return `<div class="c-wrap">
        <div class="c-card" data-tone="${now.state}">
            <ol class="c-dots" aria-label="신규 개발 단계">${dots}</ol>
            <p class="c-now"><b>${now.label}</b><span>${now.detail}</span><em>${cells.indexOf(now) + 1} / 5</em></p>
            <button type="button" class="c-toggle" aria-expanded="${isOpen}">${icon(scene.isReady ? "gear" : "chevron")}<span class="c-toggle-text">${label}</span>${scene.isReady ? icon("chevron") : ""}</button>
        </div>
        <div class="c-drawer" ${isOpen ? "data-open" : ""}><div>${renderCurrent(scene)}</div></div>
    </div>`;
};

const VARIANTS = {
    cur: { name: "현재 카드(기준)", desc: "다섯 칸이 이어 붙은 카드. 시작 전에는 칸 아래에 설정까지 펼쳐지고, 좁은 창에서는 두 줄로 접혀요.", render: renderCurrent },
    a: { name: "A. 한 줄 스테퍼", desc: "높이 40px 한 줄에 다섯 단계를 점과 선으로 이어요. 지금 단계만 알약으로 커지며 설명이 붙고, 지난 단계는 확인함·마쳤어요만 남겨요. 좁으면 지금 단계 말고는 번호만 보여요. 설정은 아래 칩 한 줄로 옮겼어요.", render: renderA },
    b: { name: "B. 얇은 세그먼트 바 + 지금 단계 라벨", desc: "4px 막대 다섯 개가 진행 계기판이에요. 지금 단계 막대가 길어지고 파란 빛이 흘러요. 라벨은 막대 바로 아래 한 줄이고, 설정은 아래 칩 한 줄이에요.", render: renderB },
    c: { name: "C. 요약 한 줄 + 펼치기", desc: "36px 한 줄에 점 다섯 개와 지금 단계만 적어요. 평소엔 접혀 있고, 눌러서 펼치면 현재 카드와 설정이 그대로 나와요. 가장 작지만 단계 설정은 한 번 더 눌러야 해요.", render: renderC }
};

const sceneHtml = (variantKey, scene, index) => {
    const body = variantKey === "c" ? renderC(scene, scene.id === "ready" && index === 0) : VARIANTS[variantKey].render(scene);

    return `<div class="scene" data-scene="${scene.id}"><h3 class="m-cap">${scene.title}</h3><div class="scene-body">${body}</div></div>`;
};

const frameHtml = (variantKey, ids, className, caption) => {
    const scenes = SCENES.filter((scene) => ids.includes(scene.id));

    return `<div><p class="m-cap" style="margin-bottom:8px">${caption}</p><div class="frame ${className}">${scenes.map((scene, index) => sceneHtml(variantKey, scene, index)).join("")}</div></div>`;
};

document.querySelectorAll("[data-variant]").forEach((section) => {
    const key = section.dataset.variant;
    const variant = VARIANTS[key];

    section.innerHTML = `<div class="m-head"><h2>${variant.name}</h2><p class="m-desc">${variant.desc}</p><div class="m-meas" data-meas="${key}"></div></div>
        <div class="pair">${frameHtml(key, SCENES.map((scene) => scene.id), "wide", "넓은 창(본문 폭 872px)")}${frameHtml(key, NARROW_IDS, "narrow", "좁은 창(960px 이하, 본문 폭 560px)")}</div>`;
});

// C의 펼치기, 설정 칩 토글
document.addEventListener("click", (event) => {
    const toggle = event.target.closest(".c-toggle");
    const chip = event.target.closest(".set-chip[aria-pressed]");

    if (toggle) {
        const isOpen = toggle.getAttribute("aria-expanded") !== "true";

        toggle.setAttribute("aria-expanded", String(isOpen));
        toggle.closest(".c-wrap").querySelector(".c-drawer").toggleAttribute("data-open", isOpen);
    }

    if (chip) {
        chip.setAttribute("aria-pressed", String(chip.getAttribute("aria-pressed") !== "true"));
    }
});

// 높이는 그려 놓은 화면에서 직접 잰다.
const measure = () => {
    const height = (selector, root) => Math.round(root.querySelector(selector).getBoundingClientRect().height);
    const read = (key) => {
        const wide = document.querySelector(`#${key} .frame.wide`);
        const narrow = document.querySelector(`#${key} .frame.narrow`);
        const card = key === "cur" ? ".step-card" : key === "a" ? ".a-card" : key === "b" ? ".b-card" : ".c-card";

        return {
            run: height(`[data-scene="run"] ${card}`, wide),
            ready: height(`[data-scene="ready"] .scene-body`, wide),
            narrowReady: height(`[data-scene="ready"] .scene-body`, narrow),
            narrowRun: height(`[data-scene="retry"] .scene-body`, narrow)
        };
    };
    const base = read("cur");
    const percent = (value, from) => `−${Math.round((1 - value / from) * 100)}%`;

    for (const key of ["cur", "a", "b", "c"]) {
        const size = read(key);
        const target = document.querySelector(`[data-meas="${key}"]`);

        if (key === "cur") {
            target.innerHTML = `<span>실행 중 한 줄 ${size.run}px</span><span>시작 전 ${size.ready}px</span><span>좁은 폭 시작 전 ${size.narrowReady}px</span><span>좁은 폭 실행 중 ${size.narrowRun}px</span>`;
            continue;
        }

        const ready = key === "c" ? `시작 전 접힘 ${size.run}px (${percent(size.run, base.ready)})` :`시작 전 ${size.ready}px (${percent(size.ready, base.ready)})`;
        const narrowReady = key === "c" ? `좁은 폭 접힘 ${height(".c-card", document.querySelector(`#${key} .frame.narrow`))}px (${percent(height(".c-card", document.querySelector(`#${key} .frame.narrow`)), base.narrowReady)})` : `좁은 폭 시작 전 ${size.narrowReady}px (${percent(size.narrowReady, base.narrowReady)})`;

        target.innerHTML = `<span class="good">실행 중 한 줄 ${size.run}px (${percent(size.run, base.run)})</span><span class="good">${ready}</span><span>${narrowReady}</span><span>좁은 폭 실행 중 ${size.narrowRun}px</span>${key === "c" ? `<span>펼침(시작 전) ${size.ready}px</span>` : ""}`;
    }
};

document.fonts.ready.then(() => requestAnimationFrame(measure));
</script>
</body>
</html>
