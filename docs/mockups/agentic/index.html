<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoPilot 리디자인 시안</title>
  <style>
    @font-face { font-family: "Pretendard"; src: url("../../../desktop/fonts/PretendardVariable.woff2") format("woff2-variations"); font-weight: 45 920; }
    :root { --ink: #1c2230; --muted: #5d6677; --line: #d5dae3; --bg: #e9ecf1; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 24px 64px; background: var(--bg); color: var(--ink); font: 14px/1.6 "Pretendard", "Malgun Gothic", sans-serif; }
    main { max-width: 980px; margin: 0 auto; }
    h1 { margin: 0 0 6px; font-size: 24px; font-weight: 800; letter-spacing: -0.01em; }
    .lead { margin: 0 0 20px; max-width: 64ch; color: var(--muted); }
    .toc { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 44px; padding: 0; list-style: none; }
    .toc a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
    .toc a:hover, .toc a:focus-visible { border-color: var(--ink); outline: none; }
    section { margin: 0 0 56px; scroll-margin-top: 24px; }
    .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 0 0 4px; }
    h2 { margin: 0; font-size: 18px; font-weight: 750; }
    .head a { margin-left: auto; color: var(--muted); font-size: 13px; }
    .desc { margin: 0 0 14px; max-width: 72ch; color: var(--muted); }
    .frames { display: flex; flex-wrap: wrap; gap: 20px; }
    figure { margin: 0; }
    .window { position: relative; width: 300px; height: 400px; overflow: hidden; border-radius: 8px; background: #fff; box-shadow: 0 1px 2px rgb(20 30 50 / 0.12), 0 8px 28px rgb(20 30 50 / 0.14); }
    .window iframe, .window img { position: absolute; inset: 0; width: 600px; height: 800px; border: 0; transform: scale(0.5); transform-origin: 0 0; }
    .window img { width: 300px; height: 400px; transform: none; object-fit: cover; }
    figcaption { margin-top: 8px; color: var(--muted); font-size: 13px; }
    figcaption a { color: inherit; }
  </style>
</head>
<body>
<main>
  <h1>AutoPilot 리디자인 시안</h1>
  <p class="lead">메인 화면(실행 중), 설정 패널, 프로필 패널을 시안마다 같은 가짜 데이터로 그렸어요. 각 칸은 600×800 창을 절반으로 줄인 것이고, 제목 옆 링크로 원래 크기로 열 수 있어요. 주소 끝을 #main, #settings, #profile로 바꾸면 화면이 바뀌어요.</p>
  <ul id="toc" class="toc"></ul>
  <div id="list"></div>
</main>
<script>
  const CONCEPTS = [
    ["current", "지금 디자인", "비교용 현재 화면이에요. 수채 하늘 위에 로고, 시작 버튼, 작업 입력, 옵션 알약을 가운데 정렬로 쌓았어요."],
    ["branch", "커밋 그래프", "밤새 자라는 ai/autopilot 브랜치가 메인이에요. 회차는 선 위의 마디, 커밋은 마디에 매달린 줄(해시와 +/−)이고, 지금 회차의 선이 아직 그려지는 중이에요."],
    ["diff", "라이브 리뷰", "지금 회차가 고치는 파일을 PR 리뷰 화면처럼 보여줘요. 바뀐 파일 목록과 diff 덩어리가 한 줄씩 늘어나요."],
    ["heatmap", "밤의 히트맵", "00:30부터 07:00까지를 10분 칸으로 나눈 깃허브 잔디예요. 칸 색은 일한 양, 점은 커밋, 지금 칸이 차오르는 중이에요."],
    ["terminal", "라이트 TUI", "lazygit이나 Claude Code 같은 터미널 UI를 밝은 테마로 옮겼어요. 색마다 뜻이 있고, 아래 줄에 단축키가 있어요."],
    ["palette", "커맨드 팔레트", "입력창 하나에 작업을 적고 /모델, /effort 같은 토큰으로 옵션을 붙이는 키보드 중심 화면이에요."],
    ["receipt", "감열지 영수증", "회차마다 영수증이 한 장씩 인쇄돼요. 지금 회차는 프린터에서 나오는 중이고, 맨 아래에 합계가 붙어요."],
    ["cockpit", "조종석", "이름 그대로 여객기 오토파일럿 패널이에요. 옵션은 표시창과 노브, 시작은 A/P 버튼, 아래는 07:00까지의 항로예요."],
    ["bedside", "머리맡 알람 시계", "자는 동안 보는 화면이라 어두운 바탕에 7세그먼트 LED로 남은 시간만 크게 보여줘요."],
    ["dial", "바우하우스 다이얼", "실행 전체를 원 하나로 그렸어요. 회차는 원 위의 호, 커밋은 점, 바늘이 지금 시각을 가리켜요."],
    ["thread", "에이전트 스레드", "Codex나 Claude 웹처럼 회차별 작업이 스레드로 흐르고, 아래에 옵션 알약이 붙은 컴포저가 있어요."],
    ["checklist", "스스로 지워지는 할 일", "적어 둔 작업 목록이 주인공이에요. 끝난 줄은 커밋 해시와 함께 그어지고, 지금 하는 줄 아래에 에이전트의 현재 동작이 보여요."],
    ["glass", "리퀴드 글래스", "지금의 하늘 배경은 살리고, 버튼과 옵션 막대를 두꺼운 유리 재질로 바꿨어요."]
  ];
  const SCREENS = [["main", "메인"], ["settings", "설정"], ["profile", "프로필"]];
  const CURRENT_SHOTS = { main: "running.png", settings: "settings.png", profile: "profile.png" };

  const toc = document.getElementById("toc");
  const list = document.getElementById("list");

  CONCEPTS.forEach(([id, name, desc], index) => {
    const isCurrent = id === "current";
    const label = isCurrent ? name : `${index}. ${name}`;
    const frames = SCREENS.map(([screen, caption]) => {
      const view = isCurrent
        ? `<img src="../../screenshots/${CURRENT_SHOTS[screen]}" alt="${name} ${caption}">`
        : `<iframe src="${id}.html#${screen}" title="${name} ${caption}" loading="lazy"></iframe>`;
      const link = isCurrent ? caption : `<a href="${id}.html#${screen}">${caption}</a>`;
      return `<figure><div class="window">${view}</div><figcaption>${link}</figcaption></figure>`;
    }).join("");
    const open = isCurrent ? "" : `<a href="${id}.html#main">원래 크기로 열기</a>`;

    toc.insertAdjacentHTML("beforeend", `<li><a href="#${id}">${label}</a></li>`);
    list.insertAdjacentHTML("beforeend", `<section id="${id}"><div class="head"><h2>${label}</h2>${open}</div><p class="desc">${desc}</p><div class="frames">${frames}</div></section>`);
  });
</script>
</body>
</html>
