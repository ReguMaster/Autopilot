<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoPilot 공유용 성과 카드 시안</title>
<style>
@font-face {
    font-family: "Pretendard";
    src: url("../../../desktop/fonts/PretendardVariable.woff2") format("woff2");
    font-weight: 45 920;
    font-display: block;
}

:root {
    --bg: #fff;
    --ink: #1a1f36;
    --ink-2: rgb(26 31 54 / 0.74);
    --muted: #69708a;
    --faint: #a2a7ba;
    --hair: #e7e9f0;
    --hair-strong: #cfd3df;
    --surface: #f6f7fa;
    --accent: #3656d6;
    --add: #1b7f4b;
    --del: #c2372f;
    font-family: "Pretendard", "Segoe UI", "Malgun Gothic", sans-serif;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 48px clamp(16px, 4vw, 56px) 80px;
    background: #eceef4;
    color: var(--ink);
    font-size: 16px;
    word-break: keep-all;
}

.page-head { max-width: 1280px; margin: 0 auto 36px; }
.page-head h1 { margin: 0 0 10px; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
.page-head p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.6; max-width: 640px; }

.grid {
    max-width: 1280px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 580px), 1fr));
    gap: 44px 32px;
    align-items: start;
}

.item { margin: 0; }
.slot { display: block; overflow: hidden; background: #fff; box-shadow: 0 0 0 1px var(--hair-strong), 0 24px 48px -24px rgb(26 31 54 / 0.35); border-radius: 6px; color: inherit; text-decoration: none; }
.slot:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.cap { margin-top: 14px; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; }
.cap b { grid-row: span 2; font-size: 28px; font-weight: 800; color: var(--faint); font-variant-numeric: tabular-nums; line-height: 1; padding-top: 2px; }
.cap strong { font-size: 17px; font-weight: 700; }
.cap span { font-size: 14px; color: var(--muted); line-height: 1.5; }

.back { display: none; margin: 0 auto 20px; max-width: 1280px; font-size: 15px; }
.back a { color: var(--accent); }
body.solo .back { display: block; }
body.solo .grid { display: block; max-width: none; }
body.solo .item { display: none; width: max-content; margin: 0 auto; }
body.solo .item:target { display: block; }
body.solo .slot { cursor: default; }

/* 카드 공통. 크기는 실제 내보낼 픽셀이고 격자에서는 zoom으로만 줄여 보인다 */
.card {
    position: relative;
    overflow: hidden;
    background: #fff;
    color: var(--ink);
    font-family: "Pretendard", sans-serif;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    line-height: 1.3;
}
.card * { margin: 0; }
.wide { width: 1200px; height: 630px; }
.sq { width: 1080px; height: 1080px; }
.tall { width: 1080px; height: 1350px; }
.card img { display: block; }
.u { font-size: 0.5em; font-weight: 500; margin-left: 0.08em; letter-spacing: 0; }
.add { color: var(--add); }
.del { color: var(--del); }

/* 01 큰 숫자 하나 */
.k01 { padding: 56px 72px 52px; display: grid; grid-template-rows: auto 1fr auto; }
.k01 .head { display: flex; justify-content: space-between; align-items: baseline; font-size: 26px; color: var(--muted); }
.k01 .head b { font-size: 30px; color: var(--ink); font-weight: 700; }
.k01 .hero { align-self: center; }
.k01 h2 { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
.k01 .nums { display: flex; align-items: baseline; gap: 36px; line-height: 1; letter-spacing: -0.05em; }
.k01 .before { font-size: 160px; font-weight: 500; color: var(--faint); }
.k01 .after { font-size: 300px; font-weight: 700; color: var(--accent); margin-left: 0; }
.k01 svg { width: 96px; align-self: center; margin-top: 40px; flex: none; }
.k01 .foot { display: flex; justify-content: space-between; align-items: flex-end; }
.k01 .facts { font-size: 26px; line-height: 1.55; color: var(--ink-2); }
.k01 .facts b { font-weight: 700; color: var(--ink); }
.k01 .mark { display: grid; justify-items: end; gap: 8px; }
.k01 .mark img { height: 46px; }
.k01 .mark span { font-size: 22px; color: var(--muted); }

/* 02 명세서 */
.k02 { background: #eceef4; }
.k02 .paper { position: absolute; left: 150px; top: 40px; width: 780px; padding: 48px 64px 52px; background: #fff; box-shadow: 0 1px 0 var(--hair-strong); }
.k02 .paper::after { content: ""; position: absolute; left: 0; right: 0; bottom: -18px; height: 18px; background: radial-gradient(circle at 18px 20px, #eceef4 15px, #fff 16px) 0 0 / 36px 18px repeat-x; }
.k02 h2 { font-size: 46px; font-weight: 800; letter-spacing: -0.03em; }
.k02 .meta { margin-top: 12px; font-size: 26px; color: var(--muted); line-height: 1.5; }
.k02 .rows { margin-top: 28px; padding-top: 26px; border-top: 2px dashed var(--hair-strong); display: grid; gap: 16px; }
.k02 .row { display: flex; align-items: baseline; gap: 14px; font-size: 30px; }
.k02 .row i { flex: 1; border-bottom: 3px dotted var(--hair-strong); transform: translateY(-6px); }
.k02 .row b { font-weight: 700; }
.k02 .gain { margin-top: 30px; padding-top: 30px; border-top: 2px dashed var(--hair-strong); }
.k02 .gain p { font-size: 26px; color: var(--muted); margin-bottom: 18px; }
.k02 .gain .row { font-size: 30px; }
.k02 .gain .row b { color: var(--ink); }
.k02 .gain .row b em { font-style: normal; color: var(--accent); }
.k02 .total { margin-top: 30px; padding-top: 28px; border-top: 2px solid var(--ink); display: flex; justify-content: space-between; align-items: baseline; }
.k02 .total span { font-size: 30px; font-weight: 700; }
.k02 .total b { font-size: 60px; font-weight: 800; color: var(--accent); letter-spacing: -0.03em; }
.k02 .bye { margin-top: 26px; text-align: center; display: grid; justify-items: center; gap: 10px; }
.k02 .bye p { font-size: 26px; color: var(--ink-2); }
.k02 .bye img { height: 54px; }
.k02 .bye span { font-size: 22px; color: var(--muted); }

/* 03 아침 편지 */
.k03 { padding: 56px 80px 52px; display: grid; grid-template-rows: auto 1fr auto; }
.k03 .to { font-size: 26px; color: var(--muted); display: flex; justify-content: space-between; }
.k03 .to b { color: var(--ink); font-weight: 700; }
.k03 .body { align-self: center; max-width: 960px; font-size: 37px; line-height: 1.6; font-weight: 500; letter-spacing: -0.02em; }
.k03 .body p + p { margin-top: 22px; }
.k03 .body b { font-weight: 800; }
.k03 .body .hl { box-shadow: inset 0 -0.34em 0 rgb(54 86 214 / 0.16); font-weight: 700; }
.k03 .sign { display: flex; justify-content: flex-end; align-items: center; gap: 22px; }
.k03 .sign p { font-size: 26px; color: var(--ink-2); text-align: right; line-height: 1.4; }
.k03 .sign p span { display: block; font-size: 22px; color: var(--muted); }
.k03 .sign img { width: 72px; height: 72px; }

/* 04 밤에서 아침까지 */
.k04 { color: #fff; background: linear-gradient(100deg, #0a0f2e 0%, #14226e 55%, #2b49c4 100%); }
.k04 h2 { position: absolute; left: 80px; top: 54px; font-size: 62px; font-weight: 800; letter-spacing: -0.03em; }
.k04 .sub { position: absolute; left: 80px; top: 134px; font-size: 28px; color: rgb(255 255 255 / 0.78); }
.k04 .line { position: absolute; left: 80px; width: 1040px; top: 470px; height: 4px; display: flex; gap: 6px; }
.k04 .line i { flex: 1; background: rgb(255 255 255 / 0.3); border-radius: 2px; }
.k04 .dot { position: absolute; top: 462px; left: calc(80px + var(--t) * 2.2128px - 10px); width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 5px #14226e; }
.k04 .dot.key { background: #9db1ff; width: 28px; height: 28px; top: 458px; left: calc(80px + var(--t) * 2.2128px - 14px); }
.k04 .call { position: absolute; top: 270px; width: 330px; font-size: 25px; line-height: 1.4; padding-left: 16px; border-left: 3px solid #9db1ff; height: 188px; }
.k04 .call b { display: block; font-size: 25px; font-weight: 800; color: #b9c7ff; margin-bottom: 4px; }
.k04 .call.r { text-align: right; padding-left: 0; padding-right: 16px; border-left: 0; border-right: 3px solid #9db1ff; }
.k04 .tick { position: absolute; top: 494px; font-size: 24px; color: rgb(255 255 255 / 0.72); transform: translateX(-50%); }
.k04 .tick.s { transform: none; left: 80px; color: #fff; font-weight: 700; font-size: 28px; top: 492px; }
.k04 .tick.e { transform: translateX(-100%); left: 1120px; color: #fff; font-weight: 700; font-size: 28px; top: 492px; }
.k04 .mark { position: absolute; right: 80px; top: 556px; display: flex; align-items: center; gap: 14px; font-size: 28px; font-weight: 800; }
.k04 .mark img { width: 44px; height: 44px; }
.k04 .mark span { font-size: 22px; font-weight: 500; color: rgb(255 255 255 / 0.7); margin-left: 6px; }
.k04 .count { position: absolute; left: 80px; top: 556px; font-size: 24px; color: rgb(255 255 255 / 0.78); }

/* 05 변경량 */
.k05 { padding: 68px 72px 60px; display: flex; flex-direction: column; }
.k05 .head { display: flex; justify-content: space-between; align-items: baseline; font-size: 26px; color: var(--muted); }
.k05 .head b { font-size: 30px; color: var(--ink); font-weight: 700; }
.k05 h2 { margin-top: 52px; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
.k05 .big { margin-top: 10px; display: flex; gap: 40px; align-items: baseline; font-size: 148px; font-weight: 800; letter-spacing: -0.05em; line-height: 1.05; }
.k05 .ratio { margin-top: 26px; height: 28px; border-radius: 4px; overflow: hidden; display: flex; gap: 4px; }
.k05 .ratio i:first-child { width: 80.45%; background: var(--add); }
.k05 .ratio i:last-child { flex: 1; background: var(--del); }
.k05 .files { margin-top: 30px; display: grid; grid-template-columns: repeat(19, 1fr); gap: 8px; }
.k05 .files i { aspect-ratio: 1; border-radius: 4px; background: var(--add); }
.k05 .files i.r { background: var(--del); }
.k05 .files i.m { background: linear-gradient(135deg, var(--add) 50%, var(--del) 50%); }
.k05 .files-cap { margin-top: 14px; font-size: 24px; color: var(--muted); }
.k05 .hunk { margin-top: 40px; font-size: 27px; line-height: 1.4; }
.k05 .hunk p { display: grid; grid-template-columns: 44px 1fr; padding: 17px 16px 17px 0; border-left: 6px solid var(--add); background: #eaf6ef; }
.k05 .hunk p + p { margin-top: 6px; }
.k05 .hunk b { color: var(--add); font-weight: 800; text-align: center; }
.k05 .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 22px; color: var(--muted); }
.k05 .foot img { height: 42px; }

/* 06 터미널 */
.k06 { background: #0e1220; color: #e6e9f5; padding: 48px 64px 44px; display: flex; flex-direction: column; justify-content: space-between; }
.k06 .log { display: grid; gap: 10px; font-size: 30px; line-height: 1.35; }
.k06 .ln { display: grid; grid-template-columns: 120px 1fr; }
.k06 .ln > span:first-child { color: #7d86a6; }
.k06 .ln .ty { color: #6fd3a0; font-weight: 700; }
.k06 .ln .gn { color: #aeb6d2; font-weight: 600; }
.k06 .ln .af { color: #9db1ff; font-weight: 800; }
.k06 .ln .bf { color: #7d86a6; }
.k06 .gap { height: 8px; }
.k06 .end { color: #fff; font-weight: 700; }
.k06 .prompt { display: flex; align-items: center; gap: 16px; font-size: 28px; font-weight: 700; }
.k06 .prompt em { font-style: normal; color: #9db1ff; }
.k06 .prompt img { width: 40px; height: 40px; }
.k06 .prompt span { font-weight: 500; font-size: 24px; color: #7d86a6; margin-left: 4px; }
.k06 .prompt i { width: 14px; height: 32px; background: #9db1ff; }

/* 07 인증서 */
.k07 { padding: 40px; }
.k07 .frame { position: absolute; inset: 40px; border: 2px solid var(--ink); }
.k07 .frame::before { content: ""; position: absolute; inset: 10px; border: 1px solid var(--hair-strong); }
.k07 .in { position: absolute; inset: 40px; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 40px 60px 36px; }
.k07 h2 { font-size: 60px; font-weight: 800; letter-spacing: -0.03em; }
.k07 .proj { margin-top: 10px; font-size: 36px; font-weight: 600; color: var(--ink-2); }
.k07 .says { margin-top: 28px; font-size: 32px; line-height: 1.55; font-weight: 500; max-width: 780px; }
.k07 .says b { font-weight: 800; }
.k07 svg { margin-top: 36px; width: 320px; height: 320px; flex: none; }
.k07 .stats { margin-top: 40px; display: flex; gap: 70px; font-size: 26px; color: var(--muted); }
.k07 .stats b { display: block; font-size: 44px; color: var(--ink); font-weight: 800; letter-spacing: -0.03em; }
.k07 .by { margin-top: auto; display: grid; justify-items: center; gap: 8px; width: 460px; border-top: 2px solid var(--ink); padding-top: 14px; }
.k07 .by img { height: 40px; }
.k07 .by span { font-size: 22px; color: var(--muted); }

/* 08 신문 1면 */
.k08 { padding: 36px 64px 40px; display: grid; grid-template-rows: auto 1fr auto; }
.k08 .mast { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-bottom: 14px; border-bottom: 5px double var(--ink); font-size: 23px; color: var(--ink-2); }
.k08 .mast .l { justify-self: start; }
.k08 .mast .r { justify-self: end; text-align: right; }
.k08 .mast .c { display: grid; justify-items: center; gap: 4px; }
.k08 .mast img { height: 54px; }
.k08 .mast .c span { font-size: 22px; color: var(--muted); }
.k08 .cols { display: grid; grid-template-columns: 1fr 360px; gap: 0 40px; padding-top: 28px; }
.k08 h2 { font-size: 72px; font-weight: 900; line-height: 1.12; letter-spacing: -0.045em; }
.k08 .lead { margin-top: 20px; font-size: 29px; line-height: 1.5; color: var(--ink-2); font-weight: 500; max-width: 700px; }
.k08 .side { border-left: 1px solid var(--ink); padding-left: 34px; display: grid; gap: 0; align-content: start; }
.k08 .side div { padding: 4px 0 16px; }
.k08 .side div + div { border-top: 1px solid var(--hair-strong); padding-top: 16px; }
.k08 .side b { display: block; font-size: 42px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; }
.k08 .side b i { font-style: normal; color: var(--accent); }
.k08 .side span { font-size: 24px; color: var(--muted); }
.k08 .strip { border-top: 1px solid var(--ink); padding-top: 14px; display: flex; justify-content: space-between; font-size: 24px; color: var(--ink-2); }
.k08 .strip b { color: var(--ink); font-weight: 700; }

/* 09 위젯 */
.k09 { background: #fff; padding: 44px 56px 40px; display: grid; grid-template-rows: auto 1fr auto; gap: 24px; }
.k09 .head { display: flex; justify-content: space-between; align-items: baseline; }
.k09 .head h2 { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; }
.k09 .head span { font-size: 26px; color: var(--muted); }
.k09 .ws { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.k09 .w { background: var(--surface); border-radius: 28px; padding: 28px 30px; display: flex; flex-direction: column; }
.k09 .w p { font-size: 26px; font-weight: 600; color: var(--ink-2); }
.k09 .w .viz { flex: 1; display: grid; place-items: center; }
.k09 .w .cap2 { font-size: 24px; color: var(--muted); }
.k09 .w .cap2 b { color: var(--ink); font-weight: 700; }
.k09 .ring { position: relative; width: 190px; height: 190px; }
.k09 .ring svg { width: 190px; height: 190px; transform: rotate(-90deg); }
.k09 .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 56px; font-weight: 800; letter-spacing: -0.04em; }
.k09 .zero { display: flex; align-items: baseline; gap: 6px; font-size: 130px; font-weight: 800; letter-spacing: -0.05em; color: var(--accent); line-height: 1; }
.k09 .zero .u { font-size: 44px; color: var(--ink-2); }
.k09 .bars { width: 100%; display: grid; gap: 14px; }
.k09 .bars div { display: flex; align-items: center; height: 54px; border-radius: 10px; padding: 0 16px; font-size: 26px; font-weight: 700; }
.k09 .bars .b1 { width: 100%; background: #dfe2ec; color: var(--ink-2); }
.k09 .bars .b2 { width: 65%; background: var(--accent); color: #fff; }
.k09 .foot { display: flex; justify-content: space-between; align-items: center; font-size: 24px; color: var(--ink-2); }
.k09 .foot img { height: 40px; }

/* 10 포스터 */
.k10 { color: #fff; background: linear-gradient(180deg, #0a0f2e 0%, #15216b 52%, #3656d6 100%); padding: 80px 80px 76px; display: flex; flex-direction: column; }
.k10 .top { display: flex; justify-content: space-between; font-size: 28px; color: rgb(255 255 255 / 0.78); }
.k10 .top b { color: #fff; font-weight: 700; }
.k10 h2 { margin-top: 80px; font-size: 212px; font-weight: 900; line-height: 1.02; letter-spacing: -0.06em; }
.k10 h2 .n { color: #b9c7ff; }
.k10 .quote { margin-top: 56px; font-size: 46px; line-height: 1.5; font-weight: 500; max-width: 900px; letter-spacing: -0.02em; }
.k10 .stats { margin-top: auto; display: grid; grid-template-columns: repeat(3, auto); justify-content: space-between; border-top: 2px solid rgb(255 255 255 / 0.4); padding-top: 28px; }
.k10 .stats b { display: block; font-size: 46px; font-weight: 800; letter-spacing: -0.04em; }
.k10 .stats span { font-size: 24px; color: rgb(255 255 255 / 0.8); }
.k10 .lock { margin-top: 56px; display: flex; align-items: center; gap: 24px; }
.k10 .lock img { width: 104px; height: 104px; }
.k10 .lock b { display: block; font-size: 58px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; }
.k10 .lock span { font-size: 26px; color: rgb(255 255 255 / 0.85); }
</style>
</head>
<body>

<header class="page-head">
    <h1>공유용 성과 카드 시안 10종</h1>
    <p>같은 샘플 데이터로 만든 카드예요. 카드는 내보낼 실제 크기(1200×630, 1080×1080, 1080×1350)로 설계했고 여기서는 폭에 맞춰 줄여 보여요. 카드를 누르면 원본 크기로 열려요.</p>
</header>
<p class="back"><a href="#">시안 목록으로</a></p>

<main class="grid">

<figure class="item" id="c01">
<a class="slot" href="#c01" data-w="1200">
<section class="card wide k01">
    <div class="head"><b>orbit-api</b><span>2026년 10월 14일 수요일</span></div>
    <div class="hero">
        <h2>자는 동안 테스트 커버리지를 올렸어요.</h2>
        <div class="nums">
            <span class="before">62<span class="u">%</span></span>
            <svg viewBox="0 0 96 40" fill="none" stroke="#a2a7ba" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h86M72 5l17 15-17 15"/></svg>
            <span class="after">81<span class="u">%</span></span>
        </div>
    </div>
    <div class="foot">
        <div class="facts">
            <div>린트 경고 <b>47개 → 0개</b></div>
            <div>빌드 시간 <b>94초 → 61초</b></div>
        </div>
        <div class="mark"><img src="../../logo.png" alt="AutoPilot"><span>자는 동안 일하는 개발 어시스턴트</span></div>
    </div>
</section>
</a>
<figcaption class="cap"><b>01</b><strong>큰 숫자 하나</strong><span>1200×630. 가장 큰 성과 하나만 Before→After로 키운 카드. 나머지는 한 줄씩만.</span></figcaption>
</figure>

<figure class="item" id="c02">
<a class="slot" href="#c02" data-w="1080">
<section class="card tall k02">
    <div class="paper">
        <h2>어젯밤 작업 명세서</h2>
        <p class="meta">orbit-api<br>2026-10-14 (수) 23:10 → 07:00</p>
        <div class="rows">
            <div class="row"><span>일한 시간</span><i></i><b>7시간 50분</b></div>
            <div class="row"><span>회차</span><i></i><b>9회</b></div>
            <div class="row"><span>남긴 커밋</span><i></i><b>14개</b></div>
            <div class="row"><span>고친 파일</span><i></i><b>38개</b></div>
            <div class="row"><span>추가한 줄</span><i></i><b class="add">+1,284</b></div>
