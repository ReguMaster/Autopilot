<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoPilot 새벽 시안</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="variants.css">
  <script src="mockup.js" defer></script>
</head>
<!-- avoid-ai-design-ignore: K7 (포커스 스타일은 base.css의 :focus-visible에 있다) -->
<body data-v="1" data-state="idle">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <mask id="moonCut"><rect width="48" height="48" fill="#fff"/><circle cx="32" cy="17" r="14" fill="#000"/></mask>
    </defs>
  </svg>

  <main class="stage">
    <div class="hero">
      <div class="brand"><img class="logo" src="../../logo.png" alt="AutoPilot"></div>
      <div class="horizon" aria-hidden="true"><i></i></div>

      <p class="status"><b class="state" id="state">대기 중</b><span class="clock">남은 시간 <b id="clock">06:30:00</b></span></p>
      <p class="bigclock" id="bigclock" aria-hidden="true">06:30:00</p>
      <ol class="rounds" id="rounds" aria-label="지나간 회차"></ol>

      <div class="control">
        <svg class="dial" id="dial" viewBox="0 0 200 200" aria-hidden="true"></svg>
        <button id="main" class="main" type="button">시작</button>
        <button class="split" type="button" aria-expanded="false" aria-controls="panel" aria-label="실행 옵션 펼치기"><i class="chev"></i></button>
        <input class="dial-input sr" type="range" min="0" max="4" step="1" data-bind="effort" aria-label="생각 깊이">
        <b class="dial-name lvname"></b>
      </div>

      <button class="opt-toggle" type="button" aria-expanded="false" aria-controls="panel"><span class="t-label">실행 옵션</span><span class="t-value" id="toggleValue"></span><i class="chev"></i></button>

      <div class="panel" id="panel">
        <div class="group g-model">
          <span class="lbl" id="lblModel">모델</span>
          <div class="models" id="models" role="radiogroup" aria-labelledby="lblModel"></div>
          <div class="stepper">
            <button class="prev" type="button" aria-label="이전 모델"><i class="chev"></i></button>
            <output id="stepModel" aria-live="polite"></output>
            <button class="next" type="button" aria-label="다음 모델"><i class="chev"></i></button>
          </div>
        </div>
        <div class="group g-effort"><span class="lbl">생각 깊이</span><span data-effort-slot></span></div>
        <div class="group g-time"><label class="lbl" for="timePanel">종료</label><input id="timePanel" type="time" data-bind="time"></div>
        <div class="group g-policy">
          <span class="lbl" id="lblPolicy">정책</span>
          <div class="seg" role="radiogroup" aria-labelledby="lblPolicy">
            <label><input type="radio" name="policy" value="자율개선"><span>자율개선</span></label>
            <label><input type="radio" name="policy" value="지시개선"><span>지시개선</span></label>
          </div>
        </div>
      </div>

      <p class="sentence">
        <select data-bind="model" aria-label="모델"></select><span data-josa="model"></span>
        <span data-effort-slot></span><span data-josa="effort"></span> 생각하며
        <input type="time" data-bind="time" aria-label="종료 시각">까지
        <select data-bind="policy" aria-label="개선 정책"><option value="자율개선">자율개선</option><option value="지시개선">지시개선</option></select>해요
      </p>

      <p class="cli">
        <span class="cmd">autopilot</span>
        <input type="text" inputmode="numeric" maxlength="5" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" data-bind="time" aria-label="종료 시각 (HH:mm)">
        <select data-bind="policy" aria-label="개선 정책"><option value="자율개선">auto</option><option value="지시개선">todo</option></select>
        <span class="flag">--model</span> <select data-bind="model" aria-label="모델"></select>
        <span class="flag">--effort</span> <span data-effort-slot></span>
      </p>

      <p class="pend" id="pend" hidden>바꾼 옵션은 다음 회차부터 적용돼요</p>

      <ol class="lines" id="lines" aria-live="off"></ol>
    </div>
  </main>

  <dialog id="modal" aria-labelledby="modalTitle">
    <form method="dialog">
      <h2 id="modalTitle">지금 강제 종료할까요?</h2>
      <p>진행 중인 회차를 바로 끊어요. commit하지 않은 변경은 파일에 그대로 남아요.</p>
      <div class="btns">
        <button value="cancel">계속 진행</button>
        <button value="kill" class="kill">강제 종료</button>
      </div>
    </form>
  </dialog>

  <nav class="picker" aria-label="시안 선택"><span id="vname"></span><span id="nums"></span></nav>
</body>
</html>
