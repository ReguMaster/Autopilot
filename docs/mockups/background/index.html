<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>배경 오브젝트 시안 - 두 번째</title>
<style>
:root { --ink: #1a1f36; --muted: #69708a; --hair: #e7e9f0; --accent: #3656d6; }
* { box-sizing: border-box; margin: 0; }
body { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; padding: 32px; background: #eef0f6; color: var(--ink); font: 14px/1.5 system-ui, "Malgun Gothic", sans-serif; }
figure { display: grid; gap: 8px; }
figcaption { max-width: 360px; color: var(--muted); font-size: 12px; text-align: center; }

.window { position: relative; display: flex; flex-direction: column; width: 360px; height: 520px; overflow: hidden; border-radius: 12px; background: #fff; box-shadow: 0 8px 30px rgba(26, 31, 54, 0.12); }
.header { height: 40px; padding: 12px 20px; font-weight: 700; }
.stage { position: relative; z-index: 1; flex: 1; padding: 56px 28px 0; }
.stage h1 { font-size: 26px; line-height: 1.3; letter-spacing: -0.02em; }
.stage p { margin-top: 12px; color: var(--muted); }
.composer { position: relative; z-index: 1; margin: 12px; padding: 14px; border-radius: 14px; background: #fff; box-shadow: inset 0 0 0 1px var(--hair); color: var(--muted); }
.bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; }

/* A. 거대한 시간 글자: 종료 시각이 윤곽선 글자로 배경에 깔린다. 실행 중에는 남은 시간으로 바뀐다 */
.bigtime { position: absolute; left: 50%; bottom: 70px; translate: -50% 0; font-size: 132px; font-weight: 800; letter-spacing: -0.06em; line-height: 1; font-variant-numeric: tabular-nums; color: transparent; -webkit-text-stroke: 1.2px #dfe2ec; white-space: nowrap; }
.bigtime i { font-style: normal; color: var(--accent); -webkit-text-stroke: 0; opacity: 0.1; animation: blink 2s steps(2, jump-none) infinite; }
.bigcap { position: absolute; left: 0; right: 0; bottom: 214px; text-align: center; color: #b4b9cc; font-size: 11px; letter-spacing: 0.2em; }
@keyframes blink { 50% { opacity: 0; } }

/* B. 시간대별 하늘: 밤에는 달과 별, 낮에는 해. 선으로만 그린 작은 일러스트가 화면 모서리에 걸쳐 있다 */
.sky svg { position: absolute; right: -40px; top: 250px; width: 210px; height: 230px; fill: none; stroke: #cdd1e2; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.sky .star { stroke: #b9bfd6; animation: twinkle 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.sky .star:nth-of-type(2) { animation-delay: 1.1s; }
.sky .star:nth-of-type(3) { animation-delay: 2.1s; }
.sky .accent { stroke: var(--accent); opacity: 0.55; }
@keyframes twinkle { 50% { opacity: 0.15; scale: 0.7; } }

/* C. 조종사 눈: 동그란 눈 한 쌍이 커서를 따라 보고 가끔 깜빡인다. 일하는 중이면 눈동자가 파랑 */
.eyes { position: absolute; left: 50%; bottom: 96px; display: flex; gap: 14px; translate: -50% 0; }
.eye { position: relative; width: 44px; height: 52px; border-radius: 50%; background: #f4f5fa; box-shadow: inset 0 0 0 1px var(--hair); animation: blinkeye 5s infinite; }
.eye b { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; border-radius: 50%; background: var(--ink); opacity: 0.8; }
.eye b::after { content: ""; position: absolute; left: 4px; top: 3px; width: 5px; height: 5px; border-radius: 50%; background: #fff; }
.eyes[data-run] .eye b { background: var(--accent); }
@keyframes blinkeye { 0%, 94%, 100% { scale: 1 1; } 97% { scale: 1 0.08; } }

@media (prefers-reduced-motion: reduce) { .bg * { animation: none !important; } }
</style>
</head>
<body>
<figure>
    <div class="window">
        <div class="header">AutoPilot</div>
        <div class="stage">
            <h1>오늘 밤에는 Kirikomodo에 무엇을 해 둘까요? 🌙</h1>
            <p>적어 주신 일을 07:00까지 하나씩 해 두고, 남는 시간에는 스스로 고칠 곳을 찾아볼게요.</p>
        </div>
        <div class="bg"><div class="bigcap">종료 시각</div><div class="bigtime">07<i>:</i>00</div></div>
        <div class="composer">처리할 작업을 한 줄에 하나씩…</div>
    </div>
    <figcaption>A. 거대한 시간 — 설정한 종료 시각이 윤곽선 글자로 깔려요. 실행 중엔 같은 자리가 남은 시간 카운트다운이 돼요(가장 정보가 있는 배경)</figcaption>
</figure>

<figure>
    <div class="window sky">
        <div class="header">AutoPilot</div>
        <div class="stage">
            <h1>오늘 밤에는 Kirikomodo에 무엇을 해 둘까요? 🌙</h1>
            <p>적어 주신 일을 07:00까지 하나씩 해 두고, 남는 시간에는 스스로 고칠 곳을 찾아볼게요.</p>
        </div>
        <div class="bg">
            <svg viewBox="0 0 230 230" aria-hidden="true">
                <path d="M150 40A82 82 0 1 0 195 150 66 66 0 0 1 150 40Z" />
                <path class="accent" d="M150 40A66 66 0 0 0 195 150" />
                <path class="star" d="M38 52v14M31 59h14" />
                <path class="star" d="M92 22v10M87 27h10" />
                <path class="star" d="M30 150v10M25 155h10" />
            </svg>
        </div>
        <div class="composer">처리할 작업을 한 줄에 하나씩…</div>
    </div>
    <figcaption>B. 시간대 하늘 — 인사말 이모지와 짝을 이루는 선 그림이에요. 밤엔 달과 반짝이는 별, 낮엔 해와 구름으로 바뀌어요</figcaption>
</figure>

<figure>
    <div class="window">
        <div class="header">AutoPilot</div>
        <div class="stage">
            <h1>오늘 밤에는 Kirikomodo에 무엇을 해 둘까요? 🌙</h1>
            <p>적어 주신 일을 07:00까지 하나씩 해 두고, 남는 시간에는 스스로 고칠 곳을 찾아볼게요.</p>
        </div>
        <div class="bg"><div class="eyes" id="eyes"><div class="eye"><b></b></div><div class="eye"><b></b></div></div></div>
        <div class="composer">처리할 작업을 한 줄에 하나씩…</div>
    </div>
    <figcaption>C. 조종사의 눈 — 눈 한 쌍이 마우스를 따라 보고 가끔 깜빡여요. 실행 중엔 눈동자가 파랑이 돼 "지켜보는 중"을 알려요(마우스를 움직여 보세요)</figcaption>
</figure>
<script>
const eyes = document.getElementById("eyes");
addEventListener("pointermove", (event) => {
    for (const pupil of eyes.querySelectorAll("b")) {
        const box = pupil.parentElement.getBoundingClientRect();
        const dx = event.clientX - (box.left + box.width / 2);
        const dy = event.clientY - (box.top + box.height / 2);
        const scale = Math.min(1, 120 / Math.hypot(dx, dy));
        pupil.style.translate = `${dx * scale * 0.12}px ${dy * scale * 0.12}px`;
    }
});
</script>
</body>
</html>
