<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoPilot 컴포저 시안 - 모델·Effort</title>
<style>
@font-face { font-family: "Pretendard"; src: url("../../../desktop/fonts/PretendardVariable.woff2") format("woff2-variations"); font-weight: 45 920; }
:root {
    --bg: #fff; --ink: #1a1f36; --ink-2: rgb(26 31 54 / 0.74); --muted: #69708a; --faint: #a2a7ba;
    --hair: #e7e9f0; --hair-strong: #cfd3df; --surface: #f6f7fa; --chip: #f1f2f7;
    --accent: #3656d6; --del: #c2372f; --off: #d5d8e2;
    --shadow: 0 0 0 1px var(--hair), 0 28px 56px -22px rgb(26 31 54 / 0.32);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box; }
body { margin: 0; padding: 40px 24px 80px; background: #e9ecf1; color: var(--ink); font: 14px/1.55 "Pretendard", "Malgun Gothic", sans-serif; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
main { max-width: 1320px; margin: 0 auto; }
h1 { margin: 0 0 6px; font-size: 24px; font-weight: 800; }
.lead { margin: 0 0 18px; max-width: 76ch; color: var(--muted); }
.toc { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px 16px; margin: 0 0 40px; padding: 0; list-style: none; }
.toc a { display: flex; gap: 8px; color: var(--ink); text-decoration: none; padding: 3px 0; border-bottom: 1px solid #d5dae3; }
.toc a:hover { border-color: var(--ink); }
.toc b { width: 22px; color: var(--muted); font-weight: 600; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 620px), 1fr)); gap: 44px 28px; }
.card { scroll-margin-top: 20px; }
.card h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 2px; font-size: 18px; font-weight: 750; }
.card h2 span { color: var(--muted); font-size: 14px; font-weight: 600; }
.desc { margin: 0 0 8px; max-width: 70ch; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 12px; padding: 0; list-style: none; }
.tags li { padding: 1px 9px; border-radius: 999px; background: #dde1ea; color: var(--ink-2); font-size: 12px; }

.win { width: 600px; max-width: 100%; border-radius: 10px; background: #fff; box-shadow: 0 1px 2px rgb(20 30 50 / 0.12), 0 8px 28px rgb(20 30 50 / 0.12); }
.stage { height: 250px; padding: 28px 28px 0; overflow: hidden; border-radius: 10px 10px 0 0; color: var(--faint); font-size: 28px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; }
.stage p { margin: 0; }
.stage .now { color: var(--ink); opacity: .86; }
.bar { display: flex; align-items: center; gap: 5px; padding: 10px 10px 10px 12px; border-top: 1px solid var(--hair); }
.slot { position: relative; flex: none; }
.ctx { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 9px; border-radius: 999px; color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; opacity: .7; }
.go { display: inline-flex; align-items: center; gap: 8px; height: 36px; margin-left: auto; padding: 0 14px 0 12px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 650; }
.go i { width: 10px; height: 10px; background: currentColor; clip-path: polygon(10% 0, 100% 50%, 10% 100%); }

/* 아이콘 */
.ic { flex: none; width: 16px; height: 16px; }
.eg { display: inline-flex; flex: none; align-items: center; justify-content: center; }
.eg.lv3 { color: #d9822b; }
.eg.lv4 { color: var(--del); }
.bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 13px; }
.bars i { width: 3px; border-radius: 1px; background: var(--off); }
.bars i:nth-child(1) { height: 5px; } .bars i:nth-child(2) { height: 7px; } .bars i:nth-child(3) { height: 9px; } .bars i:nth-child(4) { height: 11px; } .bars i:nth-child(5) { height: 13px; }
.bars i.on { background: currentColor; }
kbd { padding: 0 6px; border-radius: 5px; background: var(--chip); box-shadow: inset 0 0 0 1px var(--hair-strong); color: var(--muted); font: 600 12px/18px "Pretendard", sans-serif; }

/* 알약 */
.chip { position: relative; display: inline-flex; flex: none; align-items: center; gap: 6px; height: 32px; padding: 0 9px; border: 0; border-radius: 999px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--hair); font-size: 13px; font-weight: 600; white-space: nowrap; transition: box-shadow .2s var(--ease), background-color .2s var(--ease); }
.chip:hover, .chip[aria-expanded="true"] { box-shadow: inset 0 0 0 1px var(--hair-strong); }
.chip:active { scale: 0.97; }
.chev { width: 11px; height: 11px; fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: rotate .3s var(--ease); }
.chip[aria-expanded="true"] .chev { rotate: 180deg; }
.en { width: 3.6em; text-align: left; }
.vr { width: 1px; height: 14px; background: var(--hair-strong); }
.chip kbd { margin-left: 2px; }
.card[data-chip="ghost"] .chip { background: none; box-shadow: none; }
.card[data-chip="ghost"] .chip:hover, .card[data-chip="ghost"] .chip[aria-expanded="true"] { background: var(--chip); box-shadow: none; }
.card[data-chip="sq"] .chip { border-radius: 9px; }
.card[data-chip="glass"] .chip { box-shadow: 0 1px 2px rgb(26 31 54 / 0.08), inset 0 0 0 1px var(--hair); }
.card[data-chip="ink"] .chip { --off: #5b6280; background: var(--ink); color: #fff; box-shadow: none; }
.card[data-chip="ink"] .chip .chev { stroke: #aeb4cc; }
.card[data-chip="ink"] .vr { background: #4a5170; }
.card[data-chip="tint"] .model-slot .chip, .card[data-chip="tint"] .chip.merged { background: var(--mt); color: var(--ink); box-shadow: none; }
.card[data-chip="icon"] .chip { width: 36px; height: 36px; justify-content: center; padding: 0; }
.card[data-chip="icon"] .chip .t, .card[data-chip="icon"] .chip .chev { display: none; }
.card[data-chip="icon"] .chip .ic { width: 20px; height: 20px; }
.card[data-chip="icon"] .chip[data-tip]:hover:not([aria-expanded="true"])::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; translate: -50% 0; padding: 3px 9px; border-radius: 7px; background: var(--ink); color: #fff; font-size: 12px; white-space: nowrap; }
.card[data-chip="text"] .chip { padding: 0 8px; background: none; box-shadow: none; }
.card[data-chip="text"] .chip:hover, .card[data-chip="text"] .chip[aria-expanded="true"] { background: var(--chip); }
.card[data-chip="text"] .chip .t.nm { font-weight: 700; font-size: 14px; }
.card[data-chip="text"] .chip .en { color: var(--muted); font-weight: 500; }
.group { display: flex; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--hair-strong); }
.group .chip { box-shadow: none; background: none; }
.group .chip:hover, .group .chip[aria-expanded="true"] { background: var(--chip); box-shadow: none; }
.group .slot + .slot::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 1px; background: var(--hair-strong); }
.seg5 { display: inline-flex; align-items: center; gap: 2px; height: 32px; padding: 3px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--hair); }
.seg5 button { width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--muted); font-size: 13px; font-weight: 650; }
.seg5 button:hover { background: var(--chip); }
.seg5 button.sel { background: var(--ink); color: #fff; }
.seg5-name { margin: 0 4px 0 6px; width: 3.6em; color: var(--ink-2); font-size: 13px; font-weight: 600; }

/* 팝오버 */
.pop { position: absolute; bottom: calc(100% + 8px); left: 0; z-index: 5; display: none; width: 240px; max-width: calc(100vw - 48px); padding: 6px; border-radius: 16px; background: var(--bg); color: var(--ink); box-shadow: var(--shadow); text-align: left; }
.pop.open { display: block; }
.pop.static { position: static; display: block; box-shadow: 0 0 0 1px var(--hair-strong); }
.pop.w280 { width: 280px; } .pop.w300 { width: 304px; } .pop.w220 { width: 220px; } .pop.fit { width: max-content; } .pop.wide { width: 576px; }
.specs { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px; margin-top: 14px; }
.spec p { margin: 0 0 4px; color: var(--muted); font-size: 12px; font-weight: 600; }
.sec { margin: 8px 10px 2px; color: var(--muted); font-size: 12px; font-weight: 600; }
.hint { margin: 4px 10px 6px; color: var(--muted); font-size: 12px; }
.hint b { color: var(--ink); font-weight: 650; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "i t k" "i d k"; align-items: center; column-gap: 10px; width: 100%; min-height: 44px; padding: 6px 10px; border: 0; border-radius: 10px; background: none; color: var(--ink-2); text-align: left; }
.opt > .ic, .opt > .eg { grid-area: i; min-width: 18px; }
.opt b { grid-area: t; font-weight: 600; line-height: 1.3; }
.opt small { grid-area: d; color: var(--muted); font-size: 12px; line-height: 1.4; }
.opt kbd { grid-area: k; }
.opt:hover { background: var(--surface); }
.opt.sel { background: var(--chip); color: var(--ink); }
.opt .ic { width: 20px; height: 20px; }
.gridm { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.gcard { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px; border: 0; border-radius: 12px; background: none; box-shadow: inset 0 0 0 1px var(--hair); text-align: left; }
.gcard .ic { width: 28px; height: 28px; margin-bottom: 6px; }
.gcard b { font-weight: 650; }
.gcard small { color: var(--muted); font-size: 12px; }
.gcard:hover { background: var(--surface); }
.gcard.sel { background: var(--chip); box-shadow: inset 0 0 0 1.5px var(--ink); }
.tabs { display: flex; gap: 4px; }
.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 8px; border: 0; border-radius: 12px; background: none; color: var(--muted); font-size: 13px; font-weight: 600; }
.tabs .ic { width: 26px; height: 26px; }
.tabs button:hover { background: var(--surface); }
.tabs button.sel { background: var(--chip); color: var(--ink); }
.rich { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 10px; background: none; text-align: left; }
.rich:hover { background: var(--surface); }
.rich.sel { background: var(--chip); }
.rich .ic { grid-row: span 2; width: 22px; height: 22px; align-self: center; }
.rich b { font-weight: 650; }
.rich b small { margin-left: 6px; color: var(--muted); font-size: 12px; font-weight: 400; }
.meters { display: flex; gap: 12px; color: var(--muted); font-size: 12px; }
.meters span { display: inline-flex; align-items: center; gap: 4px; }
.meters i { display: inline-flex; gap: 2px; }
.meters i s { width: 5px; height: 5px; border-radius: 50%; background: var(--off); }
.meters i s.on { background: var(--ink); }
.row5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.row5 button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 62px; border: 0; border-radius: 10px; background: none; color: var(--ink-2); font-size: 12px; font-weight: 600; }
.row5 button:hover { background: var(--surface); }
.row5 button.sel { background: var(--chip); color: var(--ink); }
.row5 .eg { zoom: 1.2; }
.seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 3px; border-radius: 10px; background: var(--chip); }
.seg button { height: 32px; border: 0; border-radius: 8px; background: none; color: var(--muted); font-size: 12px; font-weight: 600; }
.seg button.sel { background: #fff; box-shadow: 0 1px 3px rgb(26 31 54 / 0.18); color: var(--ink); }
.slider { position: relative; height: 28px; margin: 14px 20px 4px; }
.slider .track { position: absolute; top: 13px; left: 0; right: 0; height: 2px; border-radius: 2px; background: var(--hair-strong); }
.slider .track i { display: block; height: 100%; border-radius: 2px; background: var(--ink); }
.slider .stop { position: absolute; top: 14px; width: 14px; height: 14px; padding: 0; translate: -50% -50%; border: 0; border-radius: 50%; background: var(--hair-strong); box-shadow: 0 0 0 3px #fff; }
.slider .stop.on { background: var(--ink); }
.slider .stop.cur { width: 20px; height: 20px; background: #fff; box-shadow: 0 0 0 1.5px var(--ink), 0 2px 6px rgb(26 31 54 / 0.25); }
.ladder { position: relative; padding: 2px 0; }
.ladder::before { content: ""; position: absolute; left: 22px; top: 24px; bottom: 24px; width: 2px; background: var(--hair); }
.rung { position: relative; display: grid; grid-template-columns: 32px minmax(0, 1fr); grid-template-areas: "d t" "d s"; align-items: center; width: 100%; min-height: 42px; padding: 4px 10px 4px 6px; border: 0; border-radius: 10px; background: none; text-align: left; color: var(--ink-2); }
.rung:hover { background: var(--surface); }
.rung i { grid-area: d; justify-self: center; width: 10px; height: 10px; border-radius: 50%; background: var(--off); box-shadow: 0 0 0 3px #fff; }
.rung:hover i { box-shadow: 0 0 0 3px var(--surface); }
.rung.on i { background: var(--ink); }
.rung.sel i { width: 14px; height: 14px; background: #fff; box-shadow: 0 0 0 2px var(--ink); }
.rung b { grid-area: t; font-weight: 600; line-height: 1.25; }
.rung small { grid-area: s; color: var(--muted); font-size: 12px; }
.rung.sel b { color: var(--ink); }
.dial { position: relative; width: 240px; height: 160px; margin: 4px auto 0; }
.dial svg { position: absolute; inset: 0; }
.dial path { fill: none; stroke: var(--hair-strong); stroke-width: 3; stroke-linecap: round; }
.dial line { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.dp { position: absolute; width: 30px; height: 30px; padding: 0; translate: -50% -50%; border: 0; border-radius: 50%; background: var(--chip); color: var(--muted); font-size: 12px; font-weight: 650; box-shadow: 0 0 0 3px #fff; }
.dp.on { background: var(--ink); color: #fff; }
.dp.cur { width: 34px; height: 34px; background: var(--accent); }
.dial-c { position: absolute; left: 50%; top: 122px; translate: -50% 0; text-align: center; }
.dial-c b { display: block; font-size: 16px; font-weight: 700; line-height: 1.2; }
.dial-c small { color: var(--muted); font-size: 12px; }
.stepper { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 4px; padding: 6px; }
.stepper > button { height: 40px; border: 0; border-radius: 12px; background: var(--chip); font-size: 20px; font-weight: 500; }
.stepper > button:hover { background: var(--hair); }
.stepper > div { display: flex; flex-direction: column; align-items: center; gap: 0; }
.stepper .eg { zoom: 1.5; margin-bottom: 4px; }
.stepper b { font-size: 16px; font-weight: 700; line-height: 1.2; }
.stepper small { color: var(--muted); font-size: 12px; }
.matrix { display: grid; grid-template-columns: 104px repeat(5, 48px); gap: 2px; padding: 6px; }
.matrix em { align-self: end; padding-bottom: 4px; color: var(--muted); font-size: 12px; font-style: normal; font-weight: 600; text-align: center; }
.matrix .rl { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; font-weight: 600; }
.matrix .rl .ic { width: 18px; height: 18px; }
.cell { height: 40px; padding: 0; border: 0; border-radius: 10px; background: none; display: grid; place-items: center; }
.cell i { width: 8px; height: 8px; border-radius: 50%; background: var(--off); transition: scale .2s var(--ease); }
.cell:hover { background: var(--surface); }
.cell:hover i { scale: 1.5; background: var(--muted); }
.cell.sel { background: var(--accent); }
.cell.sel i { width: 10px; background: #fff; }
.cell.hl { background: var(--surface); }
.cell.sel:hover { background: var(--accent); }
.sheet { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; max-width: 600px; margin-top: 14px; padding: 12px 16px; border-radius: 12px; background: #f4f6fa; }
.sg { display: flex; gap: 16px; }
.si { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 40px; }
.si .ic { width: 30px; height: 30px; }
.si .eg { zoom: 1.6; height: 30px; }
.si small { color: var(--muted); font-size: 12px; }
.sd { width: 1px; align-self: stretch; background: #d5dae3; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="g-fable" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#9a9df5"/><stop offset="1" stop-color="#4a4fc4"/></radialGradient>
    <radialGradient id="g-opus" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#f6b878"/><stop offset="1" stop-color="#c8691a"/></radialGradient>
    <radialGradient id="g-sonnet" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#63cfd4"/><stop offset="1" stop-color="#17777c"/></radialGradient>
    <radialGradient id="g-haiku" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#a3dc92"/><stop offset="1" stop-color="#3c8a30"/></radialGradient>
  </defs>
</svg>
<main>
  <h1>컴포저 모델·Effort 시안 24종</h1>
  <p class="lead">하단 알약 줄의 모델·Effort 아이콘과 메뉴를 새로 그린 시안이에요. 1번이 지금 앱이고 2번부터 새 안이에요. 알약을 누르면 메뉴가 위로 열리고 값을 눌러 바꿀 수 있어요. 창 아래에는 아이콘 시트와 메뉴 펼침 모습이 있어요. 모델별 속도·깊이·비용 점 수(21번)는 느낌을 보이는 예시예요.</p>
  <ul class="toc" id="toc"></ul>
  <div class="grid-cards" id="list"></div>
</main>
<script>
const MODELS = [["fable", "Fable", "가장 깊게"], ["opus", "Opus", "기본값"], ["sonnet", "Sonnet", "균형"], ["haiku", "Haiku", "가볍고 빠르게"]];
const LEVELS = [["Low", "가장 빠르게"], ["Medium", "가볍게"], ["High", "기본값"], ["XHigh", "더 깊게"], ["Max", "가장 깊게"]];
const RANK = { haiku: 0, sonnet: 1, opus: 2, fable: 3 };
const MC = { fable: ["#5b5fd3", "#ecedfb"], opus: ["#d9822b", "#fbeee0"], sonnet: ["#1f8a90", "#e0f2f3"], haiku: ["#4a9a3d", "#e5f2e1"] };
const METER = { fable: [1, 5, 5], opus: [2, 4, 4], sonnet: [3, 3, 2], haiku: [5, 2, 1] };
const NAME = Object.fromEntries(MODELS.map(([id, n]) => [id, n]));

const svg = (body, vb = "0 0 24 24") => `<svg class="ic" viewBox="${vb}" aria-hidden="true">${body}</svg>`;
const ST = 'fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"';
const SF = 'fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"';
const F = on => (on ? "currentColor" : "var(--off)");
const sin = d => Math.sin((d * Math.PI) / 180);
const cos = d => Math.cos((d * Math.PI) / 180);
const wedge = (cx, cy, r, deg) => (deg >= 360 ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="currentColor"/>` : `<path d="M${cx} ${cy}L${cx} ${cy - r}A${r} ${r} 0 ${deg > 180 ? 1 : 0} 1 ${cx + r * sin(deg)} ${cy - r * cos(deg)}Z" fill="currentColor"/>`);
const letter = (id, fill) => `<text x="12" y="16.6" text-anchor="middle" font-size="12" font-weight="750" font-family="Pretendard,sans-serif" fill="${fill}">${NAME[id][0]}</text>`;

// 모델 아이콘 계열
const M = {
    tile: id => svg({
        fable: '<rect width="24" height="24" rx="7" fill="#5b5fd3"/><path d="M14 6.6A6.4 6.4 0 1 0 17.5 15 5 5 0 0 1 14 6.6Z" fill="#fff"/><path d="M17.6 6.6l.6 1.3 1.3.6-1.3.6-.6 1.3-.6-1.3-1.3-.6 1.3-.6Z" fill="#ffd27a"/>',
        opus: '<rect width="24" height="24" rx="7" fill="#d9822b"/><path d="M12 5.2l5.9 3.4v6.8L12 18.8l-5.9-3.4V8.6Z" fill="#fff" fill-opacity=".28" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><path d="M6.1 8.6 12 12l5.9-3.4M12 12v6.8" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>',
        sonnet: '<rect width="24" height="24" rx="7" fill="#1f8a90"/><path d="M6 9.2c2-2 4-2 6 0s4 2 6 0M6 14.8c2-2 4-2 6 0s4 2 6 0" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>',
        haiku: '<rect width="24" height="24" rx="7" fill="#4a9a3d"/><path d="M6.5 17.5C6.5 10.5 10.5 6.5 17.5 6.5 17.5 13.5 13.5 17.5 6.5 17.5Z" fill="#fff"/><path d="M6.5 17.5 13 11" fill="none" stroke="#4a9a3d" stroke-width="1.4" stroke-linecap="round"/>'
    }[id]),
    line: id => svg({
        fable: `<path d="M14.5 5A7.2 7.2 0 1 0 19 15.5 5.8 5.8 0 0 1 14.5 5Z" ${ST}/><circle cx="18.5" cy="6" r="1.1" fill="currentColor"/>`,
        opus: `<path d="M12 3.5 19 7.6v8.8L12 20.5 5 16.4V7.6Z" ${ST}/><path d="M5 7.6 12 11.8l7-4.2M12 11.8v8.7" ${ST}/>`,
        sonnet: `<path d="M4.5 9.5c2.5-2.6 4.5-2.6 7.5 0s5 2.6 7.5 0M4.5 15c2.5-2.6 4.5-2.6 7.5 0s5 2.6 7.5 0" ${ST}/>`,
        haiku: `<path d="M5 19C5 10.5 9.5 5 19 5c0 9.5-5.5 14-14 14ZM5 19l8-8" ${ST}/>`
    }[id]),
    poly: id => svg({
        haiku: `<path d="M12 5 19.5 18h-15Z" ${SF}/>`,
        sonnet: `<rect x="5.5" y="5.5" width="13" height="13" rx="2.5" ${SF}/>`,
        opus: `<path d="M12 4.2 19.6 9.8l-2.9 8.9H7.3L4.4 9.8Z" ${SF}/>`,
        fable: `<path d="M12 3.6 19.4 7.8v8.4L12 20.4 4.6 16.2V7.8Z" ${SF}/>`
    }[id]),
    rings: id => svg(Array.from({ length: RANK[id] + 1 }, (_, i) => (i === 0 ? '<circle cx="12" cy="12" r="2.2" fill="currentColor"/>' : `<circle cx="12" cy="12" r="${2.2 + i * 3}" fill="none" stroke="currentColor" stroke-width="1.6"/>`)).join("")),
    orb: id => svg(`<circle cx="12" cy="12" r="9.5" fill="url(#g-${id})"/><ellipse cx="9.4" cy="8.4" rx="3.4" ry="2.1" fill="#fff" fill-opacity=".4"/>`),
    mono: id => svg(`<circle cx="12" cy="12" r="9" ${ST}/>${letter(id, "currentColor")}`),
    layers: id => svg(Array.from({ length: RANK[id] + 1 }, (_, i) => `<path d="M5 ${17 - i * 4}l7-4 7 4" ${ST}/>`).join("")),
    dots4: id => svg([[12, 18], [6, 12], [18, 12], [12, 6]].map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="2.7" fill="${F(i <= RANK[id])}"/>`).join("")),
    pie: id => svg(`<circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.6"/>${wedge(12, 12, 8.6, (RANK[id] + 1) * 90)}`),
    grow: id => svg({
        haiku: `<path d="M12 19c-3 0-5-2-5-4.5 0-3 2.5-5.2 5-7.8 2.5 2.600 5 4.800 5 7.800 0 2.500-2 4.500-5 4.500Z" ${ST}/>`,
        sonnet: `<path d="M12 20v-8M12 12c0-3-2-5-5.500-5 0 3.500 2 5 5.500 5ZM12 14.500c0-2.500 1.800-4.500 5-4.500 0 3-1.800 4.500-5 4.500Z" ${ST}/>`,
        opus: `<path d="M12 20.500v-6M12 3.800a5.500 5.500 0 0 0-3.600 9.700h7.200A5.500 5.500 0 0 0 12 3.800Z" ${ST}/>`,
        fable: `<path d="M3.500 19.500 9.500 9.500l4 6.500 2-3 5 6.500Z" ${ST}/><circle cx="17.500" cy="6" r="2" ${ST}/>`
    }[id]),
    gradtile: id => svg(`<rect width="24" height="24" rx="7" fill="url(#g-${id})"/>${letter(id, "#fff")}`),
    dot: id => svg(`<circle cx="12" cy="12" r="5.200" fill="${MC[id][0]}"/>`)
};

// Effort 아이콘 계열 (level 0~4)
const gl = (w, h, body) => `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${body}</svg>`;
const E = {
    bars: l => `<span class="bars">${[0, 1, 2, 3, 4].map(i => `<i class="${i <= l ? "on" : ""}"></i>`).join("")}</span>`,
    dots: l => gl(32, 8, [0, 1, 2, 3, 4].map(i => `<circle cx="${3.2 + i * 6.4}" cy="4" r="2.4" fill="${F(i <= l)}"/>`).join("")),
    ring: l => gl(18, 18, `<circle cx="9" cy="9" r="6.500" fill="none" stroke="var(--off)" stroke-width="2.400"/><circle cx="9" cy="9" r="6.500" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-dasharray="${(40.84 * (l + 1)) / 5} 41" transform="rotate(-90 9 9)"/>`),
    lines: l => gl(16, 16, [0, 1, 2, 3, 4].map(i => `<path d="M2 ${2.5 + i * 3}h12" stroke="${F(i >= 4 - l)}" stroke-width="1.600" stroke-linecap="round"/>`).join("")),
    wave: l => gl(18, 16, `<path d="M1 8q2-${1 + l * 1.7} 4 0t4 0t4 0t4 0" fill="none" stroke="currentColor" stroke-width="1.700" stroke-linecap="round"/>`),
    batt: l => gl(26, 12, `<rect x=".75" y=".75" width="21.500" height="10.500" rx="2.500" fill="none" stroke="currentColor" stroke-width="1.300"/><rect x="23.500" y="4" width="2" height="4" rx="1" fill="currentColor"/>${[0, 1, 2, 3, 4].map(i => `<rect x="${2.600 + i * 3.700}" y="2.600" width="2.800" height="6.800" rx=".8" fill="${F(i <= l)}"/>`).join("")}`),
    stairs: l => {
        const P = [];
        for (let i = 0; i < 5; i++) { P.push([1 + 3.4 * i, 13 - 2.4 * i], [1 + 3.4 * (i + 1), 13 - 2.4 * i]); }
        const path = pts => "M" + pts.map(p => p.join(" ")).join("L");
        const on = P.slice(0, 2 * (l + 1));
        const end = on[on.length - 1];
        return gl(19, 16, `<path d="${path(P)}" fill="none" stroke="var(--off)" stroke-width="1.600" stroke-linejoin="round"/><path d="${path(on)}" fill="none" stroke="currentColor" stroke-width="1.600" stroke-linejoin="round"/><circle cx="${end[0] - 1.7}" cy="${end[1] - 2.600}" r="1.700" fill="currentColor"/>`);
    },
    arcs: l => gl(16, 16, `<circle cx="2" cy="14" r="1.400" fill="currentColor"/>${[0, 1, 2, 3, 4].map(i => { const r = 3 + 2.5 * i; return `<path d="M${2 + r} 14A${r} ${r} 0 0 0 2 ${14 - r}" fill="none" stroke="${F(i <= l)}" stroke-width="1.500" stroke-linecap="round"/>`; }).join("")}`),
    digit: l => gl(18, 18, `<circle cx="9" cy="9" r="7.500" fill="none" stroke="currentColor" stroke-width="1.500"/><text x="9" y="12.600" text-anchor="middle" font-size="10" font-weight="750" font-family="Pretendard,sans-serif" fill="currentColor">${l + 1}</text>`),
    pie: l => gl(18, 18, `<circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.400"/>${wedge(9, 9, 7, (l + 1) * 72)}`),
    dial: l => { const a = -120 + 60 * l; return gl(18, 18, `<circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.500"/><path d="M9 9L${9 + 5 * sin(a)} ${9 - 5 * cos(a)}" stroke="currentColor" stroke-width="1.800" stroke-linecap="round"/>`); },
    pills: l => gl(28, 12, [0, 1, 2, 3, 4].map(i => `<rect x="${1 + i * 5.400}" y="1" width="4" height="10" rx="2" fill="${F(i <= l)}"/>`).join("")),
    heat: l => `<span class="bars">${[0, 1, 2, 3, 4].map(i => `<i class="${i <= l ? "on" : ""}" style="${i <= l ? "background:" + ["#6ea8ff", "#4fbfb0", "#9ad05a", "#f0b440", "#e5604d"][i] : ""}"></i>`).join("")}</span>`
};

const eg = (v, l) => `<span class="eg lv${l}">${E[v.ei](l)}</span>`;
const mi = (v, id) => M[v.mi](id);
const combo = (v, s) => `<svg class="ic" style="width:26px;height:26px" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.500" fill="none" stroke="var(--off)" stroke-width="2.200"/><circle cx="13" cy="13" r="11.500" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-dasharray="${(72.26 * (s.e + 1)) / 5} 73" transform="rotate(-90 13 13)"/><circle cx="13" cy="13" r="7.500" fill="url(#g-${s.m})"/><ellipse cx="11" cy="10.600" rx="2.600" ry="1.600" fill="#fff" fill-opacity=".4"/></svg>`;
const chev = '<svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5l3-3"/></svg>';
const kb = k => `<kbd>${k}</kbd>`;

// 모델 메뉴
const MM = {
    list: (v, s) => MODELS.map(([id, n, d]) => `<button class="opt${s.m === id ? " sel" : ""}" data-m="${id}">${mi(v, id)}<b>${n}</b><small>${d}</small></button>`).join(""),
    kbd: (v, s) => MODELS.map(([id, n, d], i) => `<button class="opt${s.m === id ? " sel" : ""}" data-m="${id}">${mi(v, id)}<b>${n}</b><small>${d}</small>${kb(i + 1)}</button>`).join(""),
    grid: (v, s) => `<div class="gridm">${MODELS.map(([id, n, d]) => `<button class="gcard${s.m === id ? " sel" : ""}" data-m="${id}">${mi(v, id)}<b>${n}</b><small>${d}</small></button>`).join("")}</div>`,
    tabs: (v, s) => `<div class="tabs">${MODELS.map(([id, n]) => `<button class="${s.m === id ? "sel" : ""}" data-m="${id}">${mi(v, id)}${n}</button>`).join("")}</div><p class="hint"><b>${NAME[s.m]}</b> ${MODELS.find(m => m[0] === s.m)[2]}</p>`,
    cards: (v, s) => MODELS.map(([id, n, d]) => `<button class="rich${s.m === id ? " sel" : ""}" data-m="${id}">${mi(v, id)}<b>${n}<small>${d}</small></b><span class="meters">${["속도", "깊이", "비용"].map((t, k) => `<span>${t}<i>${[0, 1, 2, 3, 4].map(j => `<s class="${j < METER[id][k] ? "on" : ""}"></s>`).join("")}</i></span>`).join("")}</span></button>`).join("")
};

// Effort 메뉴
const opts = (v, s, key) => LEVELS.map(([n, d], l) => `<button class="opt${s.e === l ? " sel" : ""}" data-e="${l}">${eg(v, l)}<b>${n}</b><small>${d}</small>${key ? kb(l + 1) : ""}</button>`).join("");
const EM = {
    list: (v, s) => opts(v, s, false),
    kbd: (v, s) => opts(v, s, true),
    row: (v, s) => `<div class="row5">${LEVELS.map(([n], l) => `<button class="${s.e === l ? "sel" : ""}" data-e="${l}">${eg(v, l)}${n}</button>`).join("")}</div><p class="hint"><b>${LEVELS[s.e][0]}</b> ${LEVELS[s.e][1]}</p>`,
    seg: (v, s) => `<div class="seg">${LEVELS.map(([n], l) => `<button class="${s.e === l ? "sel" : ""}" data-e="${l}">${n}</button>`).join("")}</div><p class="hint"><b>${LEVELS[s.e][0]}</b> ${LEVELS[s.e][1]}</p>`,
    slider: (v, s) => `<div class="slider"><div class="track"><i style="width:${s.e * 25}%"></i></div>${LEVELS.map(([n], l) => `<button class="stop${l <= s.e ? " on" : ""}${l === s.e ? " cur" : ""}" data-e="${l}" style="left:${l * 25}%" aria-label="${n}"></button>`).join("")}</div><p class="hint"><b>${LEVELS[s.e][0]}</b> ${LEVELS[s.e][1]}</p>`,
    ladder: (v, s) => `<div class="ladder">${[4, 3, 2, 1, 0].map(l => `<button class="rung${l <= s.e ? " on" : ""}${l === s.e ? " sel" : ""}" data-e="${l}"><i></i><b>${LEVELS[l][0]}</b><small>${LEVELS[l][1]}</small></button>`).join("")}</div>`,
    dial: (v, s) => {
        const pts = [0, 1, 2, 3, 4].map(i => [120 + 88 * sin(-75 + 37.5 * i), 112 - 88 * cos(-75 + 37.5 * i)]);
        return `<div class="dial"><svg viewBox="0 0 240 160" aria-hidden="true"><path d="M${pts[0].join(" ")}A88 88 0 0 1 ${pts[4].join(" ")}"/><line x1="120" y1="112" x2="${pts[s.e][0]}" y2="${pts[s.e][1]}"/></svg>${pts.map((p, i) => `<button class="dp${i <= s.e ? " on" : ""}${i === s.e ? " cur" : ""}" data-e="${i}" style="left:${p[0]}px;top:${p[1]}px" aria-label="${LEVELS[i][0]}">${i + 1}</button>`).join("")}<div class="dial-c"><b>${LEVELS[s.e][0]}</b><small>${LEVELS[s.e][1]}</small></div></div>`;
    },
    stepper: (v, s) => `<div class="stepper"><button data-e="${Math.max(s.e - 1, 0)}" aria-label="낮추기">−</button><div>${eg(v, s.e)}<b>${LEVELS[s.e][0]}</b><small>${LEVELS[s.e][1]}</small></div><button data-e="${Math.min(s.e + 1, 4)}" aria-label="높이기">+</button></div>`
};
const matrix = (v, s) => `<div class="matrix"><span></span>${LEVELS.map(([n]) => `<em>${n}</em>`).join("")}${MODELS.map(([id, n]) => `<b class="rl">${mi(v, id)}${n}</b>${LEVELS.map(([ln], l) => `<button class="cell${s.m === id && s.e === l ? " sel" : ""}${(s.m === id) !== (s.e === l) ? " hl" : ""}" data-m="${id}" data-e="${l}" aria-label="${n} ${ln}"><i></i></button>`).join("")}`).join("")}</div><p class="hint"><b>${NAME[s.m]}</b> ${LEVELS[s.e][0]}</p>`;

// 알약
const modelChip = (v, s, k = "model") => `<button type="button" class="chip" data-toggle="${k}" aria-expanded="${s.open === k}" data-tip="${NAME[s.m]}">${mi(v, s.m)}<span class="t nm">${NAME[s.m]}</span>${v.kbd ? kb("M") : ""}${chev}</button>`;
const effortChip = (v, s, k = "effort") => `<button type="button" class="chip" data-toggle="${k}" aria-expanded="${s.open === k}" data-tip="Effort ${LEVELS[s.e][0]}">${eg(v, s.e)}<b class="t en">${LEVELS[s.e][0]}</b>${v.kbd ? kb("E") : ""}${chev}</button>`;
const mergedChip = (v, s) => `<button type="button" class="chip merged" data-toggle="all" aria-expanded="${s.open === "all"}" data-tip="${NAME[s.m]} ${LEVELS[s.e][0]}">${v.combo ? combo(v, s) : mi(v, s.m)}<span class="t nm">${NAME[s.m]}</span>${v.combo ? "" : `<i class="vr"></i>${eg(v, s.e)}`}<b class="t en">${LEVELS[s.e][0]}</b>${chev}</button>`;

const LAYOUT = {
    split: (v, s) => [
        { k: "model", slotId: "model-slot", chip: modelChip(v, s), pop: MM[v.mm](v, s), cap: "모델 메뉴" },
        { k: "effort", chip: effortChip(v, s), pop: EM[v.em](v, s), cap: "Effort 메뉴" }
    ],
    splitpill: (v, s) => [
        { k: "model", chip: modelChip(v, s), pop: MM[v.mm](v, s), cap: "모델 메뉴" },
        { k: "effort", chip: effortChip(v, s), pop: EM[v.em](v, s), cap: "Effort 메뉴" }
    ],
    iconly: (v, s) => [
        { k: "model", chip: modelChip(v, s), pop: MM[v.mm](v, s), cap: "모델 메뉴" },
        { k: "effort", chip: effortChip(v, s), pop: EM[v.em](v, s), cap: "Effort 메뉴" }
    ],
    merged: (v, s) => [{ k: "all", chip: mergedChip(v, s), pop: `<p class="sec">모델</p>${MM[v.mm](v, s)}<p class="sec">Effort</p>${EM[v.em](v, s)}`, keep: true, cap: "통합 메뉴" }],
    matrix: (v, s) => [{ k: "all", chip: mergedChip(v, s), pop: matrix(v, s), keep: true, cap: "모델 × Effort 표", cls: "fit" }],
    seg5: (v, s) => [
        { k: "model", slotId: "model-slot", chip: modelChip(v, s), pop: MM[v.mm](v, s), cap: "모델 메뉴" },
        { inline: `<div class="seg5" role="group" aria-label="Effort">${LEVELS.map(([n], l) => `<button type="button" class="${s.e === l ? "sel" : ""}" data-e="${l}" title="${n}">${l + 1}</button>`).join("")}</div><span class="seg5-name">${LEVELS[s.e][0]}</span>` }
    ]
};

const VARIANTS = [
    { n: "지금 앱 (기준)", d: "현재 구현 그대로예요. 색 입힌 둥근 타일과 다섯 막대, 목록 메뉴. 아래 새 안들과 비교하는 기준이에요.", mi: "tile", ei: "bars", layout: "split", chip: "pill", mm: "list", em: "list", cls: "w220" },

    { n: "오브", d: "빛이 비치는 구슬 네 개로 모델을 구분해요. 모델은 가로 탭, Effort는 눈금 슬라이더로 골라요.", mi: "orb", ei: "dots", layout: "split", chip: "glass", mm: "tabs", em: "slider", cls: "w300" },

    { n: "레이어와 배터리", d: "모델은 겹겹이 쌓이는 레이어 수로, Effort는 배터리 칸 수로 표시해요. 단계는 +/- 스테퍼로 한 칸씩 올리고 내려요.", mi: "layers", ei: "batt", layout: "split", chip: "sq", mm: "list", em: "stepper", cls: "w220" },
    { n: "통합 알약", d: "알약 하나에 모델과 Effort를 함께 담아 바 공간을 아껴요. 누르면 한 패널에서 모델 탭과 Effort 가로 버튼을 같이 골라요.", mi: "dots4", ei: "dots", layout: "merged", chip: "pill", mm: "tabs", em: "row", cls: "w300" },

    { n: "아이콘만", d: "글자를 빼고 아이콘 둘만 둔 가장 작은 바예요. 마우스를 올리면 이름이 말풍선으로 떠요. Effort는 전파가 퍼져 나가듯 호가 늘어나요.", mi: "line", ei: "arcs", layout: "iconly", chip: "icon", mm: "list", em: "row", cls: "w300" },
    { n: "모델 × Effort 표", d: "두 값을 따로 고르지 않고 4×5 표의 한 칸을 눌러 한 번에 정해요. 현재 모델 행과 Effort 열이 옅게 보여 위치가 한눈에 보여요.", mi: "rings", ei: "dots", layout: "matrix", chip: "pill" },
    { n: "한 장 패널", d: "통합 알약을 눌러 여는 한 장짜리 패널이에요. 위에 모델 구슬 탭, 아래에 Effort 슬라이더가 있어 설정 흐름이 위에서 아래로 이어져요.", mi: "orb", ei: "bars", layout: "merged", chip: "glass", mm: "tabs", em: "slider", cls: "w300" },
    { n: "넓은 트레이", d: "알약을 누르면 바 폭 전체로 트레이가 펼쳐져요. 큰 아이콘 탭과 가로 구간 선택을 한눈에 비교할 수 있어요.", mi: "gradtile", ei: "pills", layout: "merged", chip: "pill", mm: "tabs", em: "seg", cls: "wide" },
    { n: "분할 알약", d: "알약 한 덩어리를 가운데 선으로 나눠 왼쪽은 모델, 오른쪽은 Effort로 쓰는 안이에요. 두 값이 한 쌍이라는 인상을 줘요.", mi: "mono", ei: "bars", layout: "splitpill", chip: "pill", mm: "list", em: "list", cls: "w220" },
    { n: "다이얼", d: "Effort를 부채꼴 다이얼 위 다섯 점으로 골라요. 바늘이 선택한 단계를 가리키고 가운데에 이름이 떠요. 모델은 변의 수 아이콘이에요.", mi: "poly", ei: "dial", layout: "split", chip: "sq", mm: "list", em: "dial", cls: "w280" },
    { n: "숫자 단계", d: "Effort를 1~5 숫자로 읽어요. 점 네 개의 모델 아이콘과 합쳐 가장 조용한 인상이에요. 키보드로 +/- 하기 좋아요.", mi: "dots4", ei: "digit", layout: "split", chip: "glass", mm: "list", em: "stepper", cls: "w220" },
    { n: "온도계", d: "Effort 막대가 파랑에서 빨강으로 물드는 안에 모델 구슬을 합쳤어요. 단계는 세로 사다리로 보여 위로 갈수록 깊어져요.", mi: "orb", ei: "heat", layout: "split", chip: "pill", mm: "list", em: "ladder", cls: "w220" },
    { n: "명령 팔레트", d: "알약과 메뉴 항목에 단축키(M·E, 1~5)를 달았어요. 키보드로 빠르게 바꾸는 개발자용 느낌이에요.", mi: "line", ei: "bars", layout: "split", chip: "pill", mm: "kbd", em: "kbd", kbd: true, cls: "w220" },
    { n: "스펙 카드", d: "모델을 속도·깊이·비용 점 수와 함께 보여줘요. 어떤 모델을 고를지 판단 근거가 메뉴 안에 있어요. 수치는 느낌을 보이는 예시예요.", mi: "tile", ei: "bars", layout: "split", chip: "pill", mm: "cards", em: "list", cls: "w300" },
    { n: "활자", d: "아이콘을 최소로 줄이고 이름만 굵게 둔 타이포그래피 중심 안이에요. 모델은 색 점 하나, Effort는 가는 점 다섯으로 표시해요.", mi: "dot", ei: "dots", layout: "split", chip: "text", mm: "list", em: "seg", cls: "w300" },
    { n: "링 콤보", d: "모델 구슬을 Effort 게이지 고리가 감싸는 합성 아이콘이에요. 알약 하나에 아이콘 하나로 두 값이 읽혀요.", mi: "orb", ei: "ring", layout: "merged", chip: "glass", mm: "list", em: "row", combo: true, cls: "w300" },
    { n: "인라인 구간", d: "Effort는 메뉴 없이 바에 항상 보이는 1~5 구간 버튼이에요. 클릭 한 번으로 바꾸고, 현재 이름이 옆에 붙어요. 모델만 알약 메뉴로 열려요.", mi: "mono", ei: "pills", layout: "seg5", chip: "pill", mm: "list", cls: "w220" }
];

const LABEL = {
    mi: { tile: "컬러 타일", line: "선 아이콘", poly: "다각형", rings: "동심원", orb: "구슬", mono: "이니셜", layers: "레이어", dots4: "점 4개", pie: "파이", grow: "성장", gradtile: "그라데이션 타일", dot: "색 점" },
    ei: { bars: "막대", dots: "점", ring: "고리 게이지", lines: "줄", wave: "파형", batt: "배터리", stairs: "계단", arcs: "전파 호", digit: "숫자", pie: "파이", dial: "다이얼", pills: "구간 칸", heat: "온도 막대" },
    layout: { split: "알약 2개", splitpill: "분할 알약", iconly: "아이콘 알약", merged: "통합 알약", matrix: "통합 알약", seg5: "인라인 구간" },
    mm: { list: "목록", kbd: "단축키 목록", grid: "2×2 카드", tabs: "가로 탭", cards: "스펙 카드" },
    em: { list: "목록", kbd: "단축키 목록", row: "아이콘 버튼", seg: "구간 선택", slider: "슬라이더", ladder: "사다리", dial: "다이얼", stepper: "스테퍼" }
};

const STATE = VARIANTS.map(() => ({ m: "opus", e: 2, open: null }));

const bar = (v, s) => {
    const items = LAYOUT[v.layout](v, s);
    const slots = items.map(it => (it.inline ? it.inline : `<div class="slot${it.slotId ? " " + it.slotId : ""}">${it.chip}<div class="pop ${it.cls || v.cls || ""}${s.open === it.k ? " open" : ""}"${it.keep ? " data-keep" : ""}>${it.pop}</div></div>`)).join("");
    const tint = `style="--mc:${MC[s.m][0]};--mt:${MC[s.m][1]}"`;
    return `<div class="stage" ${tint}><p>다음 작업을 고르고 있어요.</p><p class="now">중복된 검증 로직을 하나로 묶는 중이에요.</p></div><div class="bar" ${tint}>${v.layout === "splitpill" ? `<div class="group">${slots}</div>` : slots}<span class="ctx">자율개선</span><span class="ctx">07:00</span><span class="go"><i></i>시작</span></div>`;
};
const specs = (v, s) => LAYOUT[v.layout](v, s).filter(it => !it.inline).map(it => `<div class="spec"><p>${it.cap}</p><div class="pop static ${it.cls || v.cls || ""}">${it.pop}</div></div>`).join("");
const sheet = v => `<div class="sheet"><div class="sg">${MODELS.map(([id, n]) => `<div class="si">${mi(v, id)}<small>${n}</small></div>`).join("")}</div><i class="sd"></i><div class="sg">${LEVELS.map(([n], l) => `<div class="si">${eg(v, l)}<small>${n}</small></div>`).join("")}</div></div>`;

const refresh = i => {
    const live = document.querySelector(`.live[data-i="${i}"]`);
    live.innerHTML = `<div class="win">${bar(VARIANTS[i], STATE[i])}</div><div class="specs">${specs(VARIANTS[i], STATE[i])}</div>`;
};

const list = document.getElementById("list");
const toc = document.getElementById("toc");
VARIANTS.forEach((v, i) => {
    const num = String(i + 1).padStart(2, "0");
    const tags = [LABEL.mi[v.mi], "Effort " + LABEL.ei[v.ei], LABEL.layout[v.layout], "모델 메뉴 " + (v.layout === "matrix" ? "표" : LABEL.mm[v.mm]), "Effort 메뉴 " + (v.layout === "matrix" ? "표" : v.em ? LABEL.em[v.em] : "바 안 버튼")];
    toc.insertAdjacentHTML("beforeend", `<li><a href="#v${num}"><b>${num}</b>${v.n}</a></li>`);
    list.insertAdjacentHTML("beforeend", `<article class="card" id="v${num}" data-chip="${v.chip}"><h2><span>${num}</span>${v.n}</h2><p class="desc">${v.d}</p><ul class="tags">${tags.map(t => `<li>${t}</li>`).join("")}</ul><div class="live" data-i="${i}"></div>${sheet(v)}</article>`);
    refresh(i);
});

document.addEventListener("click", ev => {
    const t = ev.target;
    const live = t.closest(".live");
    let touched = -1;

    if (live) {
        touched = Number(live.dataset.i);
        const s = STATE[touched];
        const tog = t.closest("[data-toggle]");
        const pm = t.closest("[data-m]");
        const pe = t.closest("[data-e]");

        if (tog) {
            s.open = s.open === tog.dataset.toggle ? null : tog.dataset.toggle;
        } else if (pm || pe) {
            if (pm) { s.m = pm.dataset.m; }
            if (pe) { s.e = Number(pe.dataset.e); }
            if (!t.closest("[data-keep]") && !t.closest(".seg5") && !t.closest(".static")) { s.open = null; }
        } else if (!t.closest(".pop")) {
            s.open = null;
        }
        refresh(touched);
    }

    STATE.forEach((s, i) => {
        if (i !== touched && s.open) { s.open = null; refresh(i); }
    });
});
</script>
</body>
</html>
