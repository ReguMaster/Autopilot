name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check tag matches version
        shell: bash
        run: |
          app_version="v$(node -p "require('./package.json').version")"
          test "$app_version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, app $app_version"; exit 1; }
      - run: npm run format:check:cli
      - run: npm run format:check:desktop
      - run: npm run test:cli
      - run: npm run test:desktop
      - run: npm test
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: dist/AutoPilot-*.exe
  release:
    needs: [desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
