name: Release
on:
  push:
    tags:
      - 'v*'
  # 태그 없이 눌러 배포 파일이 세 운영체제에서 만들어지는지만 확인할 수 있다(릴리스는 올리지 않는다).
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          app_version="v$(node -p "require('./package.json').version")"
          test "$app_version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, app $app_version"; exit 1; }
      - run: npm run format:check:cli
      - run: npm run format:check:desktop
      - run: npm run test:cli
      - run: npm run test:desktop
      - run: npm test
  desktop:
    needs: [verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: npm run dist -- --publish never
            assets: dist/AutoPilot-*.exe
            artifact: desktop-windows
          - os: macos-latest
            dist: npm run dist:mac -- --publish never
            assets: |
              dist/AutoPilot-*.dmg
              dist/AutoPilot-*.zip
            artifact: desktop-mac
          - os: ubuntu-latest
            dist: npm run dist:linux -- --publish never
            assets: |
              dist/AutoPilot-*.AppImage
              dist/AutoPilot-*.deb
            artifact: desktop-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
  release:
    needs: [desktop]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
